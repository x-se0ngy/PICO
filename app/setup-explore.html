<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/app/manifest.json">
<meta name="theme-color" content="#fffad3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PICO">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>PICO · 탐험 취향</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .nav-quit { display: block; padding: 0; }
  /* Figma 1.2.2 / 1.2.3 선택 카드: 162.5×74, 테두리만 있는 종이.
     고르면 라임 종이가 되고, 뒤에 -1.8° 기울어진 종이 한 장이 비쳐요 (큰 버튼과 같은 두 장 종이). */
  .pick-grid { position: absolute; left: 20px; top: 228.02px; width: 335px; display: grid; grid-template-columns: 162.5px 162.5px; column-gap: 9.92px; row-gap: 10px; }
  .pick { position: relative; width: 162.5px; height: 74px; text-align: left; border: 1px solid var(--ink); background: transparent;
    display: flex; flex-direction: column; align-items: flex-start; padding: 0 0 0 11.8px; }
  .pick::before { content: ''; position: absolute; left: -1.62px; top: -1px; width: 160.541px; height: 74px; background: var(--lime); border: 1px solid var(--ink); box-sizing: border-box;
    transform: rotate(-1.8deg); z-index: -1; opacity: 0; transition: opacity var(--dur) var(--ease); }
  .pick[aria-checked="true"] { background: var(--lime); transform: translate(1.93px, -.3px); }
  .pick[aria-checked="true"]::before { opacity: 1; }
  .pick-grid { isolation: isolate; }
  .pick { padding-top: 14.73px; gap: 8px; }
  .pick .t { font-size: 20px; line-height: 22.46px; white-space: nowrap; }
  .pick .s { font-size: 14px; line-height: 13.46px; white-space: nowrap; }
  .pick-grid { left: 21.93px; top: 228.02px; column-gap: 8.76px; row-gap: 10.36px; }

  /* disabled CTA look (1.3.1). Still clickable so the toast can explain why. */
  /* look lives in base.css (.cta.is-off) */

  /* info toast (1.3.3) — blue card with offset shadow, not the base black pill */
  .toast.toast--info { left: 39.83px; top: 640.68px; transform: none; width: 290px; height: 45px; padding: 0 0 0 13.17px;
    gap: 10px; background: #00b7ff; color: var(--ink); border: 1px solid var(--ink); box-shadow: 5.34px 4.99px 0 var(--ink); }
  .toast--info img { width: 24px; height: 24px; }

</style>
</head><body>
<div class="phone warm setup" style="--h:812px">
  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <!-- no back button in the frame: the logo area asks to quit (shared .ox팝업 via data-confirm) -->
    <div class="nav nav--center"><a class="nav-quit" href="home.html" data-confirm="프로필 설정을 중단할까요?" aria-label="프로필 설정 중단"><img class="logo" src="assets/common/logo-mark.png" alt="PICO"></a></div>
  </div>

  <div class="progress" aria-label="3단계 중 3단계"><span class="on"></span><span class="on"></span><span class="on"></span></div>

  <div class="step-title" style="top:162px">
    <p class="q"><span>03.</span><span>곤충에 대해 얼마나 아나요?</span></p>
    <p class="sub">알려 주면 관찰 질문과 TIP을 내 수준에 맞춰 줄게요.</p>
  </div>

  <div class="pick-grid" id="cards" role="radiogroup" aria-label="곤충을 얼마나 아는지 (하나 고르기)"></div>

  <div class="toast toast--info" id="toast" role="status" hidden><img src="assets/onboarding/toast-alert.png" alt=""><span>답변을 선택해주세요.</span></div>

  <button type="button" class="cta" id="next" style="top:708.07px"><span class="cta-face">다음 <img id="nextArrow" src="assets/icons/outline/arrow-right.svg" alt=""></span></button>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script>
(function () {
  // 03 곤충에 대해 얼마나 아나요? (하나) → 관찰 질문과 TIP 수준 (Figma 1.2.3)
  var CARDS = [
    ['처음이에요', '곤충 탐험이 처음이에요'], ['몇 개 알아요', '무당벌레, 나비 정도'],
    ['꽤 알아요', '10가지는 말할 수 있어요'], ['곤충 박사예요', '어디 사는지도 알아요']
  ];
  var state = document.documentElement.dataset.state;
  var picked = state === 'picked' ? [0] : []; // nothing picked until the child chooses → grey CTA
  var grid = document.getElementById('cards'), next = document.getElementById('next'),
      arrow = document.getElementById('nextArrow'), toast = document.getElementById('toast'), toastTimer;
  var QUIT = '프로필 설정을 중단할까요?';
  function openQuit() { if (!document.querySelector('.phone > .ox')) window.picoConfirm(QUIT, 'home.html'); }

  grid.innerHTML = CARDS.map(function (c, i) {
    return '<button type="button" class="pick" role="radio" data-i="' + i + '"><span class="t">' + c[0] + '</span><span class="s">' + c[1] + '</span></button>';
  }).join('');

  function render() {
    grid.querySelectorAll('.pick').forEach(function (b) { var on = picked.indexOf(+b.dataset.i) > -1; b.setAttribute('aria-pressed', String(on)); b.setAttribute('aria-checked', String(on)); });
    var off = picked.length === 0;
    next.classList.toggle('is-off', off);
    if (!off) toast.hidden = true;
  }
  function showToast(sticky) {
    toast.hidden = false; clearTimeout(toastTimer);
    if (!sticky) toastTimer = setTimeout(function () { toast.hidden = true; }, 2000);
  }

  grid.addEventListener('click', function (e) {
    var b = e.target.closest('.pick'); if (!b) return;
    picked = [+b.dataset.i];   // 하나만 골라요
    render();
  });
  next.addEventListener('click', function () {
    if (!picked.length) { showToast(false); return; }
    try {
      localStorage.setItem('pico.level', CARDS[picked[0]][0]);
    } catch (e) {}
    location.href = 'setup-done.html';
  });

  document.addEventListener('keydown', function (e) {
    if (e.key !== 'Escape') return;
    var no = document.querySelector('.phone > .ox .ox-no'); if (no) no.click(); else openQuit();
  });
  // browser back → ask before leaving
  try {
    history.pushState({ guard: 1 }, '');
    window.addEventListener('popstate', function () { history.pushState({ guard: 1 }, ''); openQuit(); });
  } catch (e) {}

  render();
  if (state === 'toast') showToast(true);
  if (state === 'quit') openQuit();
})();
</script>
</body></html>
