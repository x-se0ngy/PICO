<script>
  // 아직 안 접은 그림이 있으면 "종이로 접는 중" 화면이 첫 프레임부터 떠 있어야 해요
  // (접을 모양을 계산하는 동안 완성된 카드가 먼저 보이지 않게). 본문이 그려지기 전에 표시해 둬요.
  try {
    var d0 = JSON.parse(sessionStorage.getItem('pico.drawing') || 'null');
    var still0 = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    if (d0 && d0.src && !d0.folded && !still0 && !new URLSearchParams(location.search).get('state')) document.documentElement.classList.add('fold-pending');
  } catch (e) {}
</script>
<style>
  .nav-actions { display: flex; gap: 10px; align-items: center; }
  /* Figma 3683:19821 관찰 카드 완성 — 라임 카드(잉크 선) + 뒤에 3.37° 기울어진 라임 종이 한 장(검정 선), 아래 노트 */
  .headline { position: absolute; left: 0; top: 118px; width: 375px; text-align: center; font-family: var(--font-hand); font-size: 24px; white-space: nowrap; }
  .card-back { position: absolute; left: 24.36px; top: 174.3px; width: 326.285px; height: 335px; background: var(--lime); border: 1px solid #000; transform: rotate(3.37deg); }
  .card { position: absolute; left: 24.2px; top: 174.45px; width: 325.917px; height: 335px; background: var(--lime); border: 1px solid var(--ink); }
  .card-photo { position: absolute; left: 33.15px; top: 187.95px; width: 308px; height: 250px; object-fit: cover; background: #d8ff7d; }
  /* 곤충 단계(사진 왼쪽 위) · 꼼꼼 관찰(이름 줄 오른쪽) */
  .gr.card-gr { left: 39.15px; top: 193.95px; }
  .look { position: absolute; left: 249.34px; top: 467.75px; width: 92px; text-align: right; white-space: nowrap; }
  .look .lk-t { display: block; font-size: 11px; line-height: 14px; }
  .look .lk-s { display: block; font-size: 17px; line-height: 20px; letter-spacing: 1px; }
  .meta { position: absolute; top: 447.95px; font-size: 16px; white-space: nowrap; }
  .name { position: absolute; left: 33.15px; top: 466.95px; font-size: 24px; white-space: nowrap; }
  .rec-h { position: absolute; left: 19.81px; top: 533.6px; font-size: 14px; line-height: normal; white-space: nowrap; }
  .diary-box { position: absolute; left: 19.81px; top: 555.6px; width: 337px; height: 117.4px; border: 1px solid var(--ink); }
  .note-pink { position: absolute; left: 45.31px; top: 563.18px; width: 2px; height: 102.24px; }
  .diary-lines { position: absolute; left: 33.31px; top: 566.58px; width: 310px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
  .diary-lines p { padding: 0 0 0 26px; font-family: var(--font-hand); font-size: 14px; line-height: 20px; white-space: nowrap; max-width: 310px; overflow: hidden; text-overflow: ellipsis; }
  .diary-lines img { width: 310px; }
  /* Figma 3683:19821: 그린 그림을 담은 작은 액자 (검은 그림자 11.9° · 연두 액자 7.96° · 크림 창 7.96°) */
  .pico-frame > * { position: absolute; transform: rotate(7.96deg); border: 1px solid var(--ink); }
  .pf-shadow { left: 185.78px; top: 418.25px; width: 55.893px; height: 62.88px; background: var(--ink); transform: rotate(11.9deg); }
  .pf-face { left: 184.07px; top: 416.51px; width: 55.893px; height: 62.88px; background: var(--lime); }
  .pf-win { left: 188.32px; top: 420.78px; width: 48.929px; height: 48.008px; background: #fffad7; overflow: hidden; }
  .pf-win img { width: 100%; height: 100%; object-fit: contain; }
  /* 그린 그림이 없을 때(바로 이 화면을 열었을 때)는 시안의 접은 무당벌레 */
  .pf-sample { position: absolute; left: 188.51px; top: 422.96px; width: 48.541px; height: 43.641px; }
</style>
</head><body>
<div class="phone soft" style="--h:812px">

  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav">

        <a href="home.html" aria-label="닫기"><img class="icon" src="assets/icons/outline/close.svg" alt=""></a>
      </div>
    </div>
  </div>

  <p class="headline">관찰 카드가 완성 됐어요!</p>

  <div class="card-back"></div>
  <div class="card"></div>
  <img class="card-photo" data-photo src="assets/capture/card-photo-ladybug.png" alt="관찰한 곤충 사진">
  <div class="pico-frame" role="img" aria-label="내가 그린 PICO">
    <span class="pf-shadow"></span><span class="pf-face"></span><span class="pf-win" id="picoWin"></span>
  </div>

  <span class="gr card-gr" id="cardGr"></span>
  <p class="look" id="look" hidden><span class="lk-t">꼼꼼 관찰</span><span class="lk-s" id="lookStars"></span></p>
  <p class="meta" style="left:33.15px">NO.023</p>
  <p class="meta" style="left:104.15px" id="group">딱정벌레류</p>
  <p class="meta" style="left:272.15px">27.10.08</p>
  <p class="name" data-species>칠성무당벌레</p>

  <p class="rec-h" id="tag">내 관찰 기록</p>
  <div class="diary-box"></div>
  <img class="note-pink" src="assets/capture/card-note-pink.svg" alt="">
  <div class="diary-lines" id="diaryLines"></div>

  <div class="tcard is-fixed" id="toast" role="status" hidden></div>

  <!-- 종이로 접는 중 (Figma Warm-Up 촬영 8~10): html.fold-pending 일 때만 보여요 -->
  <div class="ai-wait fold-wait" id="foldWait" role="status" aria-live="polite">
    <div class="ai-board"><i class="ai-lime"></i><div class="ai-photo"><canvas width="440" height="440"></canvas></div></div>
    <div class="ai-text fold-text"><p class="ai-title fold-title">내 그림을 종이로 접고 있어요.</p><p class="ai-sub fold-sub">관찰한 특징을 하나씩 담아볼게요.</p></div>
    <div class="ai-dots fold-dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>
  </div>

  <a class="cta" id="release" href="home.html?state=field" style="top:707.17px"><span class="cta-face">들판에 놓아주기 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></a>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script src="photo.js"></script>
<script src="ai.js"></script>
<script src="grade.js"></script>
<script src="field.js"></script>
<script src="origami.js"></script>
<script>
  // 촬영 1에서 AI가 알아본 곤충 이름 · 분류 (AI를 못 쓰면 예시)
  var AI = PicoAI.current();
  document.querySelector('[data-species]').textContent = AI.name;
  document.getElementById('group').textContent = AI.group;

  // 곤충 단계 (자주 만나는 · 조금 찾아야 하는 · 관찰하기 어려운) — 곤충 종마다 정해져 있어요
  (function () {
    var g = PicoGrade.of(AI.name), el = document.getElementById('cardGr');
    el.className = 'gr card-gr gr-' + g; el.textContent = PicoGrade.TIERS[g].short; el.title = PicoGrade.TIERS[g].name + ' 곤충';
    // 꼼꼼 관찰: 촬영 2에서 고른 답이 AI가 사진에서 본 것과 얼마나 같았는지 (낮아도 별 1개 — 틀렸다고 하지 않아요)
    var lk = PicoGrade.look();
    if (lk) {
      var box = document.getElementById('look'); box.hidden = false;
      document.getElementById('lookStars').textContent = lk.stars;
      box.setAttribute('aria-label', '꼼꼼 관찰 ' + lk.level + '단계, 3단계 중');
    }
  })();

  // 내 관찰 일기: 촬영 4에서 쓴 글을 세 줄로 보여줘요. 아무것도 안 썼으면 AI 분석글로 채우고 이름표도 바꿔요.
  var RULES = ['card-note-line-1.svg', 'card-note-line-2.svg', 'card-note-line-3.svg'];
  function esc(t) { return t.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function wrapLines(text, maxW) {
    var ctx = document.createElement('canvas').getContext('2d'); ctx.font = '14px SejongGeulggot, Allimjang, sans-serif';
    var out = [];
    text.split(/\n+/).forEach(function (para) {
      var line = '';
      para.trim().split(/\s+/).filter(Boolean).forEach(function (word) {
        var tryLine = line ? line + ' ' + word : word;
        if (ctx.measureText(tryLine).width <= maxW) { line = tryLine; return; }
        if (line) out.push(line);
        line = '';                                   // 한 단어가 한 줄보다 길면 글자 단위로 잘라요
        word.split('').forEach(function (ch) {
          if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ''; }
          line += ch;
        });
      });
      if (line) out.push(line);
    });
    if (out.length > 3) {
      var last = out[2]; while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
      out = out.slice(0, 2).concat(last + '…');
    }
    return out;
  }
  function renderDiary() {
    var mine = ''; try { mine = (sessionStorage.getItem('pico.capture.diary') || '').trim(); } catch (e) {}
    var lines;
    if (mine) lines = wrapLines(mine, 258);
    else {
      document.getElementById('tag').textContent = 'AI 분석';
      lines = (AI.summary && AI.summary.length ? AI.summary : PicoAI.DEMO.summary).slice(0, 3);
    }
    document.getElementById('diaryLines').innerHTML = lines.map(function (t, i) {
      return '<p>' + esc(t) + '</p><img src="assets/capture/' + RULES[i] + '" alt="">';
    }).join('');
  }
  var fontsReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load('14px SejongGeulggot'), new Promise(function (r) { setTimeout(r, 1200); })]) : Promise.resolve();
  fontsReady.then(renderDiary, renderDiary);

  // 4단계에서 그린 그림을 액자에 넣어요 (그림이 없으면 빈 액자)
  // 관찰을 마치면 그 그림이 종이로 접혀요: 처음 한 번만 "접는 중이에요" 화면을 보여주고, 접은 모습을 액자와 들판에 써요.
  var FOLD_SECONDS = 8;   // "종이로 접는 중이에요"를 일부러 아주 길게 (초)
  (function () {
    var win = document.getElementById('picoWin'), el = document.getElementById('foldWait');
    function leave() { document.documentElement.classList.remove('fold-pending'); }   // 로딩 화면 치우기
    var d = null; try { d = JSON.parse(sessionStorage.getItem('pico.drawing') || 'null'); } catch (e) {}
    if (!d || !d.src) { leave(); return; }
    document.getElementById('picoSample').hidden = true;      // 그린 그림이 있으면 시안의 예시 무당벌레는 숨겨요
    function show(src) { win.innerHTML = ''; var im = new Image(); im.alt = ''; im.src = src; win.appendChild(im); }
    if (d.folded) { show(d.folded); leave(); return; }               // 이미 접었으면 다시 접지 않아요 (뒤로 갔다 와도 그대로)
    show(d.src);                                                     // 접기 전에는 그린 그대로
    if (!window.PicoOrigami) { leave(); return; }
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var quiet = !!document.documentElement.dataset.state || reduce;  // ?state=… 화면이나 모션 줄이기: 연출 없이 바로 접은 모습
    PicoOrigami.make(d.src).then(function (model) {
      if (!model) { leave(); return; }                               // 접을 수 없는 그림(너무 작거나 선이 거의 없음)은 그린 그대로
      var png = PicoOrigami.png(model, 220);
      function keep() { PicoField.saveFolded(png); show(png); }
      if (quiet) { keep(); leave(); return; }

      // Figma Warm-Up 촬영 8 · 9 · 10 — 접는 단계마다 문구와 켜진 점이 함께 바뀌어요
      var STAGES = [
        ['내 그림을 종이로 접고 있어요.', '관찰한 특징을 하나씩 담아볼게요.'],            // 촬영 8  · 점 1
        ['조금씩 모습을 갖춰가고 있어요.', '색과 무늬까지 꼼꼼하게 표현하고 있어요.'],      // 촬영 9  · 점 2
        ['세상에 하나뿐인 작품이 완성됐어요!', '오늘의 발견을 관찰 카드에 담았어요.']        // 촬영 10 · 점 3
      ];
      var text = el.querySelector('.fold-text'), title = el.querySelector('.fold-title'), sub = el.querySelector('.fold-sub'), dots = el.querySelectorAll('.fold-dots i'), anim = null, closed = false, stage = 0, swapTimer = 0;
      function step(n) {
        for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i === n);
        if (n === stage) return;
        stage = n;
        // 문구는 반은 흐려지고 반은 다시 나타나는 디졸브로 바꿔요 (--dur 한 번 동안)
        clearTimeout(swapTimer); text.classList.add('is-swap');
        swapTimer = setTimeout(function () { title.textContent = STAGES[n][0]; sub.textContent = STAGES[n][1]; text.classList.remove('is-swap'); }, (window.picoDur ? picoDur() : 300) / 2);
      }
      function close() {
        if (closed) return; closed = true;
        keep(); el.classList.add('is-out');                          // 액자에 접은 모습을 먼저 넣고 디졸브로 걷어요
        setTimeout(leave, (window.picoDur ? picoDur() : 300) + 20);
      }
      setTimeout(function () {
        anim = PicoOrigami.play(el.querySelector('canvas'), model, {
          duration: FOLD_SECONDS,
          onProgress: function (p) { step(p < .5 ? 0 : 1); },
          onDone: function () {
            step(2); el.classList.add('is-done');
            setTimeout(close, 2000);
          }
        });
      }, 450);
      el.addEventListener('click', function () { if (el.classList.contains('is-done')) close(); });   // 접는 동안엔 끝까지 기다려요 (일부러 길게)
    }, leave);
  })();

  var toast = picoToastFill(document.getElementById('toast'), '사진첩에 카드를 저장했어요.'), timer;
  function showToast(ms) {
    toast.hidden = false; clearTimeout(timer);
    if (ms) timer = setTimeout(function () { toast.hidden = true; }, ms);
  }
  document.getElementById('download').addEventListener('click', function () { showToast(2000); });
  if (document.documentElement.dataset.state === 'saved') showToast(0);

  // 들판에 놓아주기: 4단계에서 그린 그림이 내 들판의 PICO가 돼요
  document.getElementById('release').addEventListener('click', function () {
    window.PicoField && PicoField.release(document.querySelector('[data-species]') ? document.querySelector('[data-species]').textContent.trim() : '칠성무당벌레');
  });
</script>
<span id="pico-ready"></span>
</body></html>
