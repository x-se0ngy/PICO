<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICO · 관찰 카드 완성</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .nav-actions { display: flex; gap: 10px; align-items: center; }
  .headline { position: absolute; left: 72.5px; top: 127.15px; font-family: var(--font-hand); font-size: 24px; white-space: nowrap; }
  .card-shadow { position: absolute; left: 29.1px; top: 176.6px; width: 326.285px; height: 335px; background: var(--ink); }
  .card { position: absolute; left: 20px; top: 165.3px; width: 325.917px; height: 335px; background: var(--brand); border: 1px dashed var(--ink); }
  .card-photo { position: absolute; left: 30.46px; top: 177.42px; width: 305px; height: 248px; object-fit: cover; background: var(--brand-soft); }
  .meta { position: absolute; top: 435.24px; font-size: 16px; white-space: nowrap; }
  .name { position: absolute; left: 28.33px; top: 455.44px; font-size: 24px; white-space: nowrap; }
  .tag { position: absolute; left: 20px; top: 525.1px; width: 96.127px; height: 35px; background: var(--brand-soft); border: 1px solid var(--ink); font-size: 14px; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
  .diary-box { position: absolute; left: 20.04px; top: 564.9px; width: 334.96px; height: 117.409px; background: var(--surface); border: 1px solid var(--ink); }
  .diary-lines { position: absolute; left: 34px; top: 578px; width: 321px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
  .diary-lines p { padding: 0 12px; font-family: var(--font-hand); font-size: 14px; line-height: 20px; white-space: nowrap; }
  .diary-lines img { width: 300px; }
  /* 3.2.1 save toast */
  .save-toast { position: absolute; left: 39.71px; top: 640.68px; width: 295.33px; height: 50px; z-index: 42; transition: opacity .2s; }
  .save-toast::before { content: ''; position: absolute; left: 5.35px; top: 5.99px; width: 290px; height: 45px; background: var(--ink); border: 1px solid var(--ink); box-sizing: border-box; }
  .save-toast-face { position: absolute; left: 0; top: 0; width: 290px; height: 45px; background: #00b7ff; border: 1px solid var(--ink); display: flex; align-items: center; gap: 10px; padding: 1px 0 0 14px; font-size: 14px; line-height: normal; white-space: nowrap; }
  .save-toast-face img { width: 24px; height: 24px; }
</style>
</head><body>
<div class="phone" style="--h:812px">

  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav">
      <a href="capture-5.html" aria-label="뒤로"><img class="icon" src="assets/capture/s2-icon-back.png" alt=""></a>
      <div class="nav-actions">
        <button id="download" aria-label="사진첩에 저장"><img class="icon" src="assets/capture/card-icon-download.png" alt=""></button>
        <a href="home.html" aria-label="닫기"><img class="icon" src="assets/capture/s2-icon-close.png" alt=""></a>
      </div>
    </div>
  </div>

  <p class="headline">관찰 카드가 완성됐어요!</p>

  <div class="card-shadow"></div>
  <div class="card"></div>
  <img class="card-photo" data-photo src="assets/capture/card-photo-ladybug.png" alt="관찰한 곤충 사진">
  <p class="meta" style="left:28.33px">NO.023</p>
  <p class="meta" style="left:98.33px">딱정벌레류</p>
  <p class="meta" style="left:265.85px">27.10.08</p>
  <p class="name" data-species>칠성무당벌레</p>

  <div class="tag">내 관찰 일기</div>
  <div class="diary-box"></div>
  <div class="diary-lines" id="diaryLines"></div>

  <div class="save-toast" id="toast" role="status" hidden>
    <div class="save-toast-face"><img src="assets/capture/card-toast-icon.png" alt=""><span>사진첩에 카드를 저장했어요.</span></div>
  </div>

  <a class="cta" id="release" href="home.html?state=field" style="top:699.5px"><span class="cta-face">들판에 놓아주기 <img src="assets/common/arrow-right.png" alt=""></span></a>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script src="photo.js"></script>
<script src="field.js"></script>
<script>
  var LINES = ['나뭇잎 위를 천천히 기어가던 칠성무당벌레의', '빨간 등에 검은 점이 또렷하게 보였어요.', '가까이 다가가자 날개를 펴고 날아갔어요.'];
  var RULES = [{ src: 'card-rule-1.png', h: 2 }, { src: 'card-rule-2.png', h: 3 }, { src: 'card-rule-3.png', h: 3 }];
  document.getElementById('diaryLines').innerHTML = LINES.map(function (t, i) {
    return '<p>' + t + '</p><img src="assets/capture/' + RULES[i].src + '" style="height:' + RULES[i].h + 'px" alt="">';
  }).join('');

  var toast = document.getElementById('toast'), timer;
  function showToast(ms) {
    toast.hidden = false; clearTimeout(timer);
    if (ms) timer = setTimeout(function () { toast.hidden = true; }, ms);
  }
  document.getElementById('download').addEventListener('click', function () { showToast(2000); });
  if (document.documentElement.dataset.state === 'saved') showToast(0);

  // 들판에 놓아주기: 4단계에서 그린 그림이 내 들판의 PICO가 돼요
  document.getElementById('release').addEventListener('click', function () {
    window.PicoField && PicoField.release(document.querySelector('[data-species]') ? document.querySelector('[data-species]').textContent.trim() : '칠성무당벌레');
  });
</script>
</body></html>
