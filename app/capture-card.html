<style>
  .nav-actions { display: flex; gap: 10px; align-items: center; }
  .headline { position: absolute; left: 0; top: 127.15px; width: 375px; text-align: center; font-family: var(--font-hand); font-size: 24px; white-space: nowrap; }
  .card-shadow { position: absolute; left: 28.91px; top: 176.6px; width: 326.285px; height: 335px; background: var(--ink); }
  .card { position: absolute; left: 19.81px; top: 165.3px; width: 325.917px; height: 335px; background: var(--brand); border: 1px dashed var(--ink); }
  .card-photo { position: absolute; left: 28.81px; top: 177px; width: 308px; height: 250px; object-fit: cover; background: var(--brand-soft); }
  .meta { position: absolute; top: 437px; font-size: 16px; white-space: nowrap; }
  .name { position: absolute; left: 28.81px; top: 457.2px; font-size: 24px; white-space: nowrap; }
  .tag { position: absolute; left: 19.81px; top: 526.6px; width: 96.127px; height: 35px; background: var(--brand-soft); border: 1px solid var(--ink); font-size: 14px; display: flex; align-items: center; justify-content: center; white-space: nowrap; }
  .diary-box { position: absolute; left: 19.81px; top: 566.6px; width: 335.38px; height: 117.409px; background: var(--surface); border: 1px solid var(--ink); }
  .diary-lines { position: absolute; left: 33.81px; top: 579.7px; width: 321px; display: flex; flex-direction: column; gap: 5px; align-items: flex-start; }
  .diary-lines p { padding: 0 12px; font-family: var(--font-hand); font-size: 14px; line-height: 20px; white-space: nowrap; max-width: 300px; overflow: hidden; text-overflow: ellipsis; }
  .diary-lines img { width: 300px; }
  /* Figma 2884:6106: 4단계에서 그린 그림을 담은 작은 액자 (7.96° 기울임, 검은 그림자 +2.45/+3.98) */
  .pico-frame > * { position: absolute; transform: rotate(7.96deg); border: 1px solid var(--ink); }
  .pf-shadow { left: 179.53px; top: 418.05px; width: 55.893px; height: 62.88px; background: var(--ink); }
  .pf-face { left: 177.08px; top: 414.07px; width: 55.893px; height: 62.88px; background: var(--brand-soft); }
  .pf-win { left: 181.34px; top: 418.34px; width: 48.929px; height: 48.008px; background: var(--bg); overflow: hidden; }
  .pf-win img { width: 100%; height: 100%; object-fit: contain; }
  /* 3.2.1 save toast */
  .save-toast { position: absolute; left: 39.71px; top: 640.68px; width: 295.33px; height: 50px; z-index: 42; transition: opacity var(--dur) var(--ease); }
  .save-toast::before { content: ''; position: absolute; left: 5.35px; top: 5.99px; width: 290px; height: 45px; background: var(--ink); border: 1px solid var(--ink); box-sizing: border-box; }
  .save-toast-face { position: absolute; left: 0; top: 0; width: 290px; height: 45px; background: #00b7ff; border: 1px solid var(--ink); display: flex; align-items: center; gap: 10px; padding: 1px 0 0 14px; font-size: 14px; line-height: normal; white-space: nowrap; }
  .save-toast-face img { width: 24px; height: 24px; }
</style>
</head><body>
<div class="phone" style="--h:812px">

  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav">
      <a href="capture-5.html" aria-label="뒤로"><img class="icon" src="assets/icons/outline/arrow-left.svg" alt=""></a>
      <div class="nav-actions">
        <button id="download" aria-label="사진첩에 저장"><img class="icon" src="assets/icons/outline/download.svg" alt=""></button>
        <a href="home.html" aria-label="닫기"><img class="icon" src="assets/icons/outline/close.svg" alt=""></a>
      </div>
    </div>
  </div>

  <p class="headline">관찰 카드가 완성 됐어요!</p>

  <div class="card-shadow"></div>
  <div class="card"></div>
  <img class="card-photo" data-photo src="assets/capture/card-photo-ladybug.png" alt="관찰한 곤충 사진">
  <div class="pico-frame" role="img" aria-label="내가 그린 PICO">
    <span class="pf-shadow"></span><span class="pf-face"></span><span class="pf-win" id="picoWin"></span>
  </div>
  <p class="meta" style="left:28.81px">NO.023</p>
  <p class="meta" style="left:98.81px" id="group">딱정벌레류</p>
  <p class="meta" style="left:265.85px">27.10.08</p>
  <p class="name" data-species>칠성무당벌레</p>

  <div class="tag" id="tag">내 관찰 일기</div>
  <div class="diary-box"></div>
  <div class="diary-lines" id="diaryLines"></div>

  <div class="save-toast" id="toast" role="status" hidden>
    <div class="save-toast-face"><img src="assets/capture/card-toast-icon.png" alt=""><span>사진첩에 카드를 저장했어요.</span></div>
  </div>

  <a class="cta" id="release" href="home.html?state=field" style="top:702px"><span class="cta-face">들판에 놓아주기 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></a>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script src="photo.js"></script>
<script src="ai.js"></script>
<script src="field.js"></script>
<script src="origami.js"></script>
<script>
  // 촬영 1에서 AI가 알아본 곤충 이름 · 분류 (AI를 못 쓰면 예시)
  var AI = PicoAI.current();
  document.querySelector('[data-species]').textContent = AI.name;
  document.getElementById('group').textContent = AI.group;

  // 내 관찰 일기: 촬영 4에서 쓴 글을 세 줄로 보여줘요. 아무것도 안 썼으면 AI 분석글로 채우고 이름표도 바꿔요.
  var RULES = [{ src: 'card-rule-1.png', h: 2 }, { src: 'card-rule-2.png', h: 3 }, { src: 'card-rule-3.png', h: 3 }];
  function esc(t) { return t.replace(/[&<>]/g, function (c) { return { '&': '&amp;', '<': '&lt;', '>': '&gt;' }[c]; }); }
  function wrapLines(text, maxW) {
    var ctx = document.createElement('canvas').getContext('2d'); ctx.font = '14px SejongGeulggot, Allimjang, sans-serif';
    var out = [];
    text.split(/\n+/).forEach(function (para) {
      var line = '';
      para.trim().split(/\s+/).filter(Boolean).forEach(function (word) {
        var tryLine = line ? line + ' ' + word : word;
        if (ctx.measureText(tryLine).width <= maxW) { line = tryLine; return; }
        if (line) out.push(line);
        line = '';                                   // 한 단어가 한 줄보다 길면 글자 단위로 잘라요
        word.split('').forEach(function (ch) {
          if (ctx.measureText(line + ch).width > maxW && line) { out.push(line); line = ''; }
          line += ch;
        });
      });
      if (line) out.push(line);
    });
    if (out.length > 3) {
      var last = out[2]; while (last && ctx.measureText(last + '…').width > maxW) last = last.slice(0, -1);
      out = out.slice(0, 2).concat(last + '…');
    }
    return out;
  }
  function renderDiary() {
    var mine = ''; try { mine = (sessionStorage.getItem('pico.capture.diary') || '').trim(); } catch (e) {}
    var lines;
    if (mine) lines = wrapLines(mine, 276);
    else {
      document.getElementById('tag').textContent = 'AI 분석';
      lines = (AI.summary && AI.summary.length ? AI.summary : PicoAI.DEMO.summary).slice(0, 3);
    }
    document.getElementById('diaryLines').innerHTML = lines.map(function (t, i) {
      return '<p>' + esc(t) + '</p><img src="assets/capture/' + RULES[i].src + '" style="height:' + RULES[i].h + 'px" alt="">';
    }).join('');
  }
  var fontsReady = document.fonts && document.fonts.load ? Promise.race([document.fonts.load('14px SejongGeulggot'), new Promise(function (r) { setTimeout(r, 1200); })]) : Promise.resolve();
  fontsReady.then(renderDiary, renderDiary);

  // 4단계에서 그린 그림을 액자에 넣어요 (그림이 없으면 빈 액자)
  // 관찰을 마치면 그 그림이 종이로 접혀요: 처음 한 번만 "접는 중이에요" 화면을 보여주고, 접은 모습을 액자와 들판에 써요.
  (function () {
    var win = document.getElementById('picoWin');
    var d = null; try { d = JSON.parse(sessionStorage.getItem('pico.drawing') || 'null'); } catch (e) {}
    if (!d || !d.src) return;
    function show(src) { win.innerHTML = ''; var im = new Image(); im.alt = ''; im.src = src; win.appendChild(im); }
    if (d.folded) { show(d.folded); return; }                       // 이미 접었으면 다시 접지 않아요 (뒤로 갔다 와도 그대로)
    show(d.src);                                                     // 접기 전에는 그린 그대로
    if (!window.PicoOrigami) return;
    var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var quiet = !!document.documentElement.dataset.state || reduce;  // ?state=… 화면이나 모션 줄이기: 연출 없이 바로 접은 모습
    PicoOrigami.make(d.src).then(function (model) {
      if (!model) return;                                            // 접을 수 없는 그림(너무 작거나 선이 거의 없음)은 그린 그대로
      var png = PicoOrigami.png(model, 220);
      function keep() { PicoField.saveFolded(png); show(png); }
      if (quiet) { keep(); return; }

      var phone = document.querySelector('.phone');
      var el = document.createElement('div');
      el.className = 'ai-wait fold-wait'; el.setAttribute('role', 'status'); el.setAttribute('aria-live', 'polite');
      el.innerHTML = '<div class="fold-board"><canvas width="440" height="440"></canvas></div>' +
        '<div class="fold-text"><p class="fold-title">종이로 접는 중이에요.</p><p class="fold-sub">그린 곤충을 한 장 한 장 접고 있어요.</p></div>' +
        '<div class="fold-dots" aria-hidden="true"><i class="on"></i><i></i><i></i></div>';
      phone.appendChild(el);
      var title = el.querySelector('.fold-title'), sub = el.querySelector('.fold-sub'), dots = el.querySelectorAll('.fold-dots i'), anim = null, closed = false;
      function step(n) { for (var i = 0; i < dots.length; i++) dots[i].classList.toggle('on', i === n); }
      function close() {
        if (closed) return; closed = true;
        keep(); el.classList.add('is-out');                          // 액자에 접은 모습을 먼저 넣고 디졸브로 걷어요
        setTimeout(function () { el.remove(); }, 320);
      }
      setTimeout(function () {
        anim = PicoOrigami.play(el.querySelector('canvas'), model, {
          onProgress: function (p) { step(p < .45 ? 0 : 1); },
          onDone: function () {
            step(2); title.textContent = '다 접었어요!'; sub.textContent = '나만의 PICO가 완성 되었어요.'; el.classList.add('is-done');
            setTimeout(close, 1300);
          }
        });
      }, 450);
      el.addEventListener('click', function () { if (el.classList.contains('is-done')) close(); else if (anim) anim.skip(); });
    });
  })();

  var toast = document.getElementById('toast'), timer;
  function showToast(ms) {
    toast.hidden = false; clearTimeout(timer);
    if (ms) timer = setTimeout(function () { toast.hidden = true; }, ms);
  }
  document.getElementById('download').addEventListener('click', function () { showToast(2000); });
  if (document.documentElement.dataset.state === 'saved') showToast(0);

  // 들판에 놓아주기: 4단계에서 그린 그림이 내 들판의 PICO가 돼요
  document.getElementById('release').addEventListener('click', function () {
    window.PicoField && PicoField.release(document.querySelector('[data-species]') ? document.querySelector('[data-species]').textContent.trim() : '칠성무당벌레');
  });
</script>
</body></html>
