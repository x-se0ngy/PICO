<!-- ===== PICO page skeleton (copy) ===== -->
<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/app/manifest.json">
<meta name="theme-color" content="#fffad3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PICO">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>PICO · 화면이름</title>
<link rel="preload" href="fonts/HakgyoansimAllimjangTTF-R.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/HakgyoansimAllimjangTTF-B.woff2" as="font" type="font/woff2" crossorigin>
<link rel="stylesheet" href="base.css">
<style>/* page-specific styles here */</style>
<script>/* 첫 화면부터 크기를 맞춰요: shared.js 가 불러와지기 전에 틀이 크게 보였다가 작아지는 것을 막고, 문서 전환은 Chrome 계열만 브라우저 것을 써요 */
(function(){var d=document,s=d.createElement('style'),c='';
var ch=!!(navigator.userAgentData&&navigator.userAgentData.brands&&navigator.userAgentData.brands.some(function(b){return/Chromium/.test(b.brand)}));
if(!ch||!('CSSViewTransitionRule' in window))c+='@view-transition{navigation:none}';
window.picoScale=function(){var w=innerWidth,h=innerHeight;try{if(navigator.standalone||matchMedia('(display-mode: standalone)').matches){w=Math.max(w,screen.width);h=Math.max(h,screen.height)}}catch(x){}if(!w||!h||h<200||w>=500)return 0;return Math.min(w/375,h/812)};
var k=window.picoScale();if(k)c+='.phone{transform:scale('+k+')}';
s.textContent=c;d.head.appendChild(s)})();</script>
</head><body>
<div class="phone" style="--h:812px">

  <!-- top: status + nav (pick one nav variant) -->
  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <!-- centered logo (onboarding) -->
    <div class="nav nav--center"><img class="logo" src="assets/common/logo-mark.png" alt="PICO"></div>
    <!-- OR logo left + weather right (tab screens):
    <div class="nav"><img class="logo" src="assets/common/logo-mark.png" alt="PICO"><span class="nav-weather"><span>☀︎</span><span>맑음 · 오후 3시</span></span></div> -->
  </div>

  <!-- … screen content … -->

  <!-- primary CTA: set top in px -->
  <a class="cta" href="next.html" style="top:699.5px"><span class="cta-face">다음 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></a>

  <!-- tab bar (tab screens only). Active tab uses the filled icon. -->
  <nav class="tabbar" aria-label="메인 메뉴"><div class="tabbar-bg"></div>
    <div class="tabbar-row">
      <div class="tabbar-group"><a href="home.html" aria-label="홈"><img src="assets/icons/filled/home.svg" alt=""><span>홈</span></a><a href="dogam.html" aria-label="도감"><img src="assets/icons/outline/tag.svg" alt=""><span>도감</span></a></div>
      <a class="tab-cam" href="capture-1.html" aria-label="관찰"><img src="assets/common/tab-camera.png" alt=""><span class="tab-cam-label">관찰</span></a>
      <div class="tabbar-group"><a href="friends.html" aria-label="친구"><img src="assets/icons/outline/mail.svg" alt=""><span>친구</span></a><a href="my.html" aria-label="마이"><img src="assets/icons/outline/user.svg" alt=""><span>마이</span></a></div>
    </div></nav>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
</body></html>
