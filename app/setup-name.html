<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/app/manifest.json">
<meta name="theme-color" content="#fffad3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PICO">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>PICO · 이름 설정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* 1.2.1 (Figma Warm-Up 3198:8745): 이름은 노트 첫 줄에 적어요.
     335×83.83 노트 · 하늘색 가로줄 두 줄(y 263.34 / 289.84) · 분홍 여백 줄(x 47.1) */
  .name-note { position: absolute; left: 20px; top: 236.8px; width: 335px; height: 83.826px; border: 1px solid var(--ink); }
  .name-note .rule { position: absolute; left: .25px; width: 334.75px; height: 1px; background: var(--rule-cyan); pointer-events: none; }
  .name-note .margin { position: absolute; left: 27.1px; top: 0; width: 1px; height: 100%; background: var(--rule-pink); pointer-events: none; }
  .name-line { position: absolute; left: 35px; top: 11.58px; width: 290px; height: 22px; display: flex; align-items: center; gap: 8px; }
  .name-input { flex: 1; min-width: 0; height: 22px; border: 0; outline: 0; background: transparent; padding: 0;
    font: 400 20px/22px var(--font); color: var(--ink); caret-color: var(--ink); }
  .name-count { font-size: 12px; line-height: normal; white-space: nowrap; }
  .name-error { position: absolute; left: 20px; top: 329.4px; font-size: 14px; line-height: normal; color: #e32d3d; }
  .is-error.name-note { border-color: #e32d3d; }
  .is-error .name-count { color: #e32d3d; }
  .step-title { top: 174px; }
</style>
</head><body>
<div class="phone warm setup" style="--h:812px">
  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav nav--center"><img class="logo" src="assets/common/logo-mark.png" alt="PICO"></div>
  </div>

  <div class="progress" aria-label="3단계 중 1단계"><span class="on"></span><span></span><span></span></div>

  <div class="step-title">
    <p class="q"><span>01.</span><span>탐험가 이름을 정해요.</span></p>
    <p class="sub">이름 말고 별명도 좋아요. 친구들에게는 이 이름만 보여요.</p>
  </div>

  <div class="name-note" id="field">
    <span class="rule" style="top:41.42px" aria-hidden="true"></span>
    <span class="rule" style="top:67.92px" aria-hidden="true"></span>
    <span class="margin" aria-hidden="true"></span>
    <label class="name-line">
      <input class="name-input" id="name" type="text" maxlength="10" value="초고속 탐험가 선우" autocomplete="off" aria-label="탐험가 이름" aria-describedby="nameErr">
      <span class="name-count" id="count">9 / 10</span>
    </label>
  </div>
  <p class="name-error" id="nameErr" role="alert" hidden>이름을 입력해주세요.</p>

  <button type="button" class="cta" id="next" style="top:708.07px"><span class="cta-face">다음 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></button>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script>
(function () {
  var input = document.getElementById('name'), count = document.getElementById('count'),
      field = document.getElementById('field'), err = document.getElementById('nameErr'), next = document.getElementById('next');
  function len() { return Array.from(input.value).length; }
  function update() { count.textContent = len() + ' / 10'; next.classList.toggle('is-off', !input.value.trim()); }
  function setError(on) { field.classList.toggle('is-error', on); err.hidden = !on; input.setAttribute('aria-invalid', on); }
  input.addEventListener('input', function () { update(); if (input.value.trim()) setError(false); });
  next.addEventListener('click', function () {
    var v = input.value.trim();
    if (!v) { setError(true); input.focus(); return; }
    try { localStorage.setItem('pico.name', v); } catch (e) {}
    location.href = 'setup-grade.html';
  });
  if (document.documentElement.dataset.state === 'error') { input.value = ''; setError(true); }
  update();
})();
</script>
</body></html>
