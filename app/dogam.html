<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/app/manifest.json">
<meta name="theme-color" content="#fffad3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PICO">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>PICO · 도감</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* long frame scrolls in the browser; tab bar + home indicator stick to the viewport bottom */
  @media (min-width: 500px) { body { padding-bottom: 0; } }
  .abs { position: absolute; }

  /* summary card */
  .card-shadow { left: 29.5px; top: 167.54px; width: 325px; height: 215px; background: var(--ink); border: 1px solid var(--ink); }
  .card-face { left: 20.5px; top: 157.1px; width: 325px; height: 215px; background: var(--brand); border: 1px dashed var(--ink); }
  .card-inner { left: 28px; top: 239.19px; width: 310px; height: 125px; background: var(--brand-soft); }
  .summary { left: 28px; top: 173.19px; white-space: nowrap; display: flex; flex-direction: column; gap: 5px; }
  .summary .t { font-size: 20px; }
  .summary .n { display: flex; gap: 4px; align-items: center; }
  .summary .n b { font-weight: 400; font-size: 16px; } .summary .n span { font-size: 12px; }

  /* collection bin illustration (pieces exported from Figma, placed at their render bounds) */
  .bin { left: 0; top: 0; transform: translate(-0.5px, 23.89px); }
  .bin img { position: absolute; }
  .bin .cnt { position: absolute; top: 160.17px; left: 251.69px; font-weight: 700; font-size: 16px; line-height: 15px; }
  .bin .of { position: absolute; white-space: nowrap; top: 162.17px; left: 276.76px; font-size: 10px; line-height: 15px; }
  .bin .band { position: absolute; left: 223.71px; top: 129.58px; width: 110.56px; height: 8.88px; background: #b4bf38; border: 1px solid var(--ink); }
  .bin .win { position: absolute; left: 263.71px; top: 105.14px; width: 30.31px; height: 6.48px; background: #e4f8fd; border: 1px solid var(--ink); }

  .weekly { left: 36px; top: 248.19px; width: 295px; display: flex; flex-direction: column; gap: 8px; }
  .weekly > p { font-size: 14px; line-height: 19px; }
  .weekly-row { display: flex; gap: 15px; justify-content: center; padding: 0 5px; }
  .weekly-row a { display: flex; flex-direction: column; align-items: center; gap: 10px; font-size: 10px; line-height: 12px; white-space: nowrap; }
  /* Figma now draws these with a solid 1px stroke: clip the old dashed rim off the 3x photo and draw the stroke in CSS */
  .weekly-row .ph { position: relative; width: 60px; height: 60px; border-radius: 50%; border: 1px solid var(--ink); overflow: hidden; }
  .weekly-row .ph img { position: absolute; left: -1px; top: -1px; width: 60px; height: 60px; }

  /* list section: one flowing column, matches Figma auto-layout (Frame 2147203380) */
  .list { left: 0; top: 402.54px; width: 375px; display: flex; flex-direction: column; align-items: center; }
  .list-head { width: 335px; height: 19px; display: flex; justify-content: space-between; align-items: flex-start; }
  .list-head p { font-size: 16px; line-height: 19px; }
  .sort { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .sort img { width: 18px; height: 18px; transition: transform .15s; }
  .sort[aria-pressed="true"] img { transform: rotate(180deg); }

  /* insect cards */
  .cards { display: grid; grid-template-columns: 1fr 1fr; column-gap: 15px; }
  .cards--top { margin-top: 10px; width: 335px; row-gap: 15px; }
  .cards--rest { margin-top: 25px; width: 336px; row-gap: 14px; }
  .cards:empty { display: none; }
  /* Figma 곤충 카드 (2942:5905): 위 50px 올리브 띠(점선) + 아래 88px 사진, 오른쪽 위에 내가 그린 그림을 끼운 작은 사진첩 */
  .icard { position: relative; height: 138.3px; display: block; }
  .icard .photo { position: absolute; left: 0; top: 50px; width: 100%; height: 88.3px; object-fit: cover; object-position: center bottom; border: 1px solid var(--ink); border-top: 0; }
  .icard .band { position: absolute; left: 0; top: 0; width: 100%; height: 50px; background: #b1bd35; border: 1px dashed var(--ink); }
  .icard .meta { position: absolute; left: 10px; top: 7.5px; width: 88px; display: flex; flex-direction: column; gap: 2px; }
  .icard .meta b { display: block; font-weight: 400; font-size: 16px; line-height: 19px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icard .meta span { display: block; font-size: 12px; line-height: 14px; white-space: nowrap; }
  /* 사진첩 (Group 2147203403): 45×51 올리브 액자 + 검은 그림자(2, 3.2), 안쪽 40×39 크림 칸, 8° 기울임 */
  .icard .album { position: absolute; left: 103px; top: 9px; width: 45.3px; height: 51px; transform: rotate(8deg); transform-origin: 0 0; z-index: 1; }
  .icard .album::before { content: ''; position: absolute; left: 2.6px; top: 2.9px; width: 100%; height: 100%; background: var(--ink); border: .8px solid var(--ink); box-sizing: border-box; }
  .icard .album::after { content: ''; position: absolute; inset: 0; background: #b1bd35; border: .8px solid var(--ink); box-sizing: border-box; }
  .icard .album .pic { position: absolute; left: 2.8px; top: 2.9px; width: 39.7px; height: 38.9px; background: var(--bg); border: .8px solid var(--ink); box-sizing: border-box; z-index: 1; display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .icard .album .pic img, .icard .album .pic svg { width: 34px; height: 34px; display: block; }
  .empty { margin-top: 30px; width: 335px; text-align: center; font-size: 14px; }

  /* PICO TIP banner (Figma "TIP 배너") */
  .tip { margin-top: 25px; width: 375px; height: 110px; padding: 16px; background: #00b7ff; border-top: 1px dashed var(--ink); border-bottom: 1px dashed var(--ink); display: flex; flex-direction: column; justify-content: center; gap: 5px; }
  .tip .h { display: flex; gap: 2px; align-items: center; font-weight: 700; font-size: 20px; line-height: 1.3; white-space: nowrap; }
  .tip .h img { width: 32px; height: 32px; }
  .tip .d { font-size: 14px; line-height: 1.3; white-space: nowrap; }

  /* not-yet-met tiles */
  .utile { position: relative; height: 138.3px; background: var(--brand-soft); border: 1px dashed var(--ink); font-size: 14px; }
  .utile img { position: absolute; left: 63.2px; top: 29px; width: 32px; height: 32.1px; }
  .utile .no { position: absolute; left: 0; right: 0; top: 71.07px; text-align: center; }
  .utile .msg { position: absolute; left: 0; right: 0; top: 93.07px; text-align: center; }
  /* top bar (Figma "top" Property 1=3): big logo + search; search opens a field in place of the logo */
  .nav .logo.lg { width: 32px; height: 33.62px; }
  .nav-btn, .nav-btn img { display: block; width: 32px; height: 32px; }
  .nav-q { display: flex; align-items: center; gap: 10px; flex: 1; height: 40px; margin-right: 10px; padding: 0 10px; background: var(--brand); border: 1px solid var(--ink); }
  .nav-q img { width: 24px; height: 24px; flex: none; }
  .nav-q input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: var(--ink); outline: none; padding: 0; }
  .nav-q input::placeholder { color: var(--ink); opacity: 1; }
  .nav-q[hidden] { display: none; }
</style>
</head><body>
<div class="phone" style="--h:1974px">

  <div class="top" data-fixed>
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav">
      <img class="logo lg" id="logo" src="assets/common/logo-mark.png" alt="PICO">
      <label class="nav-q" id="navQ" hidden><img src="assets/icons/outline/search.svg" alt=""><input id="q" type="search" placeholder="곤충 이름 찾기" aria-label="곤충 이름 찾기" autocomplete="off"></label>
      <button class="nav-btn" id="searchBtn" type="button" aria-label="곤충 이름 찾기" aria-expanded="false"><img src="assets/icons/outline/search.svg" alt=""></button>
    </div>
  </div>

  <!-- 나의 수집 현황 -->
  <div class="abs card-shadow"></div>
  <div class="abs card-face"></div>
  <div class="abs card-inner"></div>
  <div class="abs bin" aria-hidden="true">
    <img src="assets/tabs/bin-body.png" alt="" style="left:228.89px;top:137.96px;width:99.96px;height:63.43px">
    <img src="assets/tabs/bin-base.png" alt="" style="left:232.41px;top:179.74px;width:92.96px;height:21.64px">
    <span class="cnt">24</span><span class="of">/ 80종</span>
    <span class="band"></span><span class="win"></span>
    <img src="assets/tabs/bin-handle.png" alt="" style="left:255.15px;top:93.61px;width:47.68px;height:18.51px">
    <img src="assets/tabs/bin-lid.png" alt="" style="left:228.77px;top:111.12px;width:100.16px;height:18.96px">
    <img src="assets/tabs/bin-vents.png" alt="" style="left:258.37px;top:116.37px;width:41px;height:8.46px">
    <img src="assets/tabs/bin-leg-a.png" alt="" style="left:236.81px;top:144.26px;width:6.47px;height:20.46px">
    <img src="assets/tabs/bin-leg-b.png" alt="" style="left:243.35px;top:141.93px;width:6.02px;height:15.83px">
  </div>
  <div class="abs summary">
    <p class="t">나의 수집 현황</p>
    <div class="n"><b>24종</b><span>/ 80종</span></div>
  </div>
  <div class="abs weekly">
    <p>이번주 새로 만난 곤충</p>
    <div class="weekly-row" id="weekly"></div>
  </div>

  <!-- 검색 + 목록 + TIP + 나머지 곤충 -->
  <div class="abs list" id="list">
    <div class="list-head"><p>곤충 목록</p>
      <button class="sort" id="sort" aria-pressed="false"><span>최근순</span><img src="assets/icons/outline/arrow-alternate.svg" alt=""></button></div>
    <div class="cards cards--top" id="cards"></div>
    <p class="empty" id="empty" hidden>찾는 곤충이 없어요.</p>

    <div class="tip">
      <div class="h"><img src="assets/icons/outline/presentation.svg" alt="">PICO TIP</div>
      <div class="d"><p>잎 뒷면도 살펴보세요!</p><p>작은 알이 숨어 있을지도 몰라요.</p></div>
    </div>

    <div class="cards cards--rest" id="cards2"></div>
  </div>

  <nav class="tabbar" aria-label="메인 메뉴"><div class="tabbar-bg"></div>
    <div class="tabbar-row">
      <div class="tabbar-group"><a href="home.html" aria-label="홈"><img src="assets/icons/outline/home.svg" alt=""><span>홈</span></a><a href="dogam.html" aria-label="도감" aria-current="page"><img src="assets/icons/filled/tag.svg" alt=""><span>도감</span></a></div>
      <a class="tab-cam" href="capture-1.html" aria-label="촬영"><img src="assets/common/tab-camera.png" alt=""></a>
      <div class="tabbar-group"><a href="badge.html" aria-label="배지"><img src="assets/icons/outline/bookmark.svg" alt=""><span>배지</span></a><a href="my.html" aria-label="마이"><img src="assets/icons/outline/user.svg" alt=""><span>마이</span></a></div>
    </div></nav>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script src="field.js"></script>
<script>
(function () {
  var weekly = [
    { name: '칠성무당벌레', img: 'new-ladybug' },
    { name: '고추잠자리', img: 'new-dragonfly' },
    { name: '방아깨비', img: 'new-grasshopper' },
    { name: '배추흰나비', img: 'new-butterfly' }
  ];
  document.getElementById('weekly').innerHTML = weekly.map(function (w) {
    return '<a href="dogam-detail.html"><span class="ph"><img src="assets/tabs/' + w.img + '.png" alt=""></span><span>' + w.name + '</span></a>';
  }).join('');

  // newest first (Figma order). First 4 sit above the TIP banner, the rest below it.
  var insects = [
    { name: '방아깨비', doodle: 'hop', date: '2027.11.22', img: 'card-grasshopper' },
    { name: '배추흰나비', doodle: 'butterfly', date: '2027.11.17', img: 'card-butterfly' },
    { name: '칠성무당벌레', doodle: 'ladybug', date: '2027.11.01', img: 'card-ladybug' },
    { name: '고추 잠자리', doodle: 'dragonfly', date: '2027.10.29', img: 'card-dragonfly' },
    { name: '소금쟁이', doodle: 'strider', date: '2027.10.18', img: 'card-waterstrider' },
    { name: '물방개', doodle: 'beetle', date: '2027.10.11', img: 'card-divingbeetle' },
    { name: '흰줄숲모기', doodle: 'mosquito', date: '2027.10.12', img: 'card-mosquito' },
    { name: '갈색 여치', doodle: 'hop', date: '2027.10.08', img: 'card-katydid' },
    { name: '긴수염대벌레', doodle: 'stick', date: '2027.10.08', img: 'card-stickinsect' },
    { name: '큰자루긴수염나방', doodle: 'moth', date: '2027.10.05', img: 'card-moth' },
    { name: '붉은점모시나비', doodle: 'butterfly2', date: '2027.09.23', img: 'card-apollo' },
    { name: '상제나비', doodle: 'butterfly3', date: '2027.09.23', img: 'card-blackveined' }
  ];
  // 사진첩 안 그림: 내가 그려서 들판에 놓아준 그림(이름이 같은 곤충)이 있으면 그걸, 없으면 예시 그림
  var mine = {};
  ((window.PicoField && PicoField.list()) || []).forEach(function (m) { if (m.species) mine[m.species.replace(/\s+/g, '')] = m.src; });
  function drawing(it) {
    var src = mine[it.name.replace(/\s+/g, '')];
    if (src) return '<img src="' + src + '" alt="내가 그린 ' + it.name + '">';
    return window.PicoField ? PicoField.doodle(it.doodle) : '';
  }
  function cardHTML(it) {
    return '<a class="icard" href="dogam-detail.html" data-name="' + it.name + '">' +
      '<span class="band"></span><img class="photo" src="assets/tabs/' + it.img + '.png" alt="">' +
      '<span class="meta"><b>' + it.name + '</b><span>' + it.date + '</span></span>' +
      '<span class="album" role="img" aria-label="내가 그린 ' + it.name + ' 그림"><span class="pic">' + drawing(it) + '</span></span></a>';
  }
  function utile(n) {
    return '<div class="utile"><img src="assets/icons/outline/help.svg" alt=""><p class="no">No. ' + n + '</p><p class="msg">아직 못 만난 곤충</p></div>';
  }
  var cards = document.getElementById('cards'), cards2 = document.getElementById('cards2');
  var q = document.getElementById('q'), empty = document.getElementById('empty');
  var oldest = false, phone = document.querySelector('.phone'), list = document.getElementById('list');
  function render() {
    var v = q.value.replace(/\s+/g, '');
    var shown = insects.filter(function (it) { return !v || it.name.replace(/\s+/g, '').indexOf(v) !== -1; });
    if (oldest) shown = shown.slice().reverse();
    cards.innerHTML = shown.slice(0, 4).map(cardHTML).join('');
    // Figma order of the unmet tiles: No.25, No.27 in the last card grid, then No.26, No.28
    // unmet insects (Figma 곤충목록: same order for 최근순 and 오래된순)
    cards2.innerHTML = shown.slice(4).map(cardHTML).join('') + (v ? '' : ['025', '028', '029', '030', '033', '035', '037', '038'].map(utile).join(''));
    empty.hidden = shown.length > 0;
    // page grows with the list; keep 20px above the tab bar's yellow band
    phone.style.setProperty('--h', Math.max(812, Math.ceil(list.offsetTop + list.offsetHeight + 120)) + 'px');
  }
  render();

  q.addEventListener('input', render);

  // search lives in the top bar: the icon opens a field in place of the logo, tapping again closes and clears it
  var searchBtn = document.getElementById('searchBtn'), navQ = document.getElementById('navQ'), logo = document.getElementById('logo');
  searchBtn.addEventListener('click', function () {
    var open = navQ.hidden;
    navQ.hidden = !open; logo.hidden = open;
    searchBtn.setAttribute('aria-expanded', open);
    searchBtn.querySelector('img').src = open ? 'assets/icons/outline/close.svg' : 'assets/icons/outline/search.svg';
    searchBtn.setAttribute('aria-label', open ? '검색 닫기' : '곤충 이름 찾기');
    if (open) { q.focus(); var sc = document.querySelector('.phone > .scroll'); if (sc) sc.scrollTop = 0; }
    else if (q.value) { q.value = ''; render(); }
  });

  // sort: 최근순 <-> 오래된순
  var sort = document.getElementById('sort');
  sort.addEventListener('click', function () {
    oldest = !oldest;
    sort.setAttribute('aria-pressed', oldest);
    sort.querySelector('span').textContent = oldest ? '오래된순' : '최근순';
    render();
  });
})();
</script>
</body></html>
