<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/app/manifest.json">

<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<title>PICO · 도감</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* long frame scrolls in the browser; tab bar + home indicator stick to the viewport bottom */
  @media (min-width: 500px) { body { padding-bottom: 0; } }
  .abs { position: absolute; }

  /* 도감 (Figma Warm-Up 3244:5262): 상단바 아래 점선부터 바로 곤충 카드.
     카드 = 사진(160.5×141.6) 위에 이름표 라임 종이가 1.97° 기울어 붙고, 오른쪽에 내가 그린 그림을 끼운 작은 액자. */
  .top[data-fixed] { height: 118px; background: url('assets/onboarding/ob-paper-full.jpg') 0 0 / 375px 812px, var(--paper); background-blend-mode: multiply; }   /* 스크롤해도 상단바 뒤로 카드가 비치지 않게 */
  .top[data-fixed]::after { content: ''; position: absolute; left: 0; right: 0; top: 118px; border-top: 1px dashed var(--ink); }
  /* 수집 현황 (Figma 3261:7422): 종이 두 장 — 앞장 종이 + 뒤에 -1.8° 기울어진 연두 장 (큰 버튼·고른 카드와 같은 "내 것" 표시).
     접는 모서리는 넣지 않아요. 단계는 PICO 마크(오각형) 색 + 한 줄 설명 + 막대. */
  .sum-back { left: 20px; top: 144.74px; width: 335px; height: 134px; background: var(--lime); border: 1px solid var(--ink); transform: rotate(-1.8deg); }
  .sum { left: 20px; top: 144.74px; width: 335px; height: 134px; background: var(--paper); border: 1px solid var(--ink); }
  .sum-in { left: 31.49px; top: 157.53px; width: 312px; display: flex; flex-direction: column; gap: 8px; }
  .sum-t { font-size: 16px; line-height: normal; }
  .sum-n { display: flex; align-items: flex-end; gap: 6px; margin-top: 5px; white-space: nowrap; }
  .sum-n b { font-size: 40px; line-height: 40px; }
  .sum-n span { font-size: 15px; line-height: normal; }
  .tiers { display: flex; gap: 10px; }
  .tier { display: flex; flex-direction: column; gap: 5px; width: 97.34px; }
  .tier .th { display: flex; align-items: center; gap: 4px; white-space: nowrap; }
  .tier .mk { width: 18.23px; height: 19.62px; flex: none; transform: rotate(-5.97deg); overflow: visible; }
  .tier .tn { width: 55.17px; font-size: 12px; line-height: normal; }
  .tier .tc { font-weight: 700; font-size: 13px; line-height: normal; }
  .tier .bar { display: block; height: 10px; border: 1px solid var(--ink); background: transparent; }
  .tier .bar i { display: block; height: 100%; background: var(--tc); }

  /* list section: one flowing column, matches Figma auto-layout (Frame 2147203380) */
  .list { left: 0; top: 300px; width: 375px; display: flex; flex-direction: column; align-items: center; }
  .list-head { width: 335px; height: 19px; display: flex; justify-content: space-between; align-items: flex-start; }
  .list-head p { font-size: 16px; line-height: 19px; }
  .sort { display: flex; align-items: center; gap: 5px; font-size: 12px; }
  .sort img { width: 18px; height: 18px; transition: transform var(--dur) var(--ease); }
  .sort[aria-pressed="true"] img { transform: rotate(180deg); }

  .cards { display: grid; grid-template-columns: 160.54px 160.54px; column-gap: 10.2px; row-gap: 16.7px; width: 331.3px; }
  .cards--top { margin-top: 10px; }
  .cards--rest { margin-top: 36px; }
  .cards:empty { display: none; }
  .icard { position: relative; width: 160.54px; height: 141.6px; display: block; }
  .icard .photo { position: absolute; inset: 0; width: 100%; height: 100%; object-fit: cover; object-position: center bottom; border: 1px solid var(--ink); transform: rotate(.18deg); }
  /* Figma 곤충 카드 (3251:17793 …): 이름표는 종이색, 단계 색은 오른쪽 위 깃발 + 그림 액자에만 (라임 · 하늘 · 분홍) */
  /* 단계 색 (Figma 3261:7422): 연두 쉽게 만나요 · 하늘 찾아야 해요 · 분홍 어려워요 */
  .icard, .utile { --tc: var(--lime); }
  .c-cyan { --tc: var(--rule-cyan); } .c-pink { --tc: var(--rule-pink); }
  .icard .label, .utile .label { position: absolute; left: -.66px; top: -.07px; width: 162.5px; height: 53.14px; transform: rotate(1.97deg); border: 1px solid var(--ink);
    background: url('assets/onboarding/ob-paper-full.jpg') -40px -300px / 375px 812px, var(--paper); background-blend-mode: multiply; }
  .icard .flag { position: absolute; left: 146.4px; top: 2.8px; width: 17.3px; height: 23.3px; overflow: visible; }
  .icard .meta { position: absolute; left: 12px; top: 7px; width: 88px; display: flex; flex-direction: column; gap: 2px; }
  .icard .meta b { display: block; font-weight: 400; font-size: 16px; line-height: normal; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .icard .meta span { display: block; font-size: 12px; line-height: normal; white-space: nowrap; }
  /* 액자: 라임 45.3×51 + 검정 그림자, 안쪽 크림 칸, 9.94° 기울임 */
  .icard .album > * { position: absolute; display: block; border: .811px solid var(--ink); box-sizing: border-box; transform: rotate(9.94deg); }
  .icard .album .sh { left: 100.84px; top: 26.68px; width: 45.32px; height: 50.98px; background: var(--ink); }
  .icard .album .fc { left: 98.96px; top: 23.38px; width: 45.32px; height: 50.98px; background: var(--tc); }
  .icard .album .pic { left: 102.5px; top: 26.87px; width: 39.67px; height: 38.93px; background: var(--paper); display: flex; align-items: center; justify-content: center; overflow: hidden; }
  .icard .album .pic img, .icard .album .pic svg { width: 32px; height: 32px; display: block; transform: rotate(-7.97deg); }
  .empty { margin-top: 30px; width: 335px; text-align: center; font-size: 14px; }

  /* PICO TIP: 종이 띠 (위·아래 점선) */
  .tip { margin-top: 20px; width: 375px; height: 110px; padding: 0 20px; border-top: 1px dashed var(--ink); border-bottom: 1px dashed var(--ink);
    background: url('assets/onboarding/ob-paper-bottom.jpg') 0 0 / 375px 390px, var(--paper); background-blend-mode: multiply;
    display: flex; flex-direction: column; justify-content: center; gap: 5px; }
  .tip .h { display: flex; gap: 2px; align-items: center; font-weight: 700; font-size: 20px; line-height: 1.3; white-space: nowrap; }
  .tip .h img { width: 32px; height: 32px; }
  .tip .d { font-size: 14px; line-height: 1.3; white-space: nowrap; }

  /* 아직 못 만난 곤충 (Figma 3251:17793): 같은 카드에 사진 대신 빈 종이 + 물음표, 이름표엔 번호 */
  .utile { position: relative; width: 160.54px; height: 141.6px; }
  .utile .blank { position: absolute; inset: 0; border: 1px solid var(--ink); transform: rotate(.18deg);
    background: url('assets/onboarding/ob-paper-bottom.jpg') -100px -60px / 375px 390px, var(--paper); background-blend-mode: multiply; }
  .utile .meta { position: absolute; left: 12px; top: 8px; display: flex; flex-direction: column; gap: 4px; white-space: nowrap; }
  .utile .meta b { font-weight: 400; font-size: 14px; line-height: normal; } .utile .meta span { font-size: 12px; line-height: normal; }
  .utile img { position: absolute; left: 64.3px; top: 67.2px; width: 32px; height: 32px; }

  /* top bar (Figma "top" Property 1=3): big logo + search; search opens a field in place of the logo */
  .nav .logo.lg { width: 32px; height: 33.62px; }
  .nav-btn, .nav-btn img { display: block; width: 32px; height: 32px; }
  .nav-q { display: flex; align-items: center; gap: 10px; flex: 1; height: 40px; margin-right: 10px; padding: 0 10px; background: var(--brand); border: 1px solid var(--ink); }
  .nav-q img { width: 24px; height: 24px; flex: none; }
  .nav-q input { flex: 1; min-width: 0; border: 0; background: transparent; font: inherit; font-size: 14px; color: var(--ink); outline: none; padding: 0; }
  .nav-q input::placeholder { color: var(--ink); opacity: 1; }
  .nav-q[hidden] { display: none; }
</style>
</head><body>
<div class="phone warm" style="--h:1974px">

  <div class="top" data-fixed>
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav">
      <img class="logo lg" id="logo" src="assets/common/logo-mark.png" alt="PICO">
      <label class="nav-q" id="navQ" hidden><img src="assets/icons/outline/search.svg" alt=""><input id="q" type="search" placeholder="곤충 이름 찾기" aria-label="곤충 이름 찾기" autocomplete="off"></label>
      <button class="nav-btn" id="searchBtn" type="button" aria-label="곤충 이름 찾기" aria-expanded="false"><img src="assets/icons/outline/search.svg" alt=""></button>
    </div>
  </div>

  <!-- 나의 수집 현황 -->
  <div class="abs sum-back" aria-hidden="true"></div>
  <div class="abs sum"></div>
  <div class="abs sum-in">
    <div>
      <p class="sum-t">내가 만난 곤충</p>
      <p class="sum-n"><b id="allGot">24</b><span id="allTotal">/ 567종</span></p>
    </div>
    <div class="tiers" id="tiers"></div>
  </div>

  <!-- 검색 + 목록 + TIP + 나머지 곤충 -->
  <div class="abs list" id="list">
    <div class="list-head"><p>곤충 목록</p>
      <button class="sort" id="sort" aria-pressed="false"><span>최근순</span><img src="assets/icons/outline/arrow-alternate.svg" alt=""></button></div>
    <div class="cards cards--top" id="cards"></div>
    <p class="empty" id="empty" hidden>찾는 곤충이 없어요.</p>

    <div class="tip">
      <div class="h"><img src="assets/icons/outline/presentation.svg" alt="">PICO TIP</div>
      <div class="d"><p>잎 뒷면도 살펴보세요!</p><p>작은 알이 숨어 있을지도 몰라요.</p></div>
    </div>

    <div class="cards cards--rest" id="cards2"></div>
  </div>

  <nav class="tabbar" aria-label="메인 메뉴"><div class="tabbar-bg"></div>
    <div class="tabbar-row">
      <div class="tabbar-group"><a href="home.html" aria-label="홈"><img src="assets/icons/outline/home.svg" alt=""><span>홈</span></a><a href="dogam.html" aria-label="도감" aria-current="page"><img src="assets/icons/outline/tag.svg" alt=""><span>도감</span></a></div>
      <a class="tab-cam" href="capture-1.html" aria-label="관찰"><img src="assets/common/tab-camera.png" alt=""><span class="tab-cam-label">관찰</span></a>
      <div class="tabbar-group"><a href="badge.html" aria-label="배지"><img src="assets/icons/outline/bookmark.svg" alt=""><span>배지</span></a><a href="my.html" aria-label="마이"><img src="assets/icons/outline/user.svg" alt=""><span>마이</span></a></div>
    </div></nav>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script src="field.js"></script>
<script src="grade.js"></script>
<script>
(function () {
  // 단계별 진행: PICO 마크 색 + 한 줄 설명 + 만난 수 + 막대 (막대 = 그 단계 곤충 중 만난 비율)
  var G = PicoGrade, gotAll = 0, TC = { common: 'var(--lime)', normal: 'var(--rule-cyan)', rare: 'var(--rule-pink)' };
  var MARK = '<svg class="mk" viewBox="0 0 18.23 19.62" aria-hidden="true"><polygon points="3.79,0.5 16.59,5.53 17.73,16.48 5.74,19.12 0.5,8.89" style="fill:var(--tc)" stroke="#211b17" stroke-width="1" stroke-linejoin="round"/></svg>';
  document.getElementById('tiers').innerHTML = G.ORDER.map(function (k) {
    var t = G.TIERS[k]; gotAll += t.got;
    return '<div class="tier" style="--tc:' + TC[k] + '"><p class="th">' + MARK + '<span class="tn">' + t.label + '</span><span class="tc">' + t.got + '</span></p>' +
      '<span class="bar" role="img" aria-label="' + t.label + ' 곤충 ' + t.total + '종 중 ' + t.got + '종"><i style="width:' + Math.round(t.got / t.total * 100) + '%"></i></span></div>';
  }).join('');
  document.getElementById('allGot').textContent = gotAll;

  // newest first (Figma order). First 4 sit above the TIP banner, the rest below it.
  var insects = [
    { name: '방아깨비', doodle: 'hop', date: '2027.11.22', img: 'card-grasshopper' },
    { name: '칠성무당벌레', doodle: 'ladybug', date: '2027.11.02', img: 'card-ladybug' },
    { name: '배추흰나비', doodle: 'butterfly', date: '2027.11.17', img: 'card-butterfly' },
    { name: '고추 잠자리', doodle: 'dragonfly', date: '2027.10.29', img: 'card-dragonfly', c: 'cyan' },
    { name: '소금쟁이', doodle: 'strider', date: '2027.10.18', img: 'card-waterstrider' },
    { name: '물방개', doodle: 'beetle', date: '2027.10.11', img: 'card-divingbeetle', c: 'cyan' },
    { name: '흰줄숲모기', doodle: 'mosquito', date: '2027.10.12', img: 'card-mosquito', c: 'cyan' },
    { name: '갈색 여치', doodle: 'hop', date: '2027.10.08', img: 'card-katydid', c: 'pink' },
    { name: '긴수염대벌레', doodle: 'stick', date: '2027.10.08', img: 'card-stickinsect', c: 'cyan' },
    { name: '큰자루긴수염나방', doodle: 'moth', date: '2027.10.05', img: 'card-moth', c: 'pink' },
    { name: '붉은점모시나비', doodle: 'butterfly2', date: '2027.09.23', img: 'card-apollo', c: 'pink' },
    { name: '상제나비', doodle: 'butterfly3', date: '2027.09.23', img: 'card-blackveined', c: 'cyan' }
  ];
  // 사진첩 안 그림: 내가 그려서 들판에 놓아준 그림(이름이 같은 곤충)이 있으면 그걸, 없으면 예시 그림
  var mine = {};
  ((window.PicoField && PicoField.list()) || []).forEach(function (m) { if (m.species) mine[m.species.replace(/\s+/g, '')] = m.src; });
  function drawing(it) {
    var src = mine[it.name.replace(/\s+/g, '')];
    if (src) return '<img src="' + src + '" alt="내가 그린 ' + it.name + '">';
    return window.PicoField ? PicoField.doodle(it.doodle) : '';
  }
  // 오른쪽 위 깃발 (Figma Rectangle 556): 단계 색 삼각형
  var FLAG = '<svg class="flag" viewBox="0 0 17.3 23.3" aria-hidden="true"><polygon points="0.5,0.5 16.8,14.4 4,22.8" style="fill:var(--tc)" stroke="#211b17" stroke-width="1" stroke-linejoin="round"/></svg>';
  function cardHTML(it) {
    return '<a class="icard' + (it.c ? ' c-' + it.c : '') + '" href="dogam-detail.html" data-name="' + it.name + '">' +
      '<img class="photo" src="assets/tabs/' + it.img + '.png" alt="">' +
      '<span class="label"><span class="meta"><b>' + it.name + '</b><span>' + it.date + '</span></span></span>' + FLAG +
      '<span class="album" role="img" aria-label="내가 그린 ' + it.name + ' 그림"><i class="sh"></i><i class="fc"></i><span class="pic">' + drawing(it) + '</span></span></a>';
  }
  // 아직 못 만난 곤충도 어떤 단계인지 보여 줘서, 다음에 찾을 목표가 돼요
  var UNMET = { '025': 'common', '028': 'common', '029': 'normal', '030': 'normal', '033': 'normal', '035': 'rare', '037': 'rare', '038': 'rare' };
  function utile(n) {
    return '<div class="utile"><span class="blank"></span><span class="label"><span class="meta"><b>No. ' + n + '</b><span>아직 못 만난 곤충</span></span></span><img src="assets/icons/outline/help.svg" alt=""></div>';
  }
  var cards = document.getElementById('cards'), cards2 = document.getElementById('cards2');
  var q = document.getElementById('q'), empty = document.getElementById('empty');
  var oldest = false, phone = document.querySelector('.phone'), list = document.getElementById('list');
  function render() {
    var v = q.value.replace(/\s+/g, '');
    var shown = insects.filter(function (it) { return !v || it.name.replace(/\s+/g, '').indexOf(v) !== -1; });
    if (oldest) shown = shown.slice().reverse();
    cards.innerHTML = shown.slice(0, 4).map(cardHTML).join('');
    // Figma order of the unmet tiles: No.25, No.27 in the last card grid, then No.26, No.28
    // unmet insects (Figma 곤충목록: same order for 최근순 and 오래된순)
    cards2.innerHTML = shown.slice(4).map(cardHTML).join('') + (v ? '' : ['025', '028', '029', '030', '033', '035', '037', '038'].map(utile).join(''));
    empty.hidden = shown.length > 0;
    // page grows with the list; keep it clear of the tab bar
    phone.style.setProperty('--h', Math.max(812, Math.ceil(list.offsetTop + list.offsetHeight + 130)) + 'px');
  }
  render();

  q.addEventListener('input', render);

  // search lives in the top bar: the icon opens a field in place of the logo, tapping again closes and clears it
  var searchBtn = document.getElementById('searchBtn'), navQ = document.getElementById('navQ'), logo = document.getElementById('logo');
  searchBtn.addEventListener('click', function () {
    var open = navQ.hidden;
    navQ.hidden = !open; logo.hidden = open;
    searchBtn.setAttribute('aria-expanded', open);
    searchBtn.querySelector('img').src = open ? 'assets/icons/outline/close.svg' : 'assets/icons/outline/search.svg';
    searchBtn.setAttribute('aria-label', open ? '검색 닫기' : '곤충 이름 찾기');
    if (open) { q.focus(); var sc = document.querySelector('.phone > .scroll'); if (sc) sc.scrollTop = 0; }
    else if (q.value) { q.value = ''; render(); }
  });

  // sort: 최근순 <-> 오래된순
  var sort = document.getElementById('sort');
  sort.addEventListener('click', function () {
    oldest = !oldest;
    sort.setAttribute('aria-pressed', oldest);
    sort.querySelector('span').textContent = oldest ? '오래된순' : '최근순';
    render();
  });
})();
</script>
</body></html>
