<style>
  /* surface panel behind radar / field */
  /* 들판 바탕은 종이 그대로 비쳐요 (Figma 3683:12013: 바탕 #FFFCE4 구김 종이 · 위쪽 선은 점선) */
  .panel { position: absolute; left: 0; top: 118px; width: 375px; height: 448.56px; background: transparent; border-top: 1px dashed var(--ink); border-bottom: 1px solid var(--ink); }
  .phone[data-mode="field"] .panel { height: 592.08px; }

  .greet { position: absolute; left: 19.56px; top: 141.47px; display: flex; flex-direction: column; gap: 5px; z-index: 3; }
  .greet h1 { font-weight: 700; font-size: 22px; line-height: 25.25px; height: 25.25px; white-space: nowrap; }
  .greet p { font-size: 16px; line-height: 15.25px; height: 15.25px; white-space: nowrap; }

  /* ---- radar mode ---- */
  .radar, .field { position: absolute; inset: 0; }
  .phone[data-mode="field"] .radar, .phone[data-mode="radar"] .field { display: none; }
  .abs { position: absolute; display: block; }
  .ring-lbl { position: absolute; top: 354.37px; font-size: 10px; line-height: 20px; white-space: nowrap; z-index: 1; }
  /* radar scope (Figma 2.1.2: dashed rings 300 / 200 / 100, centre at 187.35, 364.37) */
  .scope { position: absolute; left: 37.35px; top: 214.37px; width: 300px; height: 300px; }
  .ring { position: absolute; border: 1px dashed var(--ink); border-radius: 50%; }
  .ring--300 { left: 0; top: 0; width: 300px; height: 300px; }
  .ring--200 { left: 50px; top: 50px; width: 200px; height: 200px; }
  .ring--100 { left: 100px; top: 100px; width: 100px; height: 100px; }
  /* sweep: one turn every 4s, yellow (#F4D159, --reward) wedge trailing a thin leading line */
  .sweep { position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    background: conic-gradient(from 0deg, rgba(244, 209, 89, 0) 0deg, rgba(244, 209, 89, 0) 290deg, rgba(244, 209, 89, .5) 360deg);
    animation: radar-sweep var(--sweep) linear infinite; }
  .sweep::after { content: ''; position: absolute; left: 149.25px; top: 0; width: 1.5px; height: 150px; background: var(--reward); }
  /* sonar pulse from my position */
  .pulse { position: absolute; left: 0; top: 0; width: 300px; height: 300px; border-radius: 50%; border: 1.5px solid var(--reward); opacity: 0;
    animation: radar-pulse var(--sweep) var(--ease) infinite; }
  .pulse + .pulse { animation-delay: calc(var(--sweep) / 2); }
  :root { --sweep: 4s; }
  @keyframes radar-sweep { to { transform: rotate(360deg); } }
  @keyframes radar-pulse { 0% { transform: scale(.07); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }

  /* pins: yellow = not selected, green = selected. All pins show right away on load;
     each one pings when the sweep passes it (--a = its angle). */
  .pin { position: absolute; width: 47.852px; height: 47.852px; z-index: 2;
    animation: pin-found var(--dur) var(--ease) both, pin-ping var(--sweep) linear infinite;
    animation-delay: 0s, calc(var(--sweep) * var(--a) / 360); }
  .pin i { position: absolute; left: 6.93px; top: 6.93px; width: 34px; height: 34px; transform: rotate(39.37deg); border: 1px dashed var(--ink); background: var(--reward);
    transition: background-color var(--dur) var(--ease); }
  .pin img { position: absolute; left: 15.43px; top: 14.43px; width: 18px; height: 18px; }
  .pin::before { content: ''; position: absolute; left: 9.79px; top: 6.93px; width: 34px; height: 34px; transform: rotate(39.37deg); background: var(--ink-950); border: 1px solid var(--ink);
    opacity: 0; transition: opacity var(--dur) var(--ease); }
  .pin.on i { background: var(--brand); border-style: solid; }
  .pin.on::before { opacity: 1; }
  .pin:active i { filter: brightness(.92); }
  @keyframes pin-found { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes pin-ping { 0% { transform: scale(1); } 4% { transform: scale(1.14); } 12%, 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .sweep, .pulse { animation: none; display: none; } .pin { animation: none; } }

  .rec-card[hidden] { display: none; }
  /* empty state (Figma 2.1.2 홈-내 근처-0): no pin selected yet */
  .rec-empty { cursor: default; }
  .rec-empty .rec-face { gap: 10px; }
  .rec-empty .slot { position: relative; flex: none; width: 71.786px; height: 50px; border: 1px solid var(--ink); }
  .rec-empty .slot img { position: absolute; left: 19px; top: 7px; width: 32px; height: 32px; }
  .rec-empty .rec-txt { width: 190px; gap: 2px; }
  .rec-empty .rec-txt span { white-space: nowrap; }

  .rec-h { position: absolute; left: 19.94px; top: 577.25px; font-size: 16px; line-height: 20px; white-space: nowrap; }
  .rec-card { position: absolute; left: 19.85px; top: 601.94px; width: 330px; height: 70px; text-align: left; }
  .rec-card::before { content: ''; position: absolute; left: 5px; top: 6.85px; width: 330px; height: 70px; background: var(--ink); border: 1px solid var(--ink); }
  .rec-face { position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--ink); padding: 10px 1px 10px 14px; display: flex; align-items: center; gap: 9px; }
  .rec-face .thumb { width: 71.786px; height: 50px; }
  .rec-body { display: flex; align-items: flex-end; gap: 31px; }
  .rec-txt { width: 171.09px; display: flex; flex-direction: column; gap: 2px; }
  .rec-txt b { font-weight: 400; font-size: 14px; line-height: 20px; white-space: nowrap; }
  .rec-txt span { font-size: 10px; line-height: 12px; }
  .rec-body .chev { width: 32px; height: 32px; transform: rotate(-90deg); }

  .field-tex { left: 0; top: 0; width: 375px; height: 812px; pointer-events: none; background: url('assets/onboarding/ob-paper-full.jpg') 0 0 / 375px 812px; mix-blend-mode: multiply; opacity: .9; }
  /* ---- mode toggle ---- */
  .modes { position: absolute; left: 283.03px; top: 495.63px; width: 73px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; z-index: 4; }
  .phone[data-mode="field"] .modes { left: 282.39px; top: 636.3px; }
  .mode { position: relative; width: 72px; height: 25px; border: 1px dashed var(--ink); display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 10px; line-height: 10.27px; }
  .mode img { width: 18px; height: 18px; }
  .mode span { width: 29px; white-space: nowrap; }
  .mode.on { width: 70px; border: 1px solid var(--ink); background: var(--brand-soft); margin-right: 3px; }
  .mode.on::before { content: ''; position: absolute; left: 2px; top: .4px; width: 70px; height: 25px; background: var(--ink); border: 1px solid var(--ink); z-index: -1; }

  /* ---- field mode (exported illustration layers) ---- */
  .fpin { position: absolute; width: 20px; height: 20px; }
  .fpin img { position: absolute; }
  .fpin .o { inset: 0; width: 20px; height: 20px; }
  .fpin .i { left: 5px; top: 5px; width: 10px; height: 10px; }

  /* ---- place sheet ---- */
  .dim.scrim { background: rgba(44, 44, 44, .57); }
  .place { top: 357px; height: 455px; border-top: 0; }
  /* place sheet: slides up from the bottom edge, slides back down on close */
  .phone > .sheet.place { animation: sheet-up var(--dur) var(--ease) both; }
  .phone > .sheet.place.is-closing { animation: sheet-down var(--dur) var(--ease) both; }
  .phone > .dim.scrim.is-closing { animation: scrim-out var(--dur) var(--ease) both; }
  @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes sheet-down { from { transform: translateY(0); } to { transform: translateY(100%); } }
  @keyframes scrim-out { from { opacity: 1; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .phone > .sheet.place, .phone > .sheet.place.is-closing, .phone > .dim.scrim.is-closing { animation: none; } }
  .home-ind { z-index: 45; }
  .sheet.place { background: url('assets/onboarding/ob-paper-bottom.jpg') center bottom / cover no-repeat, var(--paper); background-blend-mode: multiply; }
  .place .sheet-handle { position: absolute; left: 162.5px; top: 17px; width: 50px; margin: 0; }
  .place-row { position: absolute; left: 19.03px; top: 54px; display: flex; align-items: center; gap: 15px; }
  .place-row .thumb { width: 71.786px; height: 50px; }
  .place-row div { width: 200px; height: 50px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .place-row h2 { font-size: 22px; line-height: 20px; }
  .place-row p { font-size: 14px; line-height: 12px; white-space: nowrap; }
  .place-map { position: absolute; left: 18.53px; top: 113.5px; width: 337px; height: 111px; }
  .meet { position: absolute; left: 19.03px; top: 234px; font-size: 14px; line-height: 12px; white-space: nowrap; }
  .bugs { position: absolute; left: 19.03px; top: 254px; width: 335px; padding: 0 20px; display: flex; gap: 20px; }
  .bug { width: 60px; height: 82px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .bug img { width: 60px; height: 60px; }
  .bug span { font-size: 12px; line-height: 12px; white-space: nowrap; }
  /* Figma 2.2.x 큰 버튼: face 330x54 at (19.17, 345), shadow +5.42 / +9.5 */
  .place .cta { left: 19.17px; top: 345px; }

  /* ---- 내 들판: 돌아다니는 PICO 스티커 (field.js) ---- */
  .pf-layer { position: absolute; inset: 0; z-index: 2; pointer-events: none; }
  .pf-bug { position: absolute; left: 0; top: 0; width: 64px; padding: 0; display: flex; flex-direction: column; align-items: center; pointer-events: auto; will-change: transform; }
  .pf-body { display: block; width: 64px; height: 64px; animation: pf-bob 1.6s ease-in-out infinite; animation-delay: inherit; }
  .pf-flip { display: block; width: 64px; height: 64px; transition: transform var(--dur) var(--ease); }
  .pf-flip svg, .pf-flip img { display: block; width: 64px; height: 64px; filter: drop-shadow(1.5px 2.5px 0 rgba(0,0,0,.22)); }
  .pf-bug.is-mine .pf-flip img, .pf-bug.is-paper .pf-flip img { object-fit: contain;
    filter: drop-shadow(2.5px 0 0 #fff) drop-shadow(-2.5px 0 0 #fff) drop-shadow(0 2.5px 0 #fff) drop-shadow(0 -2.5px 0 #fff) drop-shadow(1.5px 2.5px 0 rgba(0,0,0,.22)); }
  .pf-name { margin-top: -4px; font-size: 11px; line-height: 16px; padding: 0 6px; white-space: nowrap; background: #fffdf7; border: 1.5px solid var(--ink); }
  .pf-bug.is-mine .pf-name { background: var(--reward); }
  .pf-bug.is-moving .pf-body { animation-duration: .5s; }                 /* 걸을 땐 통통 */
  .pf-bug.is-fly .pf-body { animation-name: pf-flutter; animation-duration: .9s; }
  .pf-bug.is-hop.is-moving .pf-body { animation-name: pf-hop; animation-duration: .7s; }
  .pf-bug.is-poke .pf-flip { animation: pf-poke .5s ease; }
  .pf-bug.is-knock .pf-body { animation: pf-knock .52s ease-out both; }   /* 눌리면 납작해졌다가 튕겨 나가며 한 바퀴 흔들 */
  .pf-bug.is-arrive .pf-body { animation: pf-drop 1.2s cubic-bezier(.3,1.4,.5,1) both; }
  @keyframes pf-bob { 0%,100% { transform: translateY(0); } 50% { transform: translateY(-3px); } }
  @keyframes pf-flutter { 0%,100% { transform: translateY(0) rotate(-3deg); } 50% { transform: translateY(-8px) rotate(3deg); } }
  @keyframes pf-hop { 0%,100% { transform: translateY(0); } 40% { transform: translateY(-14px); } }
  @keyframes pf-knock { 0% { transform: scale(1); } 14% { transform: scale(1.22,.78); } 40% { transform: translateY(-16px) rotate(18deg) scale(1.08); } 70% { transform: translateY(0) rotate(-8deg) scale(1.04,.94); } 100% { transform: none; } }
  @keyframes pf-poke { 0% { transform: scale(1); } 40% { transform: scale(1.18) rotate(-6deg); } 100% { transform: scale(1); } }
  @keyframes pf-drop { 0% { transform: translateY(-260px) scale(.6) rotate(-20deg); opacity: 0; } 30% { opacity: 1; } 100% { transform: none; } }
  @media (prefers-reduced-motion: reduce) { .pf-body, .pf-bug.is-arrive .pf-body { animation: none; } }
  .pf-arrive { position: absolute; left: 50%; top: 190px; transform: translateX(-50%); z-index: 6; width: 300px; background: var(--surface); border: 1px solid var(--ink); box-shadow: 5px 7px 0 var(--ink); padding: 12px 14px; text-align: center; animation: pf-banner 3.6s ease both; pointer-events: none; }
  .pf-arrive b { display: block; font-size: 16px; font-weight: 700; margin-bottom: 4px; }
  .pf-arrive span { font-size: 13px; }
  /* 내 들판의 친구를 누르면: 정보 시트 (+ 삭제) */
  .pf-bug.is-bye { pointer-events: none; }
  .pf-bug.is-bye .pf-body { animation: pf-bye var(--dur) var(--ease) both; }
  .pf-bug.is-bye .pf-name { opacity: 0; transition: opacity calc(var(--dur) * .6) var(--ease); }
  @keyframes pf-bye { from { transform: scale(1) rotate(0); opacity: 1; } to { transform: scale(.2) rotate(-25deg) translateY(-24px); opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .pf-bug.is-bye .pf-body { animation: none; opacity: 0; } }
  /* 들판의 친구 정보 시트 (Figma 3683:14910): 높이 264 · 작은 종이 액자 + 이름·종류·한 줄 정보 + 원본 버튼 */
  .place.bugsheet { top: 548px; height: 264px; }
  .bs-tile { position: absolute; left: 19.5px; top: 61.7px; width: 72.404px; height: 72.654px; }
  .bs-tile::before { content: ''; position: absolute; left: 2.38px; top: 3.18px; width: 67.57px; height: 67.57px; background: var(--lime); border: .5px solid var(--ink); box-sizing: border-box; }
  .bs-tile::after { content: ''; position: absolute; left: 2.55px; top: 2.54px; width: 67.298px; height: 67.57px; background: var(--paper); border: .5px solid var(--ink); box-sizing: border-box; transform: rotate(4.51deg); }
  .bs-tile > * { position: absolute; z-index: 1; left: 8.16px; top: 9px; width: 54.4px; height: 54.4px; display: block; object-fit: contain; }
  .bs-tile > svg { overflow: visible; }
  .bs-tile > img.is-sample { top: 13.28px; height: 47.454px; }
  .bs-info, .bs-ask { position: absolute; left: 106.9px; width: 250px; }
  .bs-info { top: 66.5px; display: flex; flex-direction: column; gap: 10px; }
  .bs-info h2 { font-size: 22px; line-height: 20px; font-weight: 400; white-space: nowrap; }
  .bs-info p { font-size: 14px; line-height: 12px; margin: 0; white-space: nowrap; }
  .bs-ask { top: 66px; }
  .bs-ask h2 { font-size: 18px; line-height: 22px; font-weight: 700; }
  .bs-ask p { font-size: 14px; line-height: 18px; margin-top: 8px; }
  /* 버튼은 원본 버튼(PICO/Button/Original): 연두 면 + 뒤에 −1.8° 기울어진 한 장 */
  .bs-btns { position: absolute; left: 21.06px; top: 154.57px; width: 335px; height: 65.13px; display: flex; gap: 16px; }
  .bs-btn { position: relative; flex: 1; height: 65.13px; padding: 0; background: none; border: 0; color: inherit; font: inherit; cursor: pointer; }
  .bs-btn::before { content: ''; position: absolute; left: -1.1px; top: 0; width: 100%; height: 100%; background: var(--lime); border: 1px solid var(--ink); box-sizing: border-box; transform: rotate(-1.8deg); }
  .bs-btn:not(.is-lime):not(.is-rose)::before, .bs-btn:not(.is-lime):not(.is-rose) .cta-face { background: var(--paper); }
  .bs-btn.is-rose::before, .bs-btn.is-rose .cta-face { background: #f8addb; }
  .bs-btn:active .cta-face { transform: rotate(-1.8deg); }
  .bs-btn:focus-visible { outline: 2px solid var(--ink); outline-offset: 4px; }
  .bugsheet.is-sample #bugDel { display: none; }
  .bs-toast { top: 204px; z-index: 46; }
  .bugsheet:focus { outline: none; }
  @keyframes pf-banner { 0% { opacity: 0; transform: translate(-50%, -12px); } 12%, 82% { opacity: 1; transform: translate(-50%, 0); } 100% { opacity: 0; transform: translate(-50%, -12px); } }
</style>

      <a class="tab-cam" href="capture-1.html" aria-label="관찰"><img src="assets/common/tab-camera.png" alt=""><span class="tab-cam-label">관찰</span></a>

    </div></nav>

  <!-- ========== place bottom sheet ========== -->
  <div class="dim scrim" id="sheetDim" hidden></div>
  <div class="sheet place" id="sheet" role="dialog" aria-modal="true" aria-labelledby="placeName" hidden>

    </div>

    <a class="cta cta--yellow" href="capture-1.html"><span class="cta-face">탐험 시작하기 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></a>
  </div>

  <!-- ========== 들판의 친구 정보 시트: 누르면 정보, 삭제하기 ========== -->
  <div class="dim scrim" id="bugDim" hidden></div>
  <div class="sheet place bugsheet" id="bugSheet" tabindex="-1" role="dialog" aria-modal="true" aria-labelledby="bugName" hidden>
    <div class="sheet-handle"></div>
    <div class="bs-tile" id="bugTile"></div>
    <div class="bs-info" id="bugInfo">
      <h2 id="bugName"></h2>
      <p id="bugSpecies"></p>
      <p class="bs-date" id="bugDate"></p>
    </div>
    <div class="bs-ask" id="bugAsk" hidden>
      <h2>들판에서 삭제할까요?</h2>
      <p id="bugAskSub"></p>
    </div>
    <div class="bs-btns" id="bugBtnsInfo">
      <button type="button" class="bs-btn" id="bugDel"><span class="cta-face">삭제하기</span></button>
      <button type="button" class="bs-btn is-lime" id="bugClose"><span class="cta-face">닫기</span></button>
    </div>
    <div class="bs-btns" id="bugBtnsAsk" hidden>
      <button type="button" class="bs-btn" id="bugNo"><span class="cta-face">취소</span></button>
      <button type="button" class="bs-btn is-rose" id="bugYes"><span class="cta-face">삭제하기</span></button>
    </div>
  </div>
  <div class="toast bs-toast" id="bugToast" role="status" hidden>들판에서 삭제했어요.</div>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script src="field.js"></script>
<script>
(function () {
  var phone = document.getElementById('phone');

  // 인사말: 개인 설정 1에서 정한 탐험가 이름 (setup-name.html → localStorage 'pico.name').
  // 이름을 정하지 않았으면 탐험가 카드(setup-done.html)와 같은 예시 이름을 써요.
  var greetName = '초고속 탐험가 선우';
  try { greetName = (localStorage.getItem('pico.name') || '').trim() || greetName; } catch (e) {}
  document.getElementById('greetName').textContent = greetName + ',';

  // nearby places = radar pins. x/y: bounding box of the rotated 34px square; a: angle (deg, clockwise from up)
  // from the radar centre, so each pin lights up when the sweep passes it.
  // Only 햇살 근린 공원 is designed in Figma; the other two reuse its map and use insect photos as thumbnails.
  // Figma 2.1.2 홈 ×3 + 2.2.1–2.2.3 홈 팝업: pin positions = "map" instance + 3.63 (rotated-square bounds)
  var ALL_BUGS = [['grasshopper', '방아깨비'], ['ladybug', '무당벌레'], ['butterfly', '호랑나비'], ['dragonfly', '고추잠자리']];
  var places = [
    { x: 94.63,  y: 455.63, a: 210.9, name: '햇살 근린 공원', sub: '걸어서 5분 · 지금 방아깨비가 많아요',
      thumb: 'assets/home/place-thumb-park.png', map: 'assets/home/place-map.png', bugs: ALL_BUGS },
    { x: 128.63, y: 257.63, a: 337.2, name: '물빛 개울 산책로', sub: '걸어서 6분 · 고추잠자리가 자주 보여요',
      thumb: 'assets/home/place-thumb-stream.png', map: 'assets/home/place-map-stream.png', bugs: [['dragonfly', '고추잠자리']] },
    { x: 268.63, y: 400.63, a: 119.8, name: '학교 뒤 텃밭', sub: '걸어서 7분 · 잎 위에 무당벌레가 있어요',
      thumb: 'assets/home/place-thumb-garden.png', map: 'assets/home/place-map-garden.png', bugs: [['ladybug', '무당벌레'], ['butterfly', '호랑나비']] }
  ];
  var pinsEl = document.getElementById('radarPins');
  pinsEl.innerHTML = places.map(function (p, i) {
    return '<button type="button" class="pin" data-pin="' + i + '" aria-pressed="false" style="left:' + p.x + 'px;top:' + p.y + 'px;--a:' + p.a +
      '" aria-label="' + p.name + '"><i></i><img src="assets/icons/outline/location.svg" alt=""></button>';
  }).join('');

  // selection: yellow = not selected, green = selected → 내 근처 탐험 추천 appears
  var selected = -1, recEmpty = document.getElementById('recEmpty'), recCard = document.getElementById('recCard');
  function setThumb(img, p) { img.src = p.thumb; }
  function select(i) {
    if (i === selected) return;
    selected = i;
    pinsEl.querySelectorAll('.pin').forEach(function (b) {
      var on = +b.dataset.pin === i;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    // swap the card (empty ↔ place) and replay its 300ms dissolve
    var show = i < 0 ? recEmpty : recCard, hide = i < 0 ? recCard : recEmpty;
    hide.hidden = true; show.hidden = true; void show.offsetWidth; show.hidden = false;
    if (i < 0) return;
    var p = places[i];
    document.getElementById('recName').textContent = p.name;
    document.getElementById('recSub').textContent = p.sub;
    setThumb(document.getElementById('recThumb'), p);
    recCard.setAttribute('aria-label', p.name + ' 자세히 보기');
  }
  pinsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.pin'); if (b) select(+b.dataset.pin);
  });
  // tapping empty radar space clears the selection
  document.querySelector('.radar').addEventListener('click', function (e) {
    if (!e.target.closest('.pin, .rec, button, a')) select(-1);
  });

  // field illustration: exported layers, Figma render bounds, in Figma z-order
  var F = 'assets/home/field-new/';  // 새 색 (모양은 그대로)
  // 피그마 3683:12013 들판 그림 — 레이어마다 피그마 좌표 그대로 (이미지는 선 두께까지 포함한 크기)
  var layers = [
    ['sun', 199.89, 183.64, 175.11, 225.17],
    ['hill-back', 0, 310.36, 375, 208.83],
    ['hill-front', 0, 416.11, 375, 277.96],
    ['pond-outer', 19.5, 570, 165, 55],
    ['bush-patch', 210.5, 462, 95, 35],
    ['pond-inner', 20.5, 579, 87, 27],
    ['tree-tall', 45.11, 425.12, 42.55, 84.78], ['tree-mid', 24.56, 461.78, 42.55, 66.69],
    ['tree-a', 289.1, 347.45, 30.42, 47.67], ['tree-b', 262.5, 327.2, 25.67, 38.2], ['tree-c', 65.75, 320.45, 25.67, 39.84]
  ];
  // 풀 덤불(24×16)은 피그마 벡터 그대로 선으로 그려요
  var tufts = [[340, 337.5], [116, 412.5], [326, 551.5]];
  var TUFT = '<svg class="abs" viewBox="0 0 24 16" width="24" height="16" style="left:LEFTpx;top:TOPpx;overflow:visible;pointer-events:none" aria-hidden="true"><polygon points="0.5,15.5 4.5,4.5 8,10.5 11.5,0.5 14.5,10.5 18.5,5 23.5,15.5" fill="none" stroke="#211b17" stroke-width="1" stroke-linejoin="miter"/></svg>';
  // 길: 피그마의 가느다란 길 (탭바 윗선 693.5에서 끝나요)
  var PATH_D = 'M384.4 506.3 L379.7 507.9 L375.0 509.6 L370.3 511.4 L365.7 513.3 L361.1 515.3 L356.6 517.3 L352.1 519.5 L347.6 521.7 L343.2 524.0 L338.8 526.4 L334.5 528.9 L330.3 531.5 L326.1 534.1 L321.9 536.9 L317.8 539.7 L313.7 542.5 L309.7 545.5 L305.8 548.5 L301.8 551.6 L298.0 554.8 L294.2 558.0 L290.5 561.3 L286.8 564.7 L283.2 568.1 L279.6 571.6 L276.1 575.1 L272.6 578.7 L269.2 582.4 L265.9 586.1 L262.6 589.9 L259.4 593.7 L256.3 597.6 L253.2 601.6 L250.2 605.5 L247.3 609.6 L244.4 613.7 L241.6 617.8 L238.9 622.0 L236.2 626.2 L233.6 630.4 L231.1 634.7 L228.6 639.0 L226.2 643.4 L223.9 647.8 L221.7 652.2 L219.5 656.7 L217.4 661.2 L215.4 665.7 L213.5 670.3 L211.6 674.9 L209.8 679.5 L208.1 684.1 L206.5 688.8 L205.0 693.5 L203.5 698.2 L212.0 698.3 L213.4 693.9 L214.8 689.4 L216.3 685.0 L217.9 680.6 L219.5 676.2 L221.3 671.9 L223.1 667.6 L225.0 663.2 L227.0 659.0 L229.0 654.7 L231.2 650.5 L233.4 646.3 L235.6 642.1 L238.0 638.0 L240.4 633.9 L242.8 629.8 L245.4 625.8 L248.0 621.8 L250.7 617.8 L253.4 613.9 L256.2 610.0 L259.1 606.2 L262.1 602.4 L265.1 598.7 L268.1 595.0 L271.2 591.4 L274.4 587.8 L277.7 584.3 L280.9 580.8 L284.3 577.4 L287.7 574.0 L291.2 570.7 L294.7 567.5 L298.2 564.3 L301.9 561.2 L305.5 558.1 L309.2 555.2 L313.0 552.3 L316.8 549.4 L320.7 546.6 L324.6 543.9 L328.5 541.3 L332.5 538.8 L336.6 536.3 L340.7 533.9 L344.8 531.6 L348.9 529.4 L353.1 527.2 L357.4 525.1 L361.7 523.2 L366.0 521.3 L370.3 519.5 L374.7 517.8 L379.1 516.1 L383.6 514.6Z';
  document.getElementById('field').innerHTML = layers.map(function (l) {
    return '<img class="abs" src="' + F + l[0] + '.png" alt="" style="left:' + l[1] + 'px;top:' + l[2] + 'px;width:' + l[3] + 'px;height:' + l[4] + 'px">';
  }).join('')
    + '<svg class="abs" viewBox="0 0 375 693.5" width="375" height="693.5" style="left:0;top:0;pointer-events:none" aria-hidden="true"><path d="' + PATH_D + '" fill="#f7f1c9" stroke="#211b17" stroke-width="1" stroke-linejoin="round"/></svg>'
    // 언덕 능선마다 접는 선 (피그마 3683:12048 · 3683:12058)
    + '<svg class="abs" viewBox="0 0 375 812" width="375" height="812" style="left:0;top:0;pointer-events:none" aria-hidden="true">'
    + '<polyline points="0,386.5 6,385.3 12,384.2 18,383.1 24,381.9 30,380.8 36,379.7 42,378.6 48,377.5 54,376.4 60,375.3 66,374.2 72,373.1 78,372.0 84,371.0 90,369.9 96,368.8 102,367.8 108,366.8 114,365.7 120,364.7 126,363.7 132,362.7 138,361.7 144,360.7 150,359.7 156,358.8 162,357.8 168,356.8 174,355.9 180,355.0 186,354.1 192,353.2 198,352.3 204,351.4 210,350.5 216,349.6 222,348.8 228,347.9 234,347.1 240,346.3 246,345.5 252,344.7 258,343.9 264,343.1 270,342.4 276,341.7 282,340.9 288,340.2 294,339.5 300,338.8 306,338.2 312,337.5 318,336.9 324,336.2 330,335.6 336,335.0 342,334.4 348,333.9 354,333.3 360,332.8 366,332.3 372,331.8" fill="none" stroke="#211b17" stroke-width="1" stroke-dasharray="5 4"/>'
    + '<g transform="translate(0 430.26) scale(1.008 1.061) translate(0 -464)"><polyline points="0,464 6,464 12,464 18,464 24,464 30,464 36,464 42,465 48,465 54,466 60,466 66,466 72,466 78,466 84,467 90,467 96,468 102,468 108,468 114,469 120,470 126,470 132,470 138,472 144,472 150,472 156,474 162,474 168,475 174,476 180,476 186,477 192,478 198,479 204,480 210,481 216,482 222,483 228,484 234,485 240,486 246,487 252,488 258,490 264,490 270,492 276,493 282,494 288,496 294,497 300,498 306,500 312,501 318,502 324,504 330,506 336,507 342,509 348,510 354,512 360,514 366,516 372,517" fill="none" stroke="#211b17" stroke-width="1" stroke-dasharray="5 4" vector-effect="non-scaling-stroke"/></g>'
    + '</svg>'
    + tufts.map(function (t) { return TUFT.replace('LEFT', t[0]).replace('TOP', t[1]); }).join('')
    + '<div class="abs field-tex" aria-hidden="true"></div>';
  if (window.picoFade) picoFade(document.getElementById('field'));


  // 내 들판: 예시 친구 + 내가 그린 PICO가 돌아다녀요 (field.js)
  var bugLayer = document.createElement('div');
  bugLayer.className = 'pf-layer'; bugLayer.id = 'fieldBugs'; bugLayer.setAttribute('aria-label', '들판의 PICO들');
  document.getElementById('field').appendChild(bugLayer);
  var fieldCtl = null;
  if (window.PicoField) fieldCtl = PicoField.mount(bugLayer, {
    onTap: function (b) { openBug(b); },
    onArrive: function (b) {
      var n = document.createElement('div'); n.className = 'pf-arrive'; n.setAttribute('role', 'status');
      n.innerHTML = '<b>새로운 친구가 들판에 도착했어요!</b><span>' + b.name + '가 오늘부터 여기서 지내요.</span>';
      document.getElementById('field').appendChild(n);
      setTimeout(function () { n.remove(); }, 3800);
    }
  });

  // place sheet content follows the selected place (field pins open 햇살 근린 공원)
  function fillSheet(p) {
    document.getElementById('placeName').textContent = p.name;
    document.getElementById('placeSub').textContent = p.sub;
    var map = document.getElementById('placeMap');
    map.src = p.map; map.alt = p.name + ' 주변 지도';
    setThumb(document.getElementById('sheetThumb'), p);
    document.getElementById('bugs').innerHTML = p.bugs.map(function (b) {
      return '<div class="bug"><img src="assets/home/insect-' + b[0] + '.png" alt=""><span>' + b[1] + '</span></div>';
    }).join('');
  }
  fillSheet(places[0]);

  // mode toggle
  var modeBtns = document.querySelectorAll('.mode');
  function setMode(m) {
    phone.setAttribute('data-mode', m);
    modeBtns.forEach(function (b) {
      var on = b.getAttribute('data-mode') === m;
      b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }
  modeBtns.forEach(function (b) { b.addEventListener('click', function () { var m = b.getAttribute('data-mode'); window.picoSwap(function () { setMode(m); }); }); });

  // sheet
  var sheet = document.getElementById('sheet'), dim = document.getElementById('sheetDim');
  // bottom sheet slides up from below (300ms, Slow); the scrim dissolves with it
  var closeTimer;
  function openSheet() {
    clearTimeout(closeTimer);
    fillSheet(places[selected >= 0 && phone.getAttribute('data-mode') === 'radar' ? selected : 0]);
    sheet.classList.remove('is-closing'); dim.classList.remove('is-closing');
    sheet.hidden = false; dim.hidden = false;
  }
  function closeSheet() {
    if (sheet.hidden) return;
    sheet.classList.add('is-closing'); dim.classList.add('is-closing');
    closeTimer = setTimeout(function () {
      sheet.hidden = true; dim.hidden = true;
      sheet.classList.remove('is-closing'); dim.classList.remove('is-closing');
    }, (window.picoDur ? picoDur() : 300) + 20);
  }
  document.addEventListener('click', function (e) { if (e.target.closest('[data-open-sheet]')) openSheet(); });
  dim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') { closeSheet(); if (window.closeBugSheet) closeBugSheet(); } });

  // ---- 들판의 친구를 누르면: 정보 → (삭제하기 → 한 번 더 물어봐요) ----
  var bugSheet = document.getElementById('bugSheet'), bugDim = document.getElementById('bugDim'), bugToast = document.getElementById('bugToast');
  var curBug = null, bugTimer, toastTimer;
  function $(id) { return document.getElementById(id); }
  function josa(word, withFinal, without) {          // 받침이 있으면 을, 없으면 를
    var c = word.charCodeAt(word.length - 1) - 0xAC00;
    return word + (c >= 0 && c <= 11171 && c % 28 !== 0 ? withFinal : without);
  }
  function whenText(t) {
    if (!t) return '';
    var d = new Date(t); if (isNaN(d.getTime())) return '';
    var now = new Date();
    return (d.toDateString() === now.toDateString() ? '오늘' : (d.getMonth() + 1) + '월 ' + d.getDate() + '일') + '에 들판에 놓아줬어요.';
  }
  function bugMode(m) {                              // 'info' | 'ask'
    $('bugInfo').hidden = m !== 'info'; $('bugBtnsInfo').hidden = m !== 'info';
    $('bugAsk').hidden = m !== 'ask'; $('bugBtnsAsk').hidden = m !== 'ask';
  }
  function openBug(b) {
    clearTimeout(bugTimer);
    curBug = b;
    $('bugTile').innerHTML = '<img' + (b.tile ? ' class="' + b.tile + '"' : '') + ' src="' + b.src + '" alt="">';
    $('bugName').textContent = b.name;
    $('bugSpecies').textContent = b.species || '';
    $('bugSpecies').hidden = !$('bugSpecies').textContent;
    $('bugDate').textContent = b.mine ? whenText(b.at) : (b.info || '');   // 내 친구는 놓아준 날, 예시 친구는 한 줄 정보
    $('bugDate').hidden = !$('bugDate').textContent;
    $('bugAskSub').textContent = '삭제하면 되돌릴 수 없어요.';
    bugSheet.classList.toggle('is-sample', !b.mine);
    bugMode('info');
    bugSheet.classList.remove('is-closing'); bugDim.classList.remove('is-closing');
    bugSheet.hidden = false; bugDim.hidden = false;
    $('bugClose').focus({ preventScroll: true });
  }
  window.closeBugSheet = closeBug;
  function closeBug() {
    if (bugSheet.hidden) return;
    bugSheet.classList.add('is-closing'); bugDim.classList.add('is-closing');
    if (fieldCtl) fieldCtl.unhold();
    bugTimer = setTimeout(function () {
      bugSheet.hidden = true; bugDim.hidden = true;
      bugSheet.classList.remove('is-closing'); bugDim.classList.remove('is-closing');
      curBug = null;
    }, (window.picoDur ? picoDur() : 300) + 20);
  }
  function showToast(text) {
    bugToast.textContent = text; bugToast.hidden = false; clearTimeout(toastTimer);
    toastTimer = setTimeout(function () { bugToast.hidden = true; }, 2200);
  }
  $('bugClose').addEventListener('click', closeBug);
  bugDim.addEventListener('click', closeBug);
  $('bugDel').addEventListener('click', function () { window.picoSwap(function () { bugMode('ask'); }); });
  $('bugNo').addEventListener('click', function () { window.picoSwap(function () { bugMode('info'); }); });
  $('bugYes').addEventListener('click', function () {
    var b = curBug; if (!b || !b.mine) return;
    window.PicoField && PicoField.remove(b.id);
    fieldCtl && fieldCtl.remove(b.id);
    closeBug();
    showToast(josa(b.name, '을', '를') + ' 들판에서 삭제했어요.');
  });

  var st = document.documentElement.dataset.state;
  // 홈은 항상 내 들판으로 열려요. 내 근처는 토글이나 ?state=radar|picked 로만.
  setMode('field');
  if (st === 'sheet') { setMode('field'); openSheet(); }
  if (st === 'bug') setTimeout(function () { var el = document.querySelector('.pf-bug.is-mine') || document.querySelector('.pf-bug'); if (el) { el.click(); el.click(); } }, 80);   // 한 번 누르면 튕기니, 정보 시트를 바로 보려면 두 번
})();
</script>
