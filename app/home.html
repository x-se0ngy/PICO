<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICO · 홈</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* surface panel behind radar / field */
  .panel { position: absolute; left: 0; top: 118px; width: 375px; height: 448.56px; background: var(--surface); border-top: 1px solid var(--ink); border-bottom: 1px solid var(--ink); }
  .phone[data-mode="field"] .panel { height: 592.08px; }

  .greet { position: absolute; left: 19.56px; top: 141.47px; display: flex; flex-direction: column; gap: 5px; z-index: 3; }
  .greet h1 { font-weight: 700; font-size: 22px; line-height: 25.25px; height: 25.25px; white-space: nowrap; }
  .greet p { font-size: 16px; line-height: 15.25px; height: 15.25px; white-space: nowrap; }

  /* ---- radar mode ---- */
  .radar, .field { position: absolute; inset: 0; }
  .phone[data-mode="field"] .radar, .phone[data-mode="radar"] .field { display: none; }
  .abs { position: absolute; display: block; }
  .ring-lbl { position: absolute; top: 354.37px; font-size: 10px; line-height: 20px; white-space: nowrap; z-index: 1; }
  /* radar scope (Figma 2.1.2: dashed rings 300 / 200 / 100, centre at 187.35, 364.37) */
  .scope { position: absolute; left: 37.35px; top: 214.37px; width: 300px; height: 300px; }
  .ring { position: absolute; border: 1px dashed var(--ink); border-radius: 50%; }
  .ring--300 { left: 0; top: 0; width: 300px; height: 300px; }
  .ring--200 { left: 50px; top: 50px; width: 200px; height: 200px; }
  .ring--100 { left: 100px; top: 100px; width: 100px; height: 100px; }
  /* sweep: one turn every 4s, olive wedge trailing a thin leading line */
  .sweep { position: absolute; inset: 0; border-radius: 50%; overflow: hidden;
    background: conic-gradient(from 0deg, rgba(177, 189, 53, 0) 0deg, rgba(177, 189, 53, 0) 290deg, rgba(177, 189, 53, .5) 360deg);
    animation: radar-sweep var(--sweep) linear infinite; }
  .sweep::after { content: ''; position: absolute; left: 149.25px; top: 0; width: 1.5px; height: 150px; background: #7d8622; }
  /* sonar pulse from my position */
  .pulse { position: absolute; left: 0; top: 0; width: 300px; height: 300px; border-radius: 50%; border: 1.5px solid var(--brand); opacity: 0;
    animation: radar-pulse var(--sweep) cubic-bezier(.25, .6, .07, 1) infinite; }
  .pulse + .pulse { animation-delay: calc(var(--sweep) / 2); }
  :root { --sweep: 4s; }
  @keyframes radar-sweep { to { transform: rotate(360deg); } }
  @keyframes radar-pulse { 0% { transform: scale(.07); opacity: .9; } 100% { transform: scale(1); opacity: 0; } }

  /* pins: yellow = not selected, green = selected. Each pin is "found" when the sweep passes it (--a = its angle). */
  .pin { position: absolute; width: 47.852px; height: 47.852px; z-index: 2;
    animation: pin-found .3s cubic-bezier(.25, .6, .07, 1) both, pin-ping var(--sweep) linear infinite;
    animation-delay: calc(var(--sweep) * var(--a) / 360), calc(var(--sweep) * var(--a) / 360); }
  .pin i { position: absolute; left: 6.93px; top: 6.93px; width: 34px; height: 34px; transform: rotate(39.37deg); border: 1px dashed var(--ink); background: var(--reward);
    transition: background-color .3s cubic-bezier(.25, .6, .07, 1); }
  .pin img { position: absolute; left: 15.43px; top: 14.43px; width: 18px; height: 18px; }
  .pin::before { content: ''; position: absolute; left: 9.79px; top: 6.93px; width: 34px; height: 34px; transform: rotate(39.37deg); background: var(--ink-950); border: 1px solid var(--ink);
    opacity: 0; transition: opacity .3s cubic-bezier(.25, .6, .07, 1); }
  .pin.on i { background: var(--brand); border-style: solid; }
  .pin.on::before { opacity: 1; }
  .pin:active i { filter: brightness(.92); }
  @keyframes pin-found { from { opacity: 0; transform: scale(.6); } to { opacity: 1; transform: scale(1); } }
  @keyframes pin-ping { 0% { transform: scale(1); } 4% { transform: scale(1.14); } 12%, 100% { transform: scale(1); } }
  @media (prefers-reduced-motion: reduce) { .sweep, .pulse { animation: none; display: none; } .pin { animation: none; } }

  .rec-card[hidden] { display: none; }
  /* empty state (Figma 2.1.2 홈-내 근처-0): no pin selected yet */
  .rec-empty { cursor: default; }
  .rec-empty .rec-face { gap: 10px; }
  .rec-empty .slot { position: relative; flex: none; width: 71.786px; height: 50px; border: 1px solid var(--ink); }
  .rec-empty .slot img { position: absolute; left: 19px; top: 7px; width: 32px; height: 32px; }
  .rec-empty .rec-txt { width: 190px; gap: 2px; }
  .rec-empty .rec-txt span { white-space: nowrap; }

  .rec-h { position: absolute; left: 19.94px; top: 577.25px; font-size: 16px; line-height: 20px; white-space: nowrap; }
  .rec-card { position: absolute; left: 19.85px; top: 601.94px; width: 330px; height: 70px; text-align: left; }
  .rec-card::before { content: ''; position: absolute; left: 5px; top: 6.85px; width: 330px; height: 70px; background: var(--ink); border: 1px solid var(--ink); }
  .rec-face { position: absolute; inset: 0; background: var(--surface); border: 1px solid var(--ink); padding: 10px 1px 10px 14px; display: flex; align-items: center; gap: 9px; }
  .rec-face .thumb { width: 71.786px; height: 50px; }
  .rec-body { display: flex; align-items: flex-end; gap: 31px; }
  .rec-txt { width: 171.09px; display: flex; flex-direction: column; gap: 2px; }
  .rec-txt b { font-weight: 400; font-size: 14px; line-height: 20px; white-space: nowrap; }
  .rec-txt span { font-size: 10px; line-height: 12px; }
  .rec-body .chev { width: 32px; height: 32px; transform: rotate(-90deg); }

  /* ---- mode toggle ---- */
  .modes { position: absolute; left: 283.03px; top: 495.63px; width: 73px; display: flex; flex-direction: column; align-items: flex-end; gap: 5px; z-index: 4; }
  .phone[data-mode="field"] .modes { left: 282.39px; top: 636.3px; }
  .mode { position: relative; width: 72px; height: 25px; border: 1px dashed var(--ink); display: flex; align-items: center; justify-content: center; gap: 4px; font-size: 10px; line-height: 10.27px; }
  .mode img { width: 18px; height: 18px; }
  .mode span { width: 29px; white-space: nowrap; }
  .mode.on { width: 70px; border: 1px solid var(--ink); background: var(--brand-soft); margin-right: 3px; }
  .mode.on::before { content: ''; position: absolute; left: 2px; top: .4px; width: 70px; height: 25px; background: var(--ink); border: 1px solid var(--ink); z-index: -1; }

  /* ---- field mode (exported illustration layers) ---- */
  .fpin { position: absolute; width: 20px; height: 20px; }
  .fpin img { position: absolute; }
  .fpin .o { inset: 0; width: 20px; height: 20px; }
  .fpin .i { left: 5px; top: 5px; width: 10px; height: 10px; }

  /* ---- place sheet ---- */
  .dim.scrim { background: rgba(44, 44, 44, .57); }
  .place { top: 357px; height: 455px; border-top: 0; }
  /* place sheet: slides up from the bottom edge, slides back down on close */
  .phone > .sheet.place { animation: sheet-up .3s cubic-bezier(.32, .72, 0, 1) both; }
  .phone > .sheet.place.is-closing { animation: sheet-down .3s cubic-bezier(.4, 0, .7, .2) both; }
  .phone > .dim.scrim.is-closing { animation: scrim-out .3s cubic-bezier(.25, .6, .07, 1) both; }
  @keyframes sheet-up { from { transform: translateY(100%); } to { transform: translateY(0); } }
  @keyframes sheet-down { from { transform: translateY(0); } to { transform: translateY(100%); } }
  @keyframes scrim-out { from { opacity: 1; } to { opacity: 0; } }
  @media (prefers-reduced-motion: reduce) { .phone > .sheet.place, .phone > .sheet.place.is-closing, .phone > .dim.scrim.is-closing { animation: none; } }
  .home-ind { z-index: 45; }
  .place .sheet-handle { position: absolute; left: 147.5px; top: 17px; margin: 0; }
  .place-row { position: absolute; left: 19.03px; top: 54px; display: flex; align-items: center; gap: 15px; }
  .place-row .thumb { width: 71.786px; height: 50px; }
  .place-row div { width: 200px; height: 50px; display: flex; flex-direction: column; justify-content: center; gap: 10px; }
  .place-row h2 { font-size: 22px; line-height: 20px; }
  .place-row p { font-size: 14px; line-height: 12px; white-space: nowrap; }
  .place-map { position: absolute; left: 18.53px; top: 113.5px; width: 337px; height: 111px; }
  .meet { position: absolute; left: 19.03px; top: 234px; font-size: 14px; line-height: 12px; white-space: nowrap; }
  .bugs { position: absolute; left: 19.03px; top: 254px; width: 335px; padding: 0 20px; display: flex; gap: 20px; }
  .bug { width: 60px; height: 82px; display: flex; flex-direction: column; align-items: center; gap: 5px; }
  .bug img { width: 60px; height: 60px; }
  .bug span { font-size: 12px; line-height: 12px; white-space: nowrap; }
  /* Figma 2.2.x 큰 버튼: face 330x54 at (19.17, 345), shadow +5.42 / +9.5 */
  .place .cta { left: 19.17px; top: 345px; }
  .place .cta::before { left: 5.42px; top: 9.5px; }
</style>
</head><body>
<div class="phone" id="phone" data-mode="radar" style="--h:812px">

  <div class="panel"></div>

  <!-- ========== 내 근처 (radar) ========== -->
  <section class="radar" aria-label="내 근처">
    <div class="scope" aria-hidden="true">
      <div class="sweep"></div>
      <div class="pulse"></div><div class="pulse"></div>
      <div class="ring ring--300"></div><div class="ring ring--200"></div><div class="ring ring--100"></div>
    </div>
    <img class="abs" src="assets/home/radar-me-outer.png" alt="" style="left:177.35px;top:354.37px;width:20px;height:20px">
    <img class="abs" src="assets/home/radar-me-inner.png" alt="내 위치" style="left:182.35px;top:359.37px;width:10px;height:10px">
    <span class="ring-lbl" style="left:207.85px">100m</span>
    <span class="ring-lbl" style="left:254.03px">200m</span>
    <span class="ring-lbl" style="left:303.99px">300m</span>
    <div id="radarPins"></div>

    <!-- 내 근처 탐험 추천: shown only while a pin is selected (green) -->
    <div class="rec" id="rec" aria-live="polite">
      <p class="rec-h">내 근처 탐험 추천</p>
      <div class="rec-card rec-empty" id="recEmpty" data-dissolve>
        <span class="rec-face">
          <span class="slot"><img src="assets/home/icon-map-outline.png" alt=""></span>
          <span class="rec-txt"><b>어디로 탐험을 떠나볼까요?</b><span>지도에서 탐험지를 선택하면<br>만날 수 있는 친구들을 미리 볼 수 있어요.</span></span>
        </span>
      </div>
      <button class="rec-card" type="button" id="recCard" data-open-sheet data-dissolve hidden>
        <span class="rec-face">
          <img class="thumb" id="recThumb" src="assets/home/place-thumb-park.png" alt="">
          <span class="rec-body">
            <span class="rec-txt"><b id="recName">햇살 근린 공원</b><span id="recSub">걸어서 5분 · 지금 방아깨비가 많아요</span></span>
            <img class="chev" src="assets/common/arrow-alt-down.png" alt="">
          </span>
        </span>
      </button>
    </div>
  </section>

  <!-- ========== 내 들판 (field) ========== -->
  <section class="field" aria-label="내 들판" id="field"></section>

  <div class="greet"><h1>초고속 탐험가 선우,</h1><p>오늘은 어떤 친구를 만나 볼까요?</p></div>

  <!-- mode toggle -->
  <div class="modes" role="tablist" aria-label="보기 모드">
    <button class="mode on" type="button" role="tab" data-mode="radar" aria-selected="true"><img src="assets/home/icon-radar-filled.png" alt=""><span>내 근처</span></button>
    <button class="mode" type="button" role="tab" data-mode="field" aria-selected="false"><img src="assets/home/icon-map-outline.png" alt=""><span>내 들판</span></button>
  </div>

  <!-- top: status + nav -->
  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav"><img class="logo" src="assets/common/logo-mark.png" alt="PICO"><span class="nav-weather"><span>☀︎</span><span>맑음 · 오후 3시</span></span></div>
  </div>

  <!-- tab bar -->
  <nav class="tabbar" aria-label="메인 메뉴"><div class="tabbar-bg"></div>
    <div class="tabbar-row">
      <div class="tabbar-group"><a href="home.html" aria-label="홈" aria-current="page"><img src="assets/common/tab-home-filled.png" alt=""><span>홈</span></a><a href="dogam.html" aria-label="도감"><img src="assets/common/tab-tag-outline.png" alt=""><span>도감</span></a></div>
      <a class="tab-cam" href="capture-1.html" aria-label="촬영"><img src="assets/common/tab-camera.png" alt=""></a>
      <div class="tabbar-group"><a href="badge.html" aria-label="배지"><img src="assets/common/tab-bookmark.png" alt=""><span>배지</span></a><a href="my.html" aria-label="마이"><img src="assets/common/tab-user.png" alt=""><span>마이</span></a></div>
    </div></nav>

  <!-- ========== place bottom sheet ========== -->
  <div class="dim scrim" id="sheetDim" hidden></div>
  <div class="sheet place" id="sheet" role="dialog" aria-modal="true" aria-labelledby="placeName" hidden>
    <div class="sheet-handle"></div>
    <div class="place-row">
      <img class="thumb" id="sheetThumb" src="assets/home/place-thumb-park.png" alt="">
      <div><h2 id="placeName">햇살 근린 공원</h2><p id="placeSub">걸어서 5분 · 지금 방아깨비가 많아요</p></div>
    </div>
    <img class="place-map" id="placeMap" src="assets/home/place-map.png" alt="햇살 근린 공원 주변 지도">
    <p class="meet">여기서 지금 만날 수 있어요.</p>
    <div class="bugs" id="bugs"></div>
    <a class="cta cta--yellow" href="capture-1.html"><span class="cta-face">탐험 시작하기 <img src="assets/common/arrow-right.png" alt=""></span></a>
  </div>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script>
(function () {
  var phone = document.getElementById('phone');

  // nearby places = radar pins. x/y: bounding box of the rotated 34px square; a: angle (deg, clockwise from up)
  // from the radar centre, so each pin lights up when the sweep passes it.
  // Only 햇살 근린 공원 is designed in Figma; the other two reuse its map and use insect photos as thumbnails.
  // Figma 2.1.2 홈 ×3 + 2.2.1–2.2.3 홈 팝업: pin positions = "map" instance + 3.63 (rotated-square bounds)
  var ALL_BUGS = [['grasshopper', '방아깨비'], ['ladybug', '무당벌레'], ['butterfly', '호랑나비'], ['dragonfly', '고추잠자리']];
  var places = [
    { x: 94.63,  y: 455.63, a: 210.9, name: '햇살 근린 공원', sub: '걸어서 5분 · 지금 방아깨비가 많아요',
      thumb: 'assets/home/place-thumb-park.png', map: 'assets/home/place-map.png', bugs: ALL_BUGS },
    { x: 128.63, y: 257.63, a: 337.2, name: '물빛 개울 산책로', sub: '걸어서 6분 · 고추잠자리가 자주 보여요',
      thumb: 'assets/home/place-thumb-stream.png', map: 'assets/home/place-map-stream.png', bugs: [['dragonfly', '고추잠자리']] },
    { x: 268.63, y: 400.63, a: 119.8, name: '학교 뒤 텃밭', sub: '걸어서 7분 · 잎 위에 무당벌레가 있어요',
      thumb: 'assets/home/place-thumb-garden.png', map: 'assets/home/place-map-garden.png', bugs: ALL_BUGS }
  ];
  var pinsEl = document.getElementById('radarPins');
  pinsEl.innerHTML = places.map(function (p, i) {
    return '<button type="button" class="pin" data-pin="' + i + '" aria-pressed="false" style="left:' + p.x + 'px;top:' + p.y + 'px;--a:' + p.a +
      '" aria-label="' + p.name + '"><i></i><img src="assets/home/icon-location.png" alt=""></button>';
  }).join('');

  // selection: yellow = not selected, green = selected → 내 근처 탐험 추천 appears
  var selected = -1, recEmpty = document.getElementById('recEmpty'), recCard = document.getElementById('recCard');
  function setThumb(img, p) { img.src = p.thumb; }
  function select(i) {
    if (i === selected) return;
    selected = i;
    pinsEl.querySelectorAll('.pin').forEach(function (b) {
      var on = +b.dataset.pin === i;
      b.classList.toggle('on', on); b.setAttribute('aria-pressed', on ? 'true' : 'false');
    });
    // swap the card (empty ↔ place) and replay its 300ms dissolve
    var show = i < 0 ? recEmpty : recCard, hide = i < 0 ? recCard : recEmpty;
    hide.hidden = true; show.hidden = true; void show.offsetWidth; show.hidden = false;
    if (i < 0) return;
    var p = places[i];
    document.getElementById('recName').textContent = p.name;
    document.getElementById('recSub').textContent = p.sub;
    setThumb(document.getElementById('recThumb'), p);
    recCard.setAttribute('aria-label', p.name + ' 자세히 보기');
  }
  pinsEl.addEventListener('click', function (e) {
    var b = e.target.closest('.pin'); if (b) select(+b.dataset.pin);
  });
  // tapping empty radar space clears the selection
  document.querySelector('.radar').addEventListener('click', function (e) {
    if (!e.target.closest('.pin, .rec, button, a')) select(-1);
  });

  // field illustration: exported layers, Figma render bounds, in Figma z-order
  var F = 'assets/home/field/';
  var layers = [
    ['sun', 199.89, 217.64, 175.11, 225.17],
    ['hill-back', 0, 344.36, 375, 208.83],
    ['hill-front', 0, 450.11, 375, 277.96],
    ['pond-outer', 19.56, 609.91, 166.3, 56.04],
    ['bush-patch', 216.39, 494.99, 101.3, 34.13],
    ['pond-inner', 22.49, 623.75, 84.15, 28.35],
    ['pin:pink', 177.94, 569.48], ['pin:pink', 94.32, 470.51], ['pin:purple', 300.91, 591.68], ['pin:yellow', 277.39, 488.77],
    ['grass-a', 251.77, 464.31, 10.2, 17.24], ['grass-b', 126.29, 580.18, 10.2, 17.24], ['grass-b', 131.43, 394.93, 10.2, 17.24], ['grass-b', 213.35, 523.13, 10.2, 17.24],
    ['tuft-a', 330.05, 580.96, 27.41, 21.77], ['tuft-b', 339.79, 366.31, 27.41, 21.77], ['tuft-a', 112.99, 445.25, 27.41, 21.77],
    ['grass-b', 321.7, 442.91, 10.2, 17.24], ['grass-a', 19.13, 444.62, 10.2, 17.24],
    ['tree-tall', 45.11, 459.12, 42.55, 84.78], ['tree-mid', 24.56, 495.78, 42.55, 66.69],
    ['tree-a', 293.79, 381.45, 30.42, 47.67], ['tree-b', 265, 359.2, 25.67, 40.23], ['tree-c', 65.75, 354.45, 25.67, 39.84],
    ['path', 204.04, 542.39, 170.96, 184.9]
  ];
  document.getElementById('field').innerHTML = layers.map(function (l) {
    if (l[0].indexOf('pin:') === 0) {
      var c = l[0].slice(4);
      return '<button type="button" class="fpin" data-open-sheet style="left:' + l[1] + 'px;top:' + l[2] + 'px" aria-label="곤충 친구 보기"><img class="o" src="' + F + 'pin-' + c + '-outer.png" alt=""><img class="i" src="' + F + 'pin-' + c + '-inner.png" alt=""></button>';
    }
    return '<img class="abs" src="' + F + l[0] + '.png" alt="" style="left:' + l[1] + 'px;top:' + l[2] + 'px;width:' + l[3] + 'px;height:' + l[4] + 'px">';
  }).join('');

  // place sheet content follows the selected place (field pins open 햇살 근린 공원)
  function fillSheet(p) {
    document.getElementById('placeName').textContent = p.name;
    document.getElementById('placeSub').textContent = p.sub;
    var map = document.getElementById('placeMap');
    map.src = p.map; map.alt = p.name + ' 주변 지도';
    setThumb(document.getElementById('sheetThumb'), p);
    document.getElementById('bugs').innerHTML = p.bugs.map(function (b) {
      return '<div class="bug"><img src="assets/home/insect-' + b[0] + '.png" alt=""><span>' + b[1] + '</span></div>';
    }).join('');
  }
  fillSheet(places[0]);

  // mode toggle
  var modeBtns = document.querySelectorAll('.mode');
  function setMode(m) {
    phone.setAttribute('data-mode', m);
    modeBtns.forEach(function (b) {
      var on = b.getAttribute('data-mode') === m;
      b.classList.toggle('on', on); b.setAttribute('aria-selected', on ? 'true' : 'false');
    });
  }
  modeBtns.forEach(function (b) { b.addEventListener('click', function () { var m = b.getAttribute('data-mode'); window.picoSwap(function () { setMode(m); }); }); });

  // sheet
  var sheet = document.getElementById('sheet'), dim = document.getElementById('sheetDim');
  // bottom sheet slides up from below (300ms, Slow); the scrim dissolves with it
  var closeTimer;
  function openSheet() {
    clearTimeout(closeTimer);
    fillSheet(places[selected >= 0 && phone.getAttribute('data-mode') === 'radar' ? selected : 0]);
    sheet.classList.remove('is-closing'); dim.classList.remove('is-closing');
    sheet.hidden = false; dim.hidden = false;
  }
  function closeSheet() {
    if (sheet.hidden) return;
    sheet.classList.add('is-closing'); dim.classList.add('is-closing');
    closeTimer = setTimeout(function () {
      sheet.hidden = true; dim.hidden = true;
      sheet.classList.remove('is-closing'); dim.classList.remove('is-closing');
    }, 300);
  }
  document.addEventListener('click', function (e) { if (e.target.closest('[data-open-sheet]')) openSheet(); });
  dim.addEventListener('click', closeSheet);
  document.addEventListener('keydown', function (e) { if (e.key === 'Escape') closeSheet(); });

  var st = document.documentElement.dataset.state;
  if (st === 'field') setMode('field');
  if (st === 'picked') select(0);
  if (st === 'sheet') { setMode('field'); openSheet(); }
})();
</script>
</body></html>
