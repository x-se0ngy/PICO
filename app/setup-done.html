<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/app/manifest.json">
<meta name="theme-color" content="#fdf4b1">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PICO">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>PICO · 설정 완료</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* 1.2.4 완료 · 탐험가 카드 발급: 1~3단계에서 고른 것(이름 · 탐험 · 아이콘)을 카드 한 장에 모아요 */
  .hi { position: absolute; left: 0; right: 0; top: 128px; text-align: center; }
  .hi h1 { margin: 0; font-weight: 700; font-size: 24px; line-height: 1.35; }
  .hi p { font-size: 14px; margin-top: 6px; }
  .idcard { position: absolute; left: 38px; top: 262px; width: 300px; height: 360px; transform: rotate(-3deg); animation: card-in .6s cubic-bezier(.25, .6, .07, 1) both; }
  .idcard::before { content: ''; position: absolute; left: 8px; top: 10px; width: 100%; height: 100%; background: var(--ink); }
  .idcard .face { position: absolute; inset: 0; background: var(--brand); border: 1px dashed var(--ink); padding: 22px; }
  .idcard .row { display: flex; justify-content: space-between; font-size: 12px; font-weight: 700; }
  .idcard .who { margin-top: 16px; display: flex; gap: 16px; align-items: center; }
  .idcard .who img { width: 96px; height: 96px; flex: none; }
  .idcard .nm { font-weight: 700; font-size: 24px; line-height: 1.25; word-break: keep-all; }
  .idcard .kind { font-size: 13px; margin-top: 6px; }
  .idcard .box { margin-top: 18px; background: var(--surface); border: 1px solid var(--ink); padding: 12px 14px; }
  .idcard .box b { font-size: 12px; }
  .idcard .chips { display: flex; flex-wrap: wrap; gap: 6px; margin-top: 8px; }
  .idcard .chips span { font-size: 13px; padding: 3px 10px; background: var(--brand-soft); border: 1px solid var(--ink); }
  .idcard .mission { word-break: keep-all; font-family: var(--font-hand); font-size: 15px; margin-top: 12px; line-height: 1.5; }
  .stamp { position: absolute; right: 16px; bottom: 14px; width: 70px; height: 70px; border-radius: 50%; border: 2px solid #c9531f; color: #c9531f;
    display: flex; align-items: center; justify-content: center; text-align: center; font-weight: 700; font-size: 13px; line-height: 1.1;
    background: rgba(255, 251, 224, .6); transform: rotate(12deg); animation: stamp .35s .55s cubic-bezier(.3, 1.6, .5, 1) both; }
  @keyframes card-in { from { opacity: 0; transform: translateY(30px) rotate(-8deg); } }
  @keyframes stamp { from { opacity: 0; transform: rotate(12deg) scale(1.8); } }
  @media (prefers-reduced-motion: reduce) { .idcard, .stamp { animation: none; } }
</style>
</head><body>
<!-- 1.2.4 완료: 탐험가 카드 발급 (Figma 프레임은 비어 있어서 제안 시안 A로 채움) -->
<div class="phone" style="--h:812px">
  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav nav--center"><img class="logo" src="assets/common/logo-mark.png" alt="PICO"></div>
  </div>

  <div class="hi"><h1><span id="short">선우</span>의 탐험가 카드가<br>만들어졌어요!</h1><p>고른 탐험에 맞춰 PICO 친구가 정해졌어요.</p></div>

  <section class="idcard" aria-label="내 탐험가 카드"><div class="face">
    <div class="row"><span>PICO 탐험가 카드</span><span>No.0001</span></div>
    <div class="who"><img id="av" src="assets/profile/flower.svg" alt="">
      <div><div class="nm" id="nm">초고속 탐험가 선우</div><div class="kind" id="kind">꽃밭 탐험가 · 2026.10.15</div></div></div>
    <div class="box"><b>좋아하는 탐험</b><div class="chips" id="chips"></div><p class="mission" id="mission"></p></div>
    <span class="stamp" aria-hidden="true">탐험<br>시작!</span>
  </div></section>

  <a class="cta" href="home.html" style="top:702px"><span class="cta-face">첫 탐험 떠나기 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></a>
  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script>
(function () {
  var MISSION = {
    '꽃밭 탐험': '꽃 위에 앉은 곤충을 한 마리 찾아보세요!', '풀숲 탐험': '풀잎 사이에서 폴짝 뛰는 곤충을 찾아보세요!',
    '물가 탐험': '물 위를 걷는 곤충을 찾아보세요!', '나무 탐험': '나무껍질에 붙은 곤충을 찾아보세요!',
    '비 온 뒤 탐험': '비 온 다음 날, 촉촉한 땅을 살펴보세요!', '해 질 녘 탐험': '보호자와 함께 저녁 빛을 따라가 보세요!'
  };
  var ICON = { '꽃밭 탐험': 'flower', '풀숲 탐험': 'grass', '물가 탐험': 'river', '나무 탐험': 'tree', '비 온 뒤 탐험': 'cloud', '해 질 녘 탐험': 'moon' };
  var name = '초고속 탐험가 선우', explore = ['꽃밭 탐험'];
  try {
    name = localStorage.getItem('pico.name') || name;
    var e = JSON.parse(localStorage.getItem('pico.explore') || 'null'); if (e && e.length) explore = e;
  } catch (err) {}
  var first = explore[0], d = new Date();
  var short = name.trim().split(/\s+/).pop();
  document.getElementById('short').textContent = short;
  document.getElementById('nm').textContent = name;
  document.getElementById('av').src = 'assets/profile/' + (ICON[first] || 'flower') + '.svg';
  document.getElementById('kind').textContent = first.replace(' 탐험', '') + ' 탐험가 · ' + d.getFullYear() + '.' + String(d.getMonth() + 1).padStart(2, '0') + '.' + String(d.getDate()).padStart(2, '0');
  document.getElementById('chips').innerHTML = explore.slice(0, 3).map(function (x) { return '<span>' + x + '</span>'; }).join('');
  document.getElementById('mission').textContent = '첫 미션 · ' + (MISSION[first] || MISSION['꽃밭 탐험']);
})();
</script>
</body></html>
