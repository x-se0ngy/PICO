<style>
  /* 1.2.4 완료 (Figma Warm-Up 3198:21422): 기울어진 빈 탐험가 카드(폴라로이드) + 흩뿌린 색종이, 두 줄 안내, 큰 버튼.
     카드는 아직 비어 있어요 — 첫 탐험에서 채워질 자리라서요. */
  .card-pop { position: absolute; left: 0; top: 0; width: 375px; height: 812px; pointer-events: none; animation: card-pop var(--dur) var(--ease) both; transform-origin: 193.2px 353.5px; }
  .card-pop > i { position: absolute; display: block; border: 1.347px solid var(--ink); box-sizing: border-box; transform: rotate(7.96deg); }
  .pc-shadow { left: 156.58px; top: 314.03px; width: 75.286px; height: 84.696px; background: var(--ink); }
  .pc-face { left: 155.54px; top: 311.13px; width: 75.286px; height: 84.696px; background: var(--lime); }
  .pc-win { left: 161.28px; top: 314.97px; width: 65.905px; height: 64.665px; background: var(--surface); }
  .cf { position: absolute; display: flex; align-items: center; justify-content: center; }
  .cf i { display: block; border: 1px solid var(--ink); flex: none; box-sizing: border-box; }
  .cf-dot { position: absolute; display: flex; align-items: center; justify-content: center; }
  .cf-dot i { display: block; width: 12.294px; height: 12.294px; border: 1px solid var(--ink); border-radius: 50%; box-sizing: border-box; }
  .done-title { position: absolute; left: 185.17px; top: 422.09px; transform: translateX(-50%); margin: 0; text-align: center; white-space: pre; font-size: 22px; line-height: 35px; }
  @keyframes card-pop { from { opacity: 0; transform: scale(.7) rotate(-6deg); } }
  @media (prefers-reduced-motion: reduce) { .card-pop, .cf, .cf-dot { animation: none; } }
  /* 색종이 팡: 천장 가운데에서 팡 터져 떨어지며 사라져요 (들어올 때 · 누를 때 · 버튼). 그려 둔 8장은 모양 견본이라 숨겨 둬요 */
  .phone > .cf, .phone > .cf-dot { visibility: hidden; }
  .pop-layer { position: absolute; inset: 0; z-index: 30; pointer-events: none; overflow: hidden; }
  .phone { cursor: pointer; -webkit-tap-highlight-color: transparent; }
</style>
</head><body>
<!-- 1.2.4 완료 -->
<div class="phone flat" style="--h:812px">
  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav nav--center"><img class="logo" src="assets/common/logo-mark.png" alt="PICO"></div>
  </div>

  <span class="cf" style="left:92.64px;top:243.4px;width:24.01px;height:21.52px" aria-hidden="true"><i style="width:9.755px;height:22.74px;background:#ffdc00;transform:rotate(-52.79deg)"></i></span>
  <span class="cf" style="left:272.23px;top:271.85px;width:22.317px;height:28.206px" aria-hidden="true"><i style="width:9.755px;height:27.053px;background:#7aff3c;transform:scaleY(-1) rotate(31.07deg)"></i></span>
  <span class="cf" style="left:68.38px;top:300.05px;width:26.883px;height:25.019px" aria-hidden="true"><i style="width:9.755px;height:27.053px;background:#7aff3c;transform:scaleY(-1) rotate(49.37deg)"></i></span>
  <span class="cf" style="left:281.2px;top:228.62px;width:16.865px;height:10.491px" aria-hidden="true"><i style="width:9.755px;height:16.439px;background:#2affec;transform:rotate(87.4deg)"></i></span>
  <span class="cf" style="left:27.42px;top:207.99px;width:24.476px;height:35.53px" aria-hidden="true"><i style="width:9.755px;height:34.89px;background:#2affec;transform:rotate(26.88deg)"></i></span>
  <span class="cf-dot" style="left:148.12px;top:267.85px;width:13.195px;height:13.195px" aria-hidden="true"><i style="background:#e180ff"></i></span>
  <span class="cf-dot" style="left:332.82px;top:195.74px;width:13.195px;height:13.195px" aria-hidden="true"><i style="background:#e180ff"></i></span>
  <span class="cf-dot" style="left:231.34px;top:231.67px;width:14.892px;height:14.892px" aria-hidden="true"><i style="background:#60c8ff"></i></span>

완성됐어요!</p>

  <a class="cta" href="home.html" style="top:708.07px"><span class="cta-face">첫 탐험하러 가기 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></a>
  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script>
(function () {
  var name = '초고속 탐험가 선우';
  try { name = localStorage.getItem('pico.name') || name; } catch (err) {}
  document.getElementById('short').textContent = name.trim().split(/\s+/).pop();

  // ---------- 색종이 팡 (천장에서) ----------
  // 천장 가운데에서 아래쪽 부채꼴로 팡 튀어 나가고, 무게 + 공기 저항으로 떨어지면서 사라져요.
  // 조각은 그려 둔 색종이(Figma 8장)와 같은 모양 · 같은 색. 그려 둔 8장은 모양 견본으로만 쓰고 화면엔 안 보여요.
  var phone = document.querySelector('.phone');
  var reduce = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
  var layer = document.createElement('div'); layer.className = 'pop-layer'; layer.setAttribute('aria-hidden', 'true'); phone.appendChild(layer);
  var shapes = [].slice.call(document.querySelectorAll('.cf, .cf-dot'));
  var bits = [], running = false, last = 0;
  function rnd(a, b) { return a + Math.random() * (b - a); }
  function pop(n) {
    if (reduce) return;
    for (var k = 0; k < n; k++) {
      var c = shapes[k % shapes.length].cloneNode(true), hw = (parseFloat(c.style.width) || 0) / 2, hh = (parseFloat(c.style.height) || 0) / 2;
      c.style.left = -hw + 'px'; c.style.top = -hh + 'px'; c.style.visibility = 'visible'; layer.appendChild(c);
      var ang = rnd(15, 165) * Math.PI / 180, sp = rnd(320, 620);
      bits.push({ el: c, x: 187.5 + rnd(-10, 10), y: 30 + rnd(-8, 8), vx: Math.cos(ang) * sp, vy: Math.sin(ang) * sp, r: rnd(0, 360), vr: rnd(-720, 720), t: 0, life: rnd(1.3, 1.8) });
    }
    if (!running) { running = true; last = 0; requestAnimationFrame(tick); }
  }
  function tick(now) {
    var dt = last ? Math.min(.04, (now - last) / 1000) : 0; last = now;
    bits = bits.filter(function (b) {
      b.t += dt; b.vy += 1100 * dt; b.vx *= (1 - 1.2 * dt); b.vy *= (1 - .6 * dt);
      b.x += b.vx * dt; b.y += b.vy * dt; b.r += b.vr * dt;
      b.el.style.transform = 'translate(' + b.x.toFixed(1) + 'px,' + b.y.toFixed(1) + 'px) rotate(' + b.r.toFixed(0) + 'deg)';
      b.el.style.opacity = Math.max(0, Math.min(1, (b.life - b.t) / .35));
      if (b.t >= b.life) { b.el.remove(); return false; }
      return true;
    });
    if (bits.length) requestAnimationFrame(tick); else running = false;
  }
  setTimeout(function () { pop(22); }, 250);   // 들어오면 한 번 팡
  phone.addEventListener('click', function (e) {
    var cta = e.target.closest && e.target.closest('.cta');
    if (cta) {
      if (reduce || e.metaKey || e.ctrlKey) return;
      e.preventDefault(); pop(22);
      setTimeout(function () { location.href = cta.getAttribute('href'); }, 700);
      return;
    }
    pop(22);
  });
})();
</script>
</body></html>
