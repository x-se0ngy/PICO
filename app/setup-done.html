<!doctype html>
<html lang="ko"><head>

<link rel="stylesheet" href="base.css">
<style>
  /* 1.2.4 완료 (Figma Warm-Up 3090:29362): 종이 위에 큰 프로필 + 흩뿌린 색종이, 한 줄 안내, 큰 버튼 */
  .pf-big { position: absolute; left: 120.2px; top: 249.35px; width: 130px; height: 130px; animation: pf-pop .5s cubic-bezier(.3, 1.5, .5, 1) both; }
  .cf { position: absolute; display: flex; align-items: center; justify-content: center; animation: pico-dissolve .6s .25s var(--ease-slow) both; }
  .cf i { display: block; border: 1px solid var(--ink); flex: none; }
  .cf-dot { position: absolute; width: 12.294px; height: 12.294px; border: 1px solid var(--ink); border-radius: 50%; animation: pico-dissolve .6s .35s var(--ease-slow) both; }
  .done-title { position: absolute; left: 196.92px; top: 418px; transform: translateX(-50%); margin: 0; text-align: center; white-space: pre; font-size: 22px; line-height: 35px; }
  @keyframes pf-pop { from { opacity: 0; transform: scale(.7); } }
  @media (prefers-reduced-motion: reduce) { .pf-big, .cf, .cf-dot { animation: none; } }
</style>
</head><body>
<!-- 1.2.4 완료 -->
<div class="phone" style="--h:812px">
  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav nav--center"><img class="logo" src="assets/common/logo-mark.png" alt="PICO"></div>
  </div>

  <img class="pf-big" id="av" src="assets/profile/grass.svg" alt="내 프로필">

  <span class="cf" style="left:100.14px;top:224.95px;width:20.527px;height:24.396px" aria-hidden="true"><i style="width:9.755px;height:22.74px;background:#d3c77c;transform:rotate(147.16deg)"></i></span>
  <span class="cf" style="left:245.1px;top:372.45px;width:26.027px;height:26.027px" aria-hidden="true"><i style="width:9.755px;height:27.053px;background:#b1d4a1;transform:rotate(-45deg)"></i></span>
  <span class="cf" style="left:58.02px;top:292.23px;width:23.55px;height:27.736px" aria-hidden="true"><i style="width:9.755px;height:27.053px;background:#9ebfc7;transform:rotate(35.15deg)"></i></span>
  <span class="cf" style="left:245.1px;top:224.95px;width:12.794px;height:18.035px" aria-hidden="true"><i style="width:9.755px;height:16.439px;background:#9ad1cc;transform:rotate(11.33deg)"></i></span>
  <span class="cf-dot" style="left:100.14px;top:367.06px;background:#c4aacc" aria-hidden="true"></span>
  <span class="cf-dot" style="left:290.42px;top:258.71px;background:#96b8ca" aria-hidden="true"></span>

  <p class="done-title"><span id="short">선우</span>의 탐험가 카드가 
완성됐어요!</p>

  <a class="cta" href="home.html" style="top:702px"><span class="cta-face">첫 탐험하러 가기 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></a>
  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script>
(function () {
  var ICON = { '꽃밭 탐험': 'flower', '풀숲 탐험': 'grass', '물가 탐험': 'river', '나무 탐험': 'tree', '비 온 뒤 탐험': 'cloud', '해 질 녘 탐험': 'moon' };
  var name = '초고속 탐험가 선우', explore = ['꽃밭 탐험'];
  try {
    name = localStorage.getItem('pico.name') || name;
    var e = JSON.parse(localStorage.getItem('pico.explore') || 'null'); if (e && e.length) explore = e;
  } catch (err) {}
  document.getElementById('short').textContent = name.trim().split(/\s+/).pop();
  document.getElementById('av').src = 'assets/profile/' + (ICON[explore[0]] || 'flower') + '.svg';
})();
</script>
</body></html>
