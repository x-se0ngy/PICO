<style>
  @media (min-width: 500px) { body { padding-bottom: 0; } }
  .abs { position: absolute; }
  .top[data-fixed] { height: 118px; background: var(--paper); }
  .nav .add { width: 45px; height: 45px; display: flex; align-items: center; justify-content: center; margin-right: -6px; }
  .nav .add img { width: 32px; height: 32px; transform: rotate(45deg); }

  /* 친구 탭 (Figma 3355:5792) — 위: 종이 두 장(쪽지 접기 + 현황) */
  .st-back { left: 20px; top: 125.8px; width: 335px; height: 169px; background: var(--lime); border: 1px solid var(--ink); transform: rotate(-2.59deg) skewX(-1.36deg); }
  .st { left: 20px; top: 125.8px; width: 335px; height: 169px; border: 1px solid var(--ink);
    background: url('assets/onboarding/ob-paper-full.jpg') -20px -130px / 375px 812px, var(--paper); background-blend-mode: multiply; }
  .ask-d { left: 40.5px; top: 150.6px; font-size: 11px; white-space: nowrap; }
  .ask { left: 40.5px; top: 167.8px; font-weight: 700; font-size: 15px; white-space: nowrap; }
  .fold-btn { left: 249.5px; top: 151.7px; width: 85px; height: 33px; }
  .fold-btn::before { content: ''; position: absolute; inset: -1.2px -1.8px -1.5px -1.7px; background: var(--lime); border: 1px solid var(--ink); transform: rotate(-1.8deg); }
  .fold-btn span { position: absolute; inset: 0 -1px; background: var(--lime); border: 1px solid var(--ink); display: flex; align-items: center; justify-content: center; gap: 2px; font-weight: 700; font-size: 12px; }
  .fold-btn img { width: 14px; height: 14px; }
  .rule { left: 32.5px; top: 203.1px; width: 310px; border-top: 1px dashed var(--ink); }
  .stats { left: 20px; top: 218.1px; width: 335px; display: flex; justify-content: center; align-items: center; gap: 25px; }
  .stat { display: flex; flex-direction: column; align-items: center; gap: 2px; white-space: nowrap; }
  .stat .n { display: flex; align-items: flex-end; gap: 1px; }
  .stat b { font: 700 34px/41px Inter, -apple-system, sans-serif; }
  .stat .u { font-size: 14px; line-height: 17px; padding-bottom: 4px; }
  .stat .l { font-size: 12px; }
  .stats i { width: 0; height: 48px; border-left: 1px dashed var(--ink); }

  /* 아래는 흐름대로 쌓아요 */
  .flow { left: 0; top: 317.4px; width: 375px; display: flex; flex-direction: column; }
  .sec-h { display: flex; justify-content: space-between; align-items: center; padding: 0 20px; font-size: 16px; }
  .sec-h img { width: 18px; height: 18px; transform: rotate(-90deg); }

  /* 친구 편지 줄: 닫힌 편지 = 아직 안 펼친 쪽지(이름 굵게) · 누르면 열린 편지 + 아래로 편지지
     맨 끝 점선 편지 = 친구 추가(점선 = 아직) */
  .envs { margin-top: 15px; display: flex; justify-content: space-between; align-items: flex-end; padding: 0 14px; }
  .fr { width: 66px; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 14px; line-height: 19px; white-space: nowrap; background: none; border: 0; padding: 0; color: inherit; font-family: inherit; cursor: pointer; }
  .fr .pic { height: 70px; display: flex; align-items: flex-end; justify-content: center; }
  .fr.new span { font-weight: 700; }
  .fr .c { width: 55px; height: 40px; display: block; margin-bottom: 8px; }
  .fr .o { width: 64px; height: 60px; display: block; overflow: visible; }
  .fr.add .c { width: 55px; }

  /* 펼친 쪽지: 고른 편지에서 나온 편지지 (위 현황 종이와 다르게 흰 노트 + 위로 꼭지) */
  .letter { position: relative; margin: 20px 20px 0; height: 162px; background: #fff; border: 1px solid var(--ink); transform: rotate(-.6deg); }
  .letter .tail { position: absolute; top: -8px; width: 14px; height: 14px; background: #fff; border-left: 1px solid var(--ink); border-top: 1px solid var(--ink); transform: translateX(-50%) rotate(45deg); transition: left var(--dur, .3s) var(--ease, ease); }
  .letter .lines { position: absolute; inset: 0; overflow: hidden;
    background: repeating-linear-gradient(to bottom, transparent 0 29.6px, var(--rule-cyan) 29.6px 30.6px, transparent 30.6px 34.4px) 0 0 / 100% 28px; }
  .letter .lines { background: none; }
  .letter .lines i { position: absolute; left: 0; right: 0; border-top: 1px solid var(--rule-cyan); }
  .letter .lines b { position: absolute; top: 0; bottom: 0; left: 21.4px; border-left: 1px solid var(--rule-pink); }
  .letter .from { position: absolute; left: 33px; top: 9px; display: flex; align-items: center; gap: 4px; font-size: 15px; }
  .letter .from svg { width: 14px; height: 15px; transform: rotate(-7deg); }
  .letter .ph { position: absolute; left: 31.6px; top: 35px; width: 102.5px; height: 102.8px; border: 1px solid var(--ink); overflow: hidden; }
  .ph img, .cmp .ph img, .ins .ph img { position: absolute; left: 50%; bottom: 0; height: 161%; width: auto; max-width: none; transform: translateX(-50%); }
  .letter .nm { position: absolute; left: 144.3px; top: 63px; font-weight: 700; font-size: 16px; }
  .letter .hd { position: absolute; left: 144.8px; top: 89px; font-family: var(--font-hand); font-size: 17px; line-height: 28px; }
  .letter.swap { animation: unfold .45s var(--ease, ease) both; }
  @keyframes unfold { from { opacity: 0; transform: translateY(-14px) rotate(-.6deg) scaleY(.6); } to { opacity: 1; transform: rotate(-.6deg); } }

  .tipx { margin-top: 30px; height: 129px; border-top: 1px dashed var(--ink); border-bottom: 1px dashed var(--ink); position: relative;
    background: url('assets/onboarding/ob-paper-bottom.jpg') 0 0 / 375px 390px, var(--paper); background-blend-mode: multiply; }
  .tipx-in { position: absolute; left: 21.8px; top: 15.6px; display: flex; flex-direction: column; gap: 5px; }
  .tipx .h { display: flex; gap: 2px; align-items: center; font-weight: 700; font-size: 16px; line-height: 1.3; }
  .tipx .h img { width: 32px; height: 32px; }
  .tipx ol { margin: 0; padding-left: 21px; font-size: 14px; line-height: 1.21; }

  /* 같은 곤충, 다른 관찰: 친구도 만난 곤충만 줄에 · 고르면 친구 쪽지 ↔ 내 관찰 */
  .same { margin-top: 25px; }
  .ins-row { margin-top: 14px; display: flex; gap: 14px; padding: 6px 20px 2px; overflow-x: auto; scrollbar-width: none; }
  .ins-row::-webkit-scrollbar { display: none; }
  .ins { flex: none; width: 54px; display: flex; flex-direction: column; align-items: center; gap: 6px; background: none; border: 0; padding: 0; font: inherit; color: inherit; cursor: pointer; }
  .ins .ph { position: relative; width: 54px; height: 54px; border: 1px solid var(--ink); overflow: hidden; background: #fff; }
  .ins.on .ph { box-shadow: none; }
  .ins .wrap, .ins .ph { display: block; }
  .ins .wrap { position: relative; width: 54px; height: 54px; }
  .ins.on .wrap::before { content: ''; position: absolute; inset: 0; background: var(--lime); border: 1px solid var(--ink); transform: rotate(-5deg); }
  .ins span { font-size: 11px; white-space: nowrap; }
  .ins.on span { font-weight: 700; }
  .cmp { margin: 16px 20px 0; display: flex; justify-content: space-between; }
  .cmp .card { position: relative; width: 160px; height: 196px; }
  .cmp .card::before { content: ''; position: absolute; inset: 0; background: var(--lime); border: 1px solid var(--ink); transform: rotate(-1.4deg); display: none; }
  .cmp .card.mine::before { display: block; }
  .cmp .paper { position: absolute; inset: 0; background: #fff; border: 1px solid var(--ink); overflow: hidden; }
  .cmp .card:first-child .paper { transform: rotate(-1.5deg); }
  .cmp .card.mine .paper { transform: rotate(1.2deg); }
  .cmp .paper i { position: absolute; left: 0; right: 0; border-top: 1px solid var(--rule-cyan); }
  .cmp .paper b { position: absolute; top: 0; bottom: 0; left: 21px; border-left: 1px solid var(--rule-pink); }
  .cmp .who { position: absolute; left: 30px; top: 8px; display: flex; gap: 4px; align-items: center; font-size: 12px; }
  .cmp .who svg { width: 13px; height: 14px; transform: rotate(-6deg); }
  .cmp .dt { position: absolute; right: 10px; top: 10px; font-size: 11px; }
  .cmp .ph { position: absolute; left: 30px; top: 38px; width: 64px; height: 64px; border: 1px solid var(--ink); overflow: hidden; transform: rotate(-3deg); }
  .cmp .hd { position: absolute; left: 30px; top: 110px; right: 8px; font-family: var(--font-hand); font-size: 15px; line-height: 28px; }
  .cmp .pl { position: absolute; left: 30px; top: 172px; font-size: 11px; display: flex; align-items: center; gap: 2px; }
  .cmp .pl img { width: 12px; height: 12px; }
</style>
</head><body>
<div class="phone flat" style="--h:1340px">

  <div class="top" data-fixed>
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>

    <!-- 같은 곤충, 다른 관찰 -->
    <div class="same">

    </div></nav>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script>
(function () {
  var PINK = '#f8addb', SKY = '#add2f8', LIME = '#c1f8ad', INK = '#211b17';
  var PENT = '<polygon points="5.28,0.5 23.1,7.7 24.88,22.94 8,26.81 0.5,12.37" stroke="' + INK + '" stroke-width="1.6" stroke-linejoin="round"/>';
  function mark(c) { return '<svg viewBox="0 0 25.38 27.31" aria-hidden="true"><g fill="' + c + '">' + PENT + '</g></svg>'; }
  // 친구마다 가장 최근 쪽지 한 장
  var FRIENDS = [
    { id: 'seongyu', name: '유선규', c: PINK, img: 'card-butterfly', bug: '배추흰나비', say: ['학교 화단에서 봤어!', '날개 끝이 까매'], date: '10월 31일' },
    { id: 'saon', name: '민사온', c: SKY, img: 'card-ladybug', bug: '칠성무당벌레', say: ['잎 뒤에 숨어 있었어', '점이 일곱 개!'], date: '10월 30일' },
    { id: 'haram', name: '정하람', c: LIME, img: 'card-grasshopper', bug: '방아깨비', say: ['풀숲에서 폴짝!', '다리가 엄청 길어'], date: '10월 29일' },
    { id: 'taeho', name: '민태호', c: SKY, img: 'card-dragonfly', bug: '고추잠자리', say: ['개울 위를 빙빙', '꼬리가 빨개'], date: '10월 27일' }
  ];
  var opened = { seongyu: true };
  try { var s = JSON.parse(localStorage.getItem('pico.friendsOpened') || 'null'); if (s) opened = s; } catch (e) {}
  var cur = 'seongyu';

  function closedEnv(c, dashed) {
    var d = dashed ? ' stroke-dasharray="7 5"' : '', f = dashed ? 'none' : c, b = dashed ? 'none' : '#fffce4';
    return '<svg class="c" viewBox="0 0 120 88" aria-hidden="true"><rect x="4" y="4" width="112" height="80" fill="' + b + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"' + d + '/>' +
      '<polyline points="4,84 60,46 116,84" fill="none" stroke="' + INK + '" stroke-width="2.2" stroke-linejoin="round"' + d + '/>' +
      '<polygon points="4,4 116,4 60,52" fill="' + f + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"' + d + '/>' +
      (dashed ? '<path d="M60 58v18M51 67h18" stroke="' + INK + '" stroke-width="2.4" stroke-linecap="round"/>' :
      '<g transform="translate(60,52) rotate(-8)"><polygon points="-8,-9 8,-9 11,3 0,11 -11,3" fill="' + c + '" stroke="' + INK + '" stroke-width="1.8" stroke-linejoin="round"/></g>') + '</svg>';
  }
  function openEnv(f) {
    var id = 'ec' + f.id;
    return '<svg class="o" viewBox="0 0 160 150" aria-hidden="true"><defs><clipPath id="' + id + '"><rect width="94" height="80"/></clipPath></defs>' +
      '<polygon points="8,62 152,62 80,8" fill="' + f.c + '" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/><rect x="8" y="62" width="144" height="80" fill="' + f.c + '" stroke="' + INK + '" stroke-width="2.4"/>' +
      '<g transform="translate(36,24) rotate(-9 47 40)"><g clip-path="url(#' + id + ')"><image href="assets/tabs/' + f.img + '.png" x="-20" y="-40" width="134" height="120" preserveAspectRatio="xMidYMax slice"/></g><rect width="94" height="80" fill="none" stroke="' + INK + '" stroke-width="2.2"/></g>' +
      '<polygon points="8,62 80,110 152,62 152,142 8,142" fill="#fffce4" stroke="' + INK + '" stroke-width="2.4" stroke-linejoin="round"/><line x1="8" y1="142" x2="68" y2="102" stroke="' + INK + '" stroke-width="2"/><line x1="152" y1="142" x2="92" y2="102" stroke="' + INK + '" stroke-width="2"/>' +
      '<g transform="translate(80,110) rotate(-8) scale(1.1)"><polygon points="-8,-9 8,-9 11,3 0,11 -11,3" fill="' + f.c + '" stroke="' + INK + '" stroke-width="1.8" stroke-linejoin="round"/></g></svg>';
  }
  var envs = document.getElementById('envs'), letter = document.getElementById('letter');
  function photo(img) { return '<img src="assets/tabs/' + img + '.png" alt="">'; }
  function render(anim) {
    envs.innerHTML = FRIENDS.map(function (f) {
      var isCur = f.id === cur, isNew = !opened[f.id];
      return '<button class="fr' + (isNew ? ' new' : '') + (isCur ? ' on' : '') + '" data-id="' + f.id + '" aria-pressed="' + isCur + '">' +
        '<span class="pic">' + (isCur ? openEnv(f) : closedEnv(f.c)) + '</span><span>' + f.name + '</span></button>';
    }).join('') + '<a class="fr add" href="badge.html?state=qr"><span class="pic">' + closedEnv(null, true) + '</span><span>친구 추가</span></a>';
    var f = FRIENDS.filter(function (x) { return x.id === cur; })[0];
    var lines = '<span class="lines">' + [30.6, 58.6, 86.6, 114.6, 142.6].map(function (t) { return '<i style="top:' + t + 'px"></i>'; }).join('') + '<b></b></span>';
    letter.innerHTML = '<span class="tail"></span>' + lines +
      '<p class="from">' + mark(f.c) + f.name + ' · ' + f.date + '</p><span class="ph">' + photo(f.img) + '</span>' +
      '<p class="nm">' + f.bug + '</p><p class="hd">' + f.say.join('<br>') + '</p>';
    var btn = envs.querySelector('.fr.on'), lb = letter.getBoundingClientRect(), bb = btn.getBoundingClientRect();
    var k = letter.offsetWidth / lb.width || 1;
    letter.querySelector('.tail').style.left = ((bb.left + bb.width / 2 - lb.left) * k) + 'px';
    if (anim) { letter.classList.remove('swap'); void letter.offsetWidth; letter.classList.add('swap'); }
  }
  envs.addEventListener('click', function (e) {
    var b = e.target.closest('button.fr'); if (!b || b.dataset.id === cur) return;
    cur = b.dataset.id; opened[cur] = true;
    try { localStorage.setItem('pico.friendsOpened', JSON.stringify(opened)); } catch (x) {}
    render(true);
  });

  // 같은 곤충, 다른 관찰 — 친구도 만난 곤충만
  var SAME = [
    { img: 'card-butterfly', bug: '배추흰나비', f: FRIENDS[0], fs: ['날개 끝이', '까매'], fp: '학교 화단', fd: '10.31', ms: ['두 마리가', '같이 날았어'], mp: '우리 집 앞', md: '10.28' },
    { img: 'card-ladybug', bug: '칠성무당벌레', f: FRIENDS[1], fs: ['점이', '일곱 개!'], fp: '놀이터 옆', fd: '10.30', ms: ['손등에', '올라왔어'], mp: '학교 화단', md: '10.21' },
    { img: 'card-dragonfly', bug: '고추잠자리', f: FRIENDS[3], fs: ['꼬리가', '빨개'], fp: '개울가', fd: '10.27', ms: ['막대 끝에', '앉아 있었어'], mp: '공원', md: '10.19' },
    { img: 'card-grasshopper', bug: '방아깨비', f: FRIENDS[2], fs: ['다리가', '엄청 길어'], fp: '풀숲', fd: '10.29', ms: ['초록색이라', '안 보였어'], mp: '할머니 댁', md: '10.12' },
    { img: 'card-waterstrider', bug: '소금쟁이', f: FRIENDS[0], fs: ['물 위를', '걸어 다녀'], fp: '연못', fd: '10.18', ms: ['다리 여섯 개', '세어 봤어'], mp: '연못', md: '10.18' }
  ];
  var si = 0, ins = document.getElementById('ins'), cmp = document.getElementById('cmp');
  var RULES = [38, 66, 94, 122, 150, 178].map(function (t) { return '<i style="top:' + t + 'px"></i>'; }).join('') + '<b></b>';
  function card(mine, who, c, s, p, d, img) {
    return '<div class="card' + (mine ? ' mine' : '') + '"><div class="paper">' + RULES +
      '<p class="who">' + mark(c) + who + '</p><p class="dt">' + d + '</p><span class="ph">' + photo(img) + '</span>' +
      '<p class="hd">' + s.join('<br>') + '</p><p class="pl"><img src="assets/icons/outline/location.svg" alt="">' + p + '</p></div></div>';
  }
  function renderSame() {
    ins.innerHTML = SAME.map(function (x, i) {
      return '<button class="ins' + (i === si ? ' on' : '') + '" data-i="' + i + '" aria-pressed="' + (i === si) + '"><span class="wrap"><span class="ph">' + photo(x.img) + '</span></span><span>' + x.bug + '</span></button>';
    }).join('');
    var x = SAME[si];
    cmp.innerHTML = card(false, x.f.name, x.f.c, x.fs, x.fp, x.fd, x.img) + card(true, '나', LIME, x.ms, x.mp, x.md, x.img);
  }
  ins.addEventListener('click', function (e) { var b = e.target.closest('.ins'); if (!b) return; si = +b.dataset.i; renderSame(); });

  function boot() { render(false); renderSame(); }
  if (document.readyState === 'loading') document.addEventListener('DOMContentLoaded', function () { setTimeout(boot, 0); }); else boot();
  window.addEventListener('resize', function () { render(false); });
})();
</script>
</body></html>
