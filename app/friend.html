<script>
(function () {
  // ?friend=jihyuk (기본) | saon | seongyu | haram — 마이 › 함께하는 친구들에서 넘어와요.
  // Figma 6.2.1: 민지혁 2847:3350 · 민사온 2884:5709 · 유선규 2884:5591 · 정하람 2884:5777
  var F = {
    jihyuk: { pf: 'grass', name: '민지혁', title: '새싹 탐험가', days: 25, status: '요즘 잠자리를 찾아다니는 중!', short: '지혁', josa: '이가',
      recent: [['longhorn', '하늘소'], ['firefly', '반딧불이'], ['molecricket', '땅강아지', 106]], count: 8,
      thumbs: [['longhorn', '하늘소'], ['rhino', '장수풍뎅이'], ['firefly', '반딧불이']], more: 5 },
    saon: { pf: 'flower', name: '민사온', title: '꽃밭 탐험가', days: 32, status: '알록달록한 나비를 찾아다니는 중!', short: '사온', josa: '이가',
      recent: [['swallowtail', '호랑나비'], ['firefly', '반딧불이'], ['comma', '네발나비', 106]], count: 15,
      thumbs: [['swallowtail', '호랑나비'], ['honeybee', '꿀벌'], ['comma', '네발나비']], more: 12 },
    seongyu: { pf: 'river', name: '유선규', title: '물가 탐험가', days: 18, status: '물가에 사는 곤충들을 관찰하는 중!', short: '선규', josa: '가',
      recent: [['greenfly', '점박이초록파리'], ['waterstrider', '소금쟁이'], ['divingbeetle', '물방개', 106]], count: 6,
      thumbs: [['goldfly', '연두금파리'], ['redbug', '여수별노린재'], ['divingbeetle', '물방개']], more: 3 },
    haram: { pf: 'moon', name: '정하람', title: '밤의 탐험가', days: 13, status: '어제 소금쟁이를 그렸어!', short: '하람', josa: '이가',
      recent: [['cricket', '귀뚜라미'], ['bellcricket', '방울벌레'], ['firefly', '반딧불이']], count: 4,
      thumbs: [['goldfly', '연두금파리'], ['redbug', '여수별노린재'], ['divingbeetle', '물방개']], more: 1 }
  };
  var ALIAS = { minji: 'jihyuk', yoo: 'seongyu', sunkyu: 'seongyu' };
  var k = new URLSearchParams(location.search).get('friend') || 'jihyuk';
  var f = F[ALIAS[k] || k] || F.jihyuk;
  function $(id) { return document.getElementById(id); }
  $('fAvatar').src = 'assets/profile/' + f.pf + '.svg';
  $('fName').textContent = f.name; $('fTitle').textContent = f.title;
  $('fDays').textContent = '친구가 된 지 ' + f.days + '일째';
  $('fStatus').textContent = f.status;
  $('fRecentH').innerHTML = '<b>' + f.short + '</b>' + f.josa + ' 최근에 만난 곤충';
  $('fRecent').innerHTML = f.recent.map(function (r) {
    return '<a href="dogam-detail.html"><img src="assets/tabs/fr-' + r[0] + '.png" alt=""' + (r[2] ? ' style="width:' + r[2] + 'px"' : '') +
      '><span class="band"></span>' + PicoGrade.tag(r[1]) + '<span class="nm">' + r[1] + '</span></a>';
  }).join('');
  $('fCount').textContent = f.count + '종';
  $('fThumbs').innerHTML = f.thumbs.map(function (t) {
    return '<a href="dogam-detail.html"><img src="assets/tabs/fr-sm-' + t[0] + '.png" alt=""><span>' + t[1] + '</span></a>';
  }).join('') + '<button class="more" type="button">+ ' + f.more + '</button>';
  document.title = 'PICO · ' + f.name;
})();
