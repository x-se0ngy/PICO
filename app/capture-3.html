<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/app/manifest.json">
<meta name="theme-color" content="#fffad3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PICO">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>PICO · 촬영 3 특징 고르기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .step-title .sub { white-space: nowrap; }
  /* Figma 3.1.3 촬영 3~6 */
  .photo { position: absolute; left: 20px; top: 208.5px; width: 335px; height: 335px; background: transparent; border: 1px solid var(--ink); overflow: hidden; }
  .photo.has-photo { background-position: center; background-size: cover; background-repeat: no-repeat; }
  .photo .lens { z-index: 2; }
  /* Figma 3.1.3.x: 종류 · 안내 (y 559.5, 왼쪽 20px부터), 선택지 = 버튼 3 (2836:711) 162×46 두 줄 (x 22.89 / 190.11, y 590.38 / 640.88) */
  .say { position: absolute; left: 0; top: 559.5px; width: 375px; padding: 0 20px; display: flex; gap: 8px; align-items: center; font-size: 14px; line-height: normal; white-space: nowrap; }
  .say .dot { width: 12px; font-size: 16px; text-align: center; }
  .options { position: absolute; left: 22.89px; top: 590.38px; width: 329.22px; display: grid; grid-template-columns: 162px 162px; column-gap: 5.22px; row-gap: 4.5px; }
  .opt { height: 46px; display: flex; align-items: center; justify-content: center; background: #fffad7; border: 1px solid var(--ink); font-size: 16px; white-space: nowrap;
    transition: background-color .3s cubic-bezier(.25, .6, .07, 1); }
  .opt[aria-pressed="true"] { background: var(--brand); }
  .options.ready .opt { animation: opt-in .3s cubic-bezier(.25, .6, .07, 1) both; }
  .options.ready .opt:nth-child(2) { animation-delay: .05s; } .options.ready .opt:nth-child(3) { animation-delay: .1s; } .options.ready .opt:nth-child(4) { animation-delay: .15s; }
  @keyframes opt-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .options.ready .opt { animation: none; } }
</style>
</head><body>
<div class="phone" style="--h:812px">

  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav">
      <a href="capture-2.html" aria-label="뒤로"><img class="icon" src="assets/icons/outline/arrow-left.svg" alt=""></a>
      <a href="home.html" aria-label="닫기" data-confirm="관찰을 중단할까요?"><img class="icon" src="assets/icons/outline/close.svg" alt=""></a>
    </div>
  </div>

  <div class="progress" aria-label="5단계 중 3단계"><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span></div>

  <div class="step-title cap">
    <p class="q"><span id="qNo">03-1.</span><span>자세히 보니 어땠나요?</span></p>
    <p class="sub">내가 표시한 곳마다 하나씩 골라보세요. 정답은 없어요.</p>
  </div>

  <div class="photo" data-photo aria-label="촬영한 사진"><div class="lens-layer" id="layer"></div></div>

  <p class="say" aria-live="polite"><span id="kindName">생김새</span><span class="dot">·</span><span id="prompt">내가 관찰한 특징들을 표현해 봐요.</span></p>
  <div class="options" id="options" role="group" aria-label="특징 고르기"></div>

  <a class="cta step" id="next" href="capture-4.html" aria-disabled="true"><span class="cta-face">다음 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></a>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script src="photo.js"></script>
<script src="stickers.js"></script>
<script src="ai.js"></script>
<script>
(function () {
  // 2단계에서 붙인 스티커를 눌러 → 그 부분을 살펴본 표현 4개 중 하나를 골라요.
  // 들어오면 바로 보여 주고, AI가 스티커를 붙인 자리마다 표현 4개를 뒤에서 새로 만들어요(분석 화면 없음).
  // (같은 사진·같은 스티커로 다시 들어오면 저장해 둔 표현을 그대로 써요. AI를 못 쓰면 Figma 기본 표현.)
  var L = PicoLens, W = 333, H = 333, R = L.R;
  // 촬영 3에서 부르는 스티커 이름 (Figma 3.1.3.1~4: 생김새 · 사는 곳 · 움직임 · 관계)
  var NAMES = ['생김새', '사는 곳', '움직임', '관계'];
  var layer = document.getElementById('layer'), opts = document.getElementById('options');
  var promptEl = document.getElementById('prompt');
  var lenses = L.load();
  var answers = L.answers();
  var active = null, map = null;

  // 2단계를 거치지 않고 들어오면 Figma 3.1.3 프레임의 스티커 4개 위치로 보여 줘요 (칸 안 중심 좌표)
  var DEMO = [{ k: 0, x: 117, y: 135 }, { k: 1, x: 76, y: 74 }, { k: 2, x: 259, y: 177 }, { k: 3, x: 233, y: 94 }];

  function byKind() { return lenses.slice().sort(function (a, b) { return a.k - b.k; }); }
  function pos(s) { var p = map.toBox(s.u, s.v); return { x: L.clamp(p.x, R, W - R + 1), y: L.clamp(p.y, R, H - R + 1) }; }

  // 지금 고르는 스티커 = 올리브 띠, 나머지 = 크림 띠 (Figma 3.1.3.2 ~ 3.1.3.4)
  function renderLenses() {
    layer.innerHTML = byKind().map(function (s) {
      var p = pos(s);
      return L.html(s.k, p.x, p.y, { on: s.k === active,
        attrs: ' aria-pressed="' + (s.k === active) + '" aria-label="' + (s.k + 1) + '. ' + L.KINDS[s.k] + (answers[s.k] != null ? ' · 골랐어요' : '') + '"' });
    }).join('');
  }
  function renderOptions(state) {
    opts.className = 'options' + (state ? ' ' + state : '');
    opts.innerHTML = L.OPTIONS[active].map(function (o, i) {
      return '<button type="button" class="opt" data-i="' + i + '" aria-pressed="' + (answers[active] === i) + '">' + o + '</button>';
    }).join('');
  }
  function activate(k) {
    var changed = active !== null && active !== k;
    active = k;
    // 제목 번호 = 지금 고르는 스티커가 몇 번째인지 (03-1, 03-2 …)
    var order = byKind().map(function (s) { return s.k; }).indexOf(k) + 1;
    document.getElementById('qNo').textContent = '03-' + (order || 1) + '.';
    document.getElementById('kindName').textContent = NAMES[k];
    promptEl.textContent = L.PROMPTS[k];
    renderLenses();
    renderOptions(changed ? 'ready' : '');
  }

  layer.addEventListener('click', function (e) { var b = e.target.closest('.lens'); if (b) activate(+b.dataset.k); });
  opts.addEventListener('click', function (e) {
    var b = e.target.closest('.opt'); if (!b) return;
    var i = +b.dataset.i;
    if (answers[active] === i) delete answers[active]; else answers[active] = i;
    L.saveAnswers(answers);
    opts.querySelectorAll('.opt').forEach(function (o) { o.setAttribute('aria-pressed', answers[active] === +o.dataset.i); });
    renderLenses(); syncNext();
    if (answers[active] == null) return;
    // move on to the next sticker without an answer
    var next = byKind().filter(function (s) { return answers[s.k] == null; })[0];
    if (next) setTimeout(function () { activate(next.k); }, 350);
  });

  // grey CTA until at least one sticker question is answered
  function syncNext() { document.getElementById('next').setAttribute('aria-disabled', Object.keys(answers).length ? 'false' : 'true'); }
  syncNext();

  function ss(k, v) { try { if (v === undefined) return sessionStorage.getItem(k); sessionStorage.setItem(k, v); } catch (e) { return null; } }
  function start() {
    var first = byKind().filter(function (s) { return answers[s.k] == null; })[0] || byKind()[0];
    active = null; activate(first.k);
  }
  L.photoSize(function (iw, ih) {
    map = L.cover(W, H, iw, ih);
    if (!lenses.length) lenses = DEMO.map(function (d) { var q = map.toImg(d.x, d.y); return { k: d.k, u: q.u, v: q.v }; });
    start();
    var photo = window.PicoPhoto && PicoPhoto.get();
    var spotKey = JSON.stringify(byKind().map(function (s) { return [s.k, +s.u.toFixed(3), +s.v.toFixed(3)]; }));
    if (!photo || ss('pico.capture.optionsFor') === spotKey) return;
    // 화면은 바로 보여 주고, AI가 만든 표현은 뒤에서 받아 와요 (분석 화면 없음).
    // 아직 아무것도 고르지 않았을 때만 부드럽게 바꿔 끼워요. 이미 고르기 시작했으면 말이 바뀌지 않게 그대로 둬요.
    PicoAI.stickers(photo, byKind(), PicoAI.current().name).then(function (r) {
      if (!r || r.demo || Object.keys(answers).length) return;
      var changed = false;
      Object.keys(r.options).forEach(function (k) {
        var o = r.options[k]; if (!Array.isArray(o) || o.length !== 4) return;
        L.OPTIONS[+k] = o; changed = true;
      });
      if (!changed) return;
      var saved = {}; for (var k = 0; k < 4; k++) saved[k] = L.OPTIONS[k];
      ss('pico.capture.options', JSON.stringify(saved));
      ss('pico.capture.optionsFor', spotKey);
      renderOptions('ready');
    });
  });
})();
</script>
</body></html>
