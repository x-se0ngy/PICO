<title>PICO · 촬영 2 자세히 보기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* 질문 헤더: 질문 하나가 화면 제목이에요 (이름표 · 몇 번째 점 / 질문 / 한 줄 안내) */
  .hd { position: absolute; left: 20px; top: 154px; width: 335px; }
  .hd-row { height: 22px; display: flex; align-items: center; justify-content: space-between; }
  .kind { height: 22px; padding: 0 9px; display: flex; align-items: center; background: var(--surface); border: 1px solid var(--ink); font-size: 12px; font-weight: 700; line-height: 1; white-space: nowrap; }
  .dots { display: flex; gap: 6px; align-items: center; padding-right: 2px; }
  .dots i { width: 10px; height: 10px; border-radius: 50%; border: 1px solid var(--ink); background: var(--bg); transition: background-color var(--dur) var(--ease), transform var(--dur) var(--ease); }
  .dots i.done { background: var(--ink); }
  .dots i.on { background: var(--brand); transform: scale(1.3); }
  .dots .gap { width: 6px; border: 0; background: none; }
  .hd h2 { margin: 10px 0 0; font-size: 22px; line-height: 30px; font-weight: 700; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hd .sub { margin: 3px 0 0; font-size: 14px; line-height: 20px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .hd.swap h2, .hd.swap .sub { animation: opt-in var(--dur) var(--ease) both; }
  /* 사진을 크게 보며 질문에 답해요: 사진 칸(335×250)은 그대로, 안쪽 .zoom만 확대해요 */
  .photo { position: absolute; left: 20px; top: 252px; width: 335px; height: 250px; background: transparent; border: 1px solid var(--ink); overflow: hidden; }
  .zoom { position: absolute; inset: 0; transform-origin: 0 0; cursor: zoom-in; touch-action: none; user-select: none; -webkit-user-select: none; outline: none; }
  .zoom.has-photo { background-position: center; background-size: cover; background-repeat: no-repeat; }
  .zoom.is-zoomed { cursor: grab; }
  .zoom.is-anim { transition: transform var(--dur) var(--ease); }
  .zoom:focus-visible { box-shadow: inset 0 0 0 3px var(--brand); }
  /* 움직임 질문: 사진 위에 길을 따라 그려요 */
  .trace { position: absolute; inset: 0; width: 100%; height: 100%; display: none; touch-action: none; cursor: crosshair; z-index: 1; }
  .trace.on { display: block; }
  /* 사진 아래 줄: 왼쪽 안내 · 오른쪽 도구 (사진을 가리지 않아요) */
  .bar { position: absolute; left: 20px; top: 508px; width: 335px; height: 30px; display: flex; align-items: center; justify-content: space-between; gap: 8px; }
  .hint { flex: 1; min-width: 0; font-size: 13px; line-height: 18px; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .tools { flex: none; display: flex; gap: 5px; }
  .tools button { height: 28px; padding: 0 11px; background: var(--surface); border: 1px solid var(--ink); font-size: 13px; line-height: 1; white-space: nowrap; }
  .bar[data-mode="move"] #zoomBtn, .bar:not([data-mode="move"]) #clear, .bar:not([data-mode="move"]) #other { display: none; }
  /* 색: 8색 + 사진에서 뽑기 */
  .options.colors { left: 20px; width: 335px; grid-template-columns: repeat(5, 1fr); column-gap: 4px; }
  .opt.sw { padding: 0 4px; gap: 5px; font-size: 14px; }
  .opt.sw i, .opt.pick i { flex: none; width: 15px; height: 15px; border-radius: 50%; border: 1px solid var(--ink); background: var(--c, transparent); }
  .opt.pick { grid-column: span 2; gap: 6px; font-size: 13px; }
  .opt.pick i { background: conic-gradient(#E0392B, #F4D03F, #4FA33A, #2F7BD8, #8A5A33, #E0392B); }
  .opt.pick.has i { background: var(--c); }
  .zoom.picking { cursor: crosshair; }
  .pick-ring { position: absolute; width: 22px; height: 22px; margin: -11px 0 0 -11px; border-radius: 50%; background: var(--c); border: 3px solid #fff; box-shadow: 0 0 0 1.5px #111, inset 0 0 0 1.5px #111; transform: scale(calc(1 / var(--z, 1))); pointer-events: none; }
  /* 보기에 없을 때 직접 쓰기 */
  .other { grid-column: 1 / -1; display: flex; gap: 5px; }
  .other input { flex: 1; min-width: 0; height: 46px; padding: 0 12px; background: var(--surface); border: 1px solid var(--ink); border-radius: 0; font: 16px var(--font); color: var(--ink); outline: none; }
  .other input:focus { box-shadow: inset 0 0 0 1px var(--ink); }
  .other button { flex: none; width: 56px; height: 46px; background: #fffad7; border: 1px solid var(--ink); font-size: 14px; }
  .other button.ok { background: var(--brand); font-weight: 700; }
  /* 보기 = 버튼 3 (2836:711) 162×46 두 줄 */
  .options { position: absolute; left: 22.89px; top: 548px; width: 329.22px; display: grid; grid-template-columns: 162px 162px; column-gap: 5.22px; row-gap: 4.5px; }
  .opt { height: 46px; display: flex; align-items: center; justify-content: center; background: #fffad7; border: 1px solid var(--ink); font-size: 16px; white-space: nowrap;
    transition: background-color var(--dur) var(--ease); }
  .opt[aria-pressed="true"] { background: var(--brand); }
  .options.ready .opt { animation: opt-in var(--dur) var(--ease) both; }
  .options.ready .opt:nth-child(2) { animation-delay: .05s; } .options.ready .opt:nth-child(3) { animation-delay: .1s; } .options.ready .opt:nth-child(4) { animation-delay: .15s; }
  @keyframes opt-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .options.ready .opt, .hd.swap h2, .hd.swap .sub { animation: none; } }
  .skip { position: absolute; left: 20px; width: 335px; top: 656px; height: 32px; display: none; align-items: center; justify-content: center; font-size: 13px; text-decoration: underline; text-underline-offset: 3px; color: var(--ink); opacity: .75; }
  .skip.show { display: flex; }
</style>
</head><body>
<div class="phone" style="--h:812px">

  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav">
      <a href="capture-1.html" aria-label="뒤로"><img class="icon" src="assets/icons/outline/arrow-left.svg" alt=""></a>
      <a href="home.html" aria-label="닫기" data-confirm="관찰을 중단할까요?"><img class="icon" src="assets/icons/outline/close.svg" alt=""></a>
    </div>
  </div>

  <div class="progress" aria-label="4단계 중 2단계"><span class="on"></span><span class="on"></span><span></span><span></span></div>

  <div class="hd" id="hd">
    <div class="hd-row"><span class="kind" id="kind"></span><span class="dots" id="dots" role="img"></span></div>
    <h2 id="prompt" aria-live="polite"></h2>
    <p class="sub" id="guide"></p>
  </div>

  <div class="photo" aria-label="촬영한 사진">
    <div class="zoom" id="zoom" data-photo role="button" tabindex="0" aria-pressed="false" aria-label="촬영한 사진. 누르면 크게 볼 수 있어요"></div>
    <canvas class="trace" id="trace" role="img" aria-label="곤충이 움직인 길을 손가락으로 그리는 곳"></canvas>

  <div class="bar" id="bar" data-mode="view">
    <span class="hint" id="hint">눌러서 크게 보기</span>
    <span class="tools" id="tools"><button type="button" id="zoomBtn">확대</button><button type="button" id="clear">지우기</button><button type="button" id="other">그 외</button></span>
  </div>

  <div class="options" id="options" role="group" aria-label="보기 고르기"></div>
  <button type="button" class="skip" id="skip">잘 모르겠어요 · 건너뛰기</button>

  <a class="cta step" id="next" href="capture-4.html" aria-disabled="true"><span class="cta-face">다음 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></a>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script src="photo.js"></script>
<script src="stickers.js"></script>
<script src="ai.js"></script>
<script>
(function () {
  // 사진을 자세히 보며 관찰 질문 4개에 답해요.  공통 관찰: 색 · 위치 / 맞춤 관찰: 움직임 · 특징
  //   색     : 8색에서 고르거나, 없으면 "사진에서 뽑기"로 사진을 눌러 색을 직접 뽑아요.
  //   위치   : AI가 만든 보기 3개 + "다른 곳이에요"(직접 쓰기)
  //   움직임 : 사진 위에 곤충이 움직인 길을 따라 그리면 속도 · 굴곡 · 끊김으로 보기 하나가 골라져요. 안 맞으면 "그 외"(직접 쓰기)
  //   특징   : AI가 만든 질문(예: 점이 몇 개 있나요?)과 보기 4개
  // 보기에 없는 답은 answers[k] = -1 이고 글은 custom[k]에 저장해요 (일기 단어에는 들어가고, 꼼꼼 관찰 계산에서는 빠져요).
  var L = PicoLens, N = 4, COLOR = 0, PLACE = 1, MOVE = 2;
  var zoom = document.getElementById('zoom'), hint = document.getElementById('hint'), box = zoom.parentNode;
  var dotsEl = document.getElementById('dots'), kindEl = document.getElementById('kind'), hd = document.getElementById('hd'), guideEl = document.getElementById('guide'),
      opts = document.getElementById('options'), bar = document.getElementById('bar'), skipBtn = document.getElementById('skip'), nextBtn = document.getElementById('next'),
      back = document.querySelector('.nav a[aria-label="뒤로"]');
  var promptEl = document.getElementById('prompt');
  var GUIDE = ['비슷한 색을 골라요. 없으면 사진에서 뽑아요.', '곤충이 있던 곳을 골라요. 정답은 없어요.', '사진 위에 손가락으로 길을 따라 그려요.', '사진을 크게 보고 골라요. 정답은 없어요.'];
  var cv = document.getElementById('trace'), cx = cv.getContext('2d');
  var answers = L.answers(), custom = L.custom(), active = -1, pickMode = false, ring = null;
  function save() { L.saveAnswers(answers); L.saveCustom(custom); }

  /* ---------- 사진 확대: 누르면 그 자리를 크게, 확대한 채로 끌면 옮겨 보고, 다시 누르면 돌아와요 ---------- */
  var Z = 2.6, scale = 1, tx = 0, ty = 0, drag = null;
  function clamp(v, lo, hi) { return Math.max(lo, Math.min(hi, v)); }
  function paint(anim) {
    zoom.classList.toggle('is-anim', !!anim);
    zoom.style.transform = scale === 1 ? '' : 'translate(' + tx + 'px,' + ty + 'px) scale(' + scale + ')';
    zoom.style.setProperty('--z', scale);
    zoom.classList.toggle('is-zoomed', scale > 1);
    zoom.setAttribute('aria-pressed', scale > 1);
    hintText();
  }
  function limit() { var w = box.clientWidth, h = box.clientHeight; tx = clamp(tx, w * (1 - scale), 0); ty = clamp(ty, h * (1 - scale), 0); }
  function toggle(px, py) {
    if (scale > 1) { scale = 1; tx = ty = 0; }
    else { scale = Z; tx = px * (1 - Z); ty = py * (1 - Z); limit(); }
    paint(true);
  }
  function localPoint(e) {   // 화면에 맞춰 줄여 보일 때도 칸 안 좌표로
    var r = box.getBoundingClientRect(), k = r.width / box.offsetWidth || 1;
    return { x: (e.clientX - r.left) / k - box.clientLeft, y: (e.clientY - r.top) / k - box.clientTop, k: k };
  }
  zoom.addEventListener('pointerdown', function (e) {
    drag = { x: e.clientX, y: e.clientY, tx: tx, ty: ty, moved: false };
    try { zoom.setPointerCapture(e.pointerId); } catch (err) {}
  });
  zoom.addEventListener('pointermove', function (e) {
    if (!drag) return;
    var dx = e.clientX - drag.x, dy = e.clientY - drag.y;
    if (!drag.moved && Math.hypot(dx, dy) < 6) return;
    drag.moved = true;
    if (scale === 1) return;
    var k = localPoint(e).k;
    tx = drag.tx + dx / k; ty = drag.ty + dy / k; limit(); paint(false);
  });
  function release(e) {
    if (!drag) return;
    var d = drag; drag = null;
    if (d.moved || e.type === 'pointercancel') return;
    var p = localPoint(e);
    if (pickMode) pickAt(p.x, p.y); else toggle(p.x, p.y);
  }
  zoom.addEventListener('pointerup', release);
  zoom.addEventListener('pointercancel', release);
  zoom.addEventListener('keydown', function (e) {
    if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); toggle(box.clientWidth / 2, box.clientHeight / 2); }
  });
  document.getElementById('zoomBtn').addEventListener('click', function () { toggle(box.clientWidth / 2, box.clientHeight / 2); });

  /* ---------- 색 뽑기: 사진을 눌러 그 자리의 색을 알아내요 ---------- */
  var pix = null, map = null;
  (function loadPix() {
    var im = new Image();
    im.onload = function () {
      try {
        var sc = Math.min(1, 640 / Math.max(im.naturalWidth, im.naturalHeight)), c = document.createElement('canvas');
        c.width = Math.max(1, Math.round(im.naturalWidth * sc)); c.height = Math.max(1, Math.round(im.naturalHeight * sc));
        var g = c.getContext('2d'); g.drawImage(im, 0, 0, c.width, c.height);
        pix = { w: c.width, h: c.height, d: g.getImageData(0, 0, c.width, c.height).data };
        map = L.cover(box.clientWidth || 333, box.clientHeight || 333, c.width, c.height);
      } catch (e) { pix = null; }
    };
    im.src = (window.PicoPhoto && PicoPhoto.get()) || (window.PicoPhoto ? PicoPhoto.FALLBACK : '');
  })();
  function hsl(r, g, b) {
    r /= 255; g /= 255; b /= 255;
    var mx = Math.max(r, g, b), mn = Math.min(r, g, b), l = (mx + mn) / 2, d = mx - mn, h = 0, s = 0;
    if (d) { s = d / (1 - Math.abs(2 * l - 1)); h = mx === r ? ((g - b) / d) % 6 : mx === g ? (b - r) / d + 2 : (r - g) / d + 4; h *= 60; if (h < 0) h += 360; }
    return { h: h, s: s, l: l };
  }
  // 뽑은 색 → 이름 · 가까운 8색 번호(없으면 -1) · 글
  function colorName(r, g, b) {
    var c = hsl(r, g, b), h = c.h, s = c.s, l = c.l, n, base = -1;
    if (l < 0.12) { n = '검정'; base = 6; }
    else if (s < 0.12) { if (l > 0.85) { n = '흰색'; base = 7; } else if (l < 0.3) { n = '검정'; base = 6; } else { n = '회색'; } }
    else if (l > 0.9) { n = '흰색'; base = 7; }
    else if (h < 25 || h >= 345) { if (l < 0.3 || (l < 0.4 && s < 0.5)) { n = '갈색'; base = 5; } else if (l > 0.72) { n = '분홍'; } else { n = '빨강'; base = 0; } }   // 어둡고 탁한 빨강·주황은 갈색
    else if (h < 45) { if (l < 0.3 || (l < 0.5 && s < 0.55)) { n = '갈색'; base = 5; } else { n = '주황'; base = 1; } }
    else if (h < 70) { if (l < 0.3 || (l < 0.4 && s < 0.5)) { n = '갈색'; base = 5; } else { n = '노랑'; base = 2; } }
    else if (h < 100) { n = '연두'; base = 3; }
    else if (h < 170) { n = '초록'; base = 3; }
    else if (h < 205) { n = '하늘'; base = 4; }
    else if (h < 260) { n = '파랑'; base = 4; }
    else if (h < 300) { n = '보라'; }
    else { n = l > 0.45 ? '분홍' : '보라'; }
    var exact = base > -1 && L.COLORS[base].n === n;
    var sent = exact ? L.COLORS[base].s : (n === '하늘' ? '하늘색이에요.' : n + (n === '연두' || n === '보라' || n === '분홍' || n === '회색' ? '색이에요.' : '이에요.'));
    return { name: n, base: base, sent: sent, exact: exact };
  }
  function pickAt(px, py) {
    if (!pix || !map) { hint.textContent = '사진을 불러오는 중이에요'; return; }
    var bx = (px - tx) / scale, by = (py - ty) / scale;               // 확대한 사진 위의 자리 → 원래 칸 안 좌표
    var uv = map.toImg(bx, by), u = clamp(uv.u, 0, 1), v = clamp(uv.v, 0, 1);
    var cxp = Math.min(pix.w - 1, Math.round(u * (pix.w - 1))), cyp = Math.min(pix.h - 1, Math.round(v * (pix.h - 1)));
    var R = 0, G = 0, B = 0, n = 0;
    for (var yy = -2; yy <= 2; yy++) for (var xx = -2; xx <= 2; xx++) {   // 5×5칸 평균으로 한 점의 잡티를 줄여요
      var X = clamp(cxp + xx, 0, pix.w - 1), Y = clamp(cyp + yy, 0, pix.h - 1), o = (Y * pix.w + X) * 4;
      R += pix.d[o]; G += pix.d[o + 1]; B += pix.d[o + 2]; n++;
    }
    R = Math.round(R / n); G = Math.round(G / n); B = Math.round(B / n);
    var hex = '#' + [R, G, B].map(function (x) { return ('0' + x.toString(16)).slice(-2); }).join('');
    var c = colorName(R, G, B);
    answers[COLOR] = c.base > -1 ? c.base : -1;
    custom[COLOR] = { t: c.sent, hex: hex, name: c.name, exact: c.exact };   // 8색과 같으면 그 칸을 눌린 것으로, 아니면 "사진에서 뽑기" 칸에 뽑은 색을 보여 줘요
    save();
    if (!ring) { ring = document.createElement('i'); ring.className = 'pick-ring'; zoom.appendChild(ring); }
    ring.style.left = bx + 'px'; ring.style.top = by + 'px'; ring.style.setProperty('--c', hex);
    renderDots(); renderOptions(''); syncNext(); hintText(c.name);
  }

  /* ---------- 움직임 따라 그리기 ---------- */
  var strokes = [], cur = null, moveMsg = '';
  function sizeCanvas() {
    var w = box.clientWidth, h = box.clientHeight, d = window.devicePixelRatio || 1;
    cv.width = Math.round(w * d); cv.height = Math.round(h * d); cx.setTransform(d, 0, 0, d, 0, 0); redraw();
  }
  function line(s, w, color) {
    var p = s.pts; if (!p.length) return;
    cx.beginPath(); cx.moveTo(p[0].x, p[0].y);
    for (var i = 1; i < p.length; i++) cx.lineTo(p[i].x, p[i].y);
    if (p.length === 1) cx.lineTo(p[0].x + .1, p[0].y);
    cx.lineWidth = w; cx.strokeStyle = color; cx.lineCap = cx.lineJoin = 'round'; cx.stroke();
  }
  function redraw() {
    cx.clearRect(0, 0, box.clientWidth, box.clientHeight);
    strokes.forEach(function (s) {
      line(s, 8, 'rgba(255,255,255,.95)'); line(s, 3, '#111');
      var a = s.pts[0]; cx.beginPath(); cx.arc(a.x, a.y, 6, 0, 7); cx.fillStyle = '#111'; cx.fill(); cx.lineWidth = 2; cx.strokeStyle = '#fff'; cx.stroke();   // 출발점
    });
  }
  // 선이 어떤 움직임인지: 끊겼으면 "멈췄다 움직임" > 많이 굽이쳤으면 "구불구불" > 아니면 속도로 "느림/빠름"
  function classify(ss) {
    var len = 0, ms = 0, pauses = 0, turn = 0, real = 0;
    ss.forEach(function (s) {
      var p = s.pts, sl = 0, i;
      for (i = 1; i < p.length; i++) {
        var d = Math.hypot(p[i].x - p[i - 1].x, p[i].y - p[i - 1].y), dt = p[i].t - p[i - 1].t;
        sl += d; if (dt > 350 && d < 8) pauses++;           // 손가락이 멈춰 있다 다시 움직임
      }
      if (sl > 14) real++;
      len += sl; ms += Math.max(0, p[p.length - 1].t - p[0].t);
      var last = null, prev = p[0];                          // 10px마다 방향이 얼마나 꺾였는지
      for (i = 1; i < p.length; i++) {
        if (Math.hypot(p[i].x - prev.x, p[i].y - prev.y) < 10) continue;
        var h = Math.atan2(p[i].y - prev.y, p[i].x - prev.x);
        if (last !== null) { var dh = Math.abs(h - last); if (dh > Math.PI) dh = 2 * Math.PI - dh; turn += dh; }
        last = h; prev = p[i];
      }
    });
    if (len < 30) return -1;                                  // 너무 짧아서 알 수 없어요
    if (real >= 3 || pauses >= 2) return 3;
    var a = ss[0].pts[0], z = ss[ss.length - 1].pts, b = z[z.length - 1];
    var chord = Math.max(1, Math.hypot(b.x - a.x, b.y - a.y));
    if (len > 90 && (turn > 4.2 || len / chord > 1.9)) return 2;
    var v = len / Math.max(0.05, ms / 1000);                  // 그린 속도 (px/초)
    return v < 250 ? 0 : 1;
  }
  function pickMove(i) {
    answers[MOVE] = i; delete custom[MOVE]; save();
    moveMsg = L.OPTIONS[MOVE][i];
    opts.querySelectorAll('.opt').forEach(function (o) { o.setAttribute('aria-pressed', i === +o.dataset.i); });
    renderDots(); syncNext(); hintText();
  }
  cv.addEventListener('pointerdown', function (e) {
    var p = localPoint(e);
    cur = { pts: [{ x: p.x, y: p.y, t: e.timeStamp }] }; strokes.push(cur);
    try { cv.setPointerCapture(e.pointerId); } catch (err) {}
    redraw();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!cur) return;
    var p = localPoint(e), q = cur.pts[cur.pts.length - 1];
    if (Math.hypot(p.x - q.x, p.y - q.y) < 1.5) return;
    cur.pts.push({ x: p.x, y: p.y, t: e.timeStamp }); redraw();
  });
  function endStroke() {
    if (!cur) return;
    cur = null;
    var r = classify(strokes);
    if (r < 0) { moveMsg = '조금 더 길게 그려 보세요'; hintText(); return; }
    pickMove(r);
  }
  cv.addEventListener('pointerup', endStroke);
  cv.addEventListener('pointercancel', endStroke);
  document.getElementById('clear').addEventListener('click', function () {
    strokes = []; cur = null; moveMsg = ''; redraw();
    delete answers[MOVE]; delete custom[MOVE]; save();
    opts.querySelectorAll('.opt').forEach(function (o) { o.setAttribute('aria-pressed', 'false'); });
    renderDots(); syncNext(); hintText();
  });
  document.getElementById('other').addEventListener('click', function () { showOther(MOVE); });
  window.addEventListener('resize', sizeCanvas);

  function hintText(extra) {
    if (active === MOVE) hint.textContent = moveMsg || '그려 보세요';
    else if (active === COLOR && pickMode) hint.textContent = extra ? extra + ' · 다시 눌러 바꿀 수 있어요' : '곤충을 눌러 색을 뽑아요';
    else hint.textContent = scale > 1 ? '끌어서 옮기기 · 다시 누르면 돌아와요' : '눌러서 크게 보기';
  }

  /* ---------- 질문 ---------- */
  function renderDots() {   // 질문 4개 중 몇 번째인지: 지금 = 초록(크게) · 답했어요 = 검정 (공통 | 맞춤 사이는 조금 띄워요)
    var h = '';
    for (var k = 0; k < N; k++) {
      if (k === 2) h += '<i class="gap"></i>';
      h += '<i class="' + (k === active ? 'on' : answers[k] != null ? 'done' : '') + '"></i>';
    }
    dotsEl.innerHTML = h;
    dotsEl.setAttribute('aria-label', N + '개 질문 중 ' + (active + 1) + '번째');
    kindEl.textContent = '02 · ' + (active < 2 ? '공통 관찰' : '맞춤 관찰');
  }
  function btn(cls, attrs, html) { return '<button type="button" class="opt ' + cls + '" ' + attrs + '>' + html + '</button>'; }
  function renderOptions(state) {
    var k = active, a = answers[k], c = custom[k], html = '';
    opts.className = 'options' + (k === COLOR ? ' colors' : '') + (state ? ' ' + state : '');
    if (k === COLOR) {
      L.COLORS.forEach(function (col, i) {
        html += btn('sw', 'data-i="' + i + '" aria-pressed="' + (a === i && !(c && !c.exact)) + '"', '<i style="--c:' + col.hex + '"></i>' + col.n);
      });
      var shown = c && !c.exact;   // 8색에 없는 색을 뽑았으면 이 칸에 그 색이 나와요
      html += btn('pick' + (shown ? ' has' : ''), 'data-act="pick" aria-pressed="' + (!!shown || pickMode) + '"' + (shown ? ' style="--c:' + c.hex + '"' : ''),
        '<i></i><span>' + (shown ? c.name : '사진에서 뽑기') + '</span>');
    } else {
      L.OPTIONS[k].forEach(function (o, i) { html += btn('', 'data-i="' + i + '" aria-pressed="' + (a === i) + '"', o); });
      if (k === PLACE) html += btn('', 'data-act="other" aria-pressed="' + (a === -1) + '"', (a === -1 && c && c.t) || L.OTHER[PLACE]);
    }
    opts.innerHTML = html;
  }
  // 보기에 없을 때 직접 쓰기
  function showOther(k) {
    var c = custom[k], def = L.OTHER[k];
    opts.className = 'options';
    opts.innerHTML = '<div class="other"><input type="text" maxlength="16" aria-label="직접 쓰기" placeholder="' + def.replace('.', '') + ' · 직접 써 보세요" value="' + (c && c.t && answers[k] === -1 ? c.t.replace(/"/g, '&quot;') : '') + '">' +
      '<button type="button" class="ok" data-act="ok">확인</button><button type="button" data-act="cancel">취소</button></div>';
    var inp = opts.querySelector('input'); inp.focus();
    inp.addEventListener('keydown', function (e) { if (e.key === 'Enter') { e.preventDefault(); opts.querySelector('.ok').click(); } });
  }
  function fit() {   // 질문이 길면 글씨를 조금 줄여서 한 줄에 넣어요
    promptEl.style.fontSize = '';
    var size = 22; while (promptEl.scrollWidth > promptEl.clientWidth && size > 17) { size -= 1; promptEl.style.fontSize = size + 'px'; }
  }
  function activate(k) {
    var changed = active !== -1 && active !== k;
    active = k; pickMode = false;
    cv.classList.toggle('on', k === MOVE);
    if (k === MOVE) { sizeCanvas(); moveMsg = answers[MOVE] != null && strokes.length ? L.OPTIONS[MOVE][answers[MOVE]] : (answers[MOVE] === -1 && custom[MOVE] ? custom[MOVE].t : ''); }
    if (changed || k === MOVE) { scale = 1; tx = ty = 0; paint(false); }
    promptEl.textContent = L.PROMPTS[k]; guideEl.textContent = GUIDE[k];
    hd.classList.remove('swap'); if (changed) { void hd.offsetWidth; hd.classList.add('swap'); }
    updateTools(); fit(); renderDots(); renderOptions(changed ? 'ready' : ''); hintText(); syncNext();
  }
  function updateTools() {
    bar.dataset.mode = active === MOVE ? 'move' : 'view';
    zoom.classList.toggle('picking', pickMode && active === COLOR);
  }
  function nextOpen() {   // 지금 다음 번호부터, 없으면 처음부터 아직 안 답한 질문
    for (var i = 1; i <= N; i++) { var k = (active + i) % N; if (answers[k] == null) return k; }
    return -1;
  }
  // 아래 버튼: 이 질문에 답해야 눌러져요. 마지막 질문이면 일기(03)로, 아니면 다음 질문으로 가요.
  function syncNext() {
    var ok = answers[active] != null, any = Object.keys(answers).length > 0;
    nextBtn.setAttribute('aria-disabled', ok ? 'false' : 'true');
    skipBtn.classList.toggle('show', !ok && (active < N - 1 || any));   // 마지막 질문인데 하나도 못 답했으면 건너뛰기는 숨겨요
  }
  function go(k) { activate(k); }
  nextBtn.addEventListener('click', function (e) {
    if (nextBtn.getAttribute('aria-disabled') === 'true') { e.preventDefault(); return; }
    if (active < N - 1) { e.preventDefault(); go(active + 1); }
  });
  skipBtn.addEventListener('click', function () { if (active < N - 1) go(active + 1); else nextBtn.setAttribute('aria-disabled', 'false'), nextBtn.click(); });
  back.addEventListener('click', function (e) { if (active > 0) { e.preventDefault(); go(active - 1); } });

  opts.addEventListener('click', function (e) {
    var b = e.target.closest('button'); if (!b) return;
    var act = b.dataset.act, k = active;
    if (act === 'pick') {                               // 사진에서 색 뽑기 켜고 끄기
      pickMode = !pickMode; updateTools(); renderOptions(''); hintText(); return;
    }
    if (act === 'other') { showOther(k); return; }
    if (act === 'cancel') { renderOptions(''); return; }
    if (act === 'ok') {                                 // 직접 쓴 글 저장
      var txt = (opts.querySelector('input').value || '').trim() || L.OTHER[k];
      answers[k] = -1; custom[k] = { t: txt }; save();
      if (k === MOVE) { moveMsg = txt; renderOptions(''); }
      else renderOptions('');
      renderDots(); syncNext(); hintText();
      return;
    }
    var i = +b.dataset.i; if (isNaN(i)) return;
    pickMode = false; updateTools();
    if (answers[k] === i) { delete answers[k]; delete custom[k]; } else { answers[k] = i; delete custom[k]; }
    save();
    if (k === MOVE) moveMsg = answers[MOVE] != null ? L.OPTIONS[MOVE][answers[MOVE]] : '';
    renderOptions(''); renderDots(); syncNext(); hintText();
  });

  var first = 0; for (var q = 0; q < N; q++) { if (answers[q] == null) { first = q; break; } }
  activate(first); paint(false);
})();
</script>
</body></html>
