<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICO · 촬영 3 특징 고르기</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .step-title .sub { white-space: nowrap; }
  /* Figma 3.1.3 촬영 3~6 */
  .photo { position: absolute; left: 20px; top: 232px; width: 335px; height: 200px; background: var(--surface); border: 1px solid var(--ink); overflow: hidden; }
  .photo.has-photo { background-position: center; background-size: cover; background-repeat: no-repeat; }
  .photo .lens { z-index: 2; }
  /* AI scan: a ring sweeps out from the sticker being looked at */
  .scan { position: absolute; width: 90px; height: 90px; margin: -45px 0 0 -45px; border-radius: 50%; border: 2px solid var(--brand); pointer-events: none; opacity: 0; z-index: 1; }
  .scan.on { animation: scan .9s ease-out infinite; }
  @keyframes scan { 0% { transform: scale(.3); opacity: .95; } 100% { transform: scale(1.2); opacity: 0; } }

  .kind { position: absolute; left: 20px; top: 446px; display: flex; gap: 5px; font-weight: 700; font-size: 16px; line-height: normal; white-space: nowrap; }
  .prompt { position: absolute; left: 20px; top: 470px; font-size: 16px; line-height: normal; white-space: nowrap; }
  .options { position: absolute; left: 20px; top: 499.48px; width: 335px; display: grid; grid-template-columns: 162px 162px; column-gap: 11px; row-gap: 10px; }
  .opt { height: 65px; display: flex; align-items: center; justify-content: center; background: #fffad7; border: 1px solid var(--ink); font-size: 16px; white-space: nowrap;
    transition: background-color .3s cubic-bezier(.25, .6, .07, 1); }
  .opt[aria-pressed="true"] { background: var(--brand); }
  .options.thinking .opt { color: transparent; pointer-events: none; background: linear-gradient(100deg, #fffad7 30%, #f3ecb6 50%, #fffad7 70%) 0 0 / 300% 100%; animation: shimmer 1s linear infinite; }
  @keyframes shimmer { from { background-position: 100% 0; } to { background-position: -50% 0; } }
  .options.ready .opt { animation: opt-in .3s cubic-bezier(.25, .6, .07, 1) both; }
  .options.ready .opt:nth-child(2) { animation-delay: .05s; } .options.ready .opt:nth-child(3) { animation-delay: .1s; } .options.ready .opt:nth-child(4) { animation-delay: .15s; }
  @keyframes opt-in { from { opacity: 0; transform: translateY(6px); } to { opacity: 1; transform: none; } }
  @media (prefers-reduced-motion: reduce) { .scan.on, .options.thinking .opt, .options.ready .opt { animation: none; } }
</style>
</head><body>
<div class="phone" style="--h:812px">

  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav">
      <a href="capture-2.html" aria-label="뒤로"><img class="icon" src="assets/capture/s2-icon-back.png" alt=""></a>
      <a href="home.html" aria-label="닫기"><img class="icon" src="assets/capture/s2-icon-close.png" alt=""></a>
    </div>
  </div>

  <div class="progress" aria-label="5단계 중 3단계"><span class="on"></span><span class="on"></span><span class="on"></span><span></span><span></span></div>

  <div class="step-title">
    <p class="q"><span>03.</span><span>자세히 보니 어땠나요?</span></p>
    <p class="sub">내가 표시한 곳마다 하나씩 골라보세요. 정답은 없어요.</p>
  </div>

  <div class="photo" data-photo aria-label="촬영한 사진"><div class="lens-layer" id="layer"></div><span class="scan" id="scan"></span></div>

  <p class="kind" id="kind"><span id="kindNo">01</span><span id="kindName">생김새</span></p>
  <p class="prompt" id="prompt" aria-live="polite">내가 관찰한 특징들을 표현 해봐요.</p>
  <div class="options" id="options" role="group" aria-label="특징 고르기"></div>

  <a class="cta step" id="next" href="capture-4.html" aria-disabled="true"><span class="cta-face">다음 <img src="assets/common/arrow-right.png" alt=""></span></a>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script src="photo.js"></script>
<script src="stickers.js"></script>
<script>
(function () {
  // 2단계에서 붙인 스티커를 눌러 → 그 부분을 살펴본 표현 4개 중 하나를 골라요.
  // (프로토타입: 표현은 스티커 종류별로 정해 둔 목록이고, 살펴보는 동안 AI 분석 화면을 보여 줘요.)
  var L = PicoLens, W = 333, H = 198, R = L.R;
  var layer = document.getElementById('layer'), opts = document.getElementById('options');
  var scan = document.getElementById('scan'), promptEl = document.getElementById('prompt');
  var lenses = L.load();
  var answers = L.answers();
  var seen = {}, active = null, map = null, thinkTimer;

  // 2단계를 거치지 않고 들어오면 Figma 프레임의 스티커 4개 위치로 보여 줘요 (칸 안 중심 좌표)
  var DEMO = [{ k: 0, x: 257, y: 152 }, { k: 1, x: 64, y: 142 }, { k: 2, x: 101, y: 82 }, { k: 3, x: 269, y: 58 }];

  function byKind() { return lenses.slice().sort(function (a, b) { return a.k - b.k; }); }
  function pos(s) { var p = map.toBox(s.u, s.v); return { x: L.clamp(p.x, R, W - R), y: L.clamp(p.y, R, H - R) }; }

  function renderLenses() {
    layer.innerHTML = byKind().map(function (s) {
      var p = pos(s);
      return L.html(s.k, p.x, p.y, { active: s.k === active, dashed: s.k !== active,
        attrs: ' aria-pressed="' + (s.k === active) + '" aria-label="' + (s.k + 1) + '. ' + L.KINDS[s.k] + (answers[s.k] != null ? ' · 골랐어요' : '') + '"' });
    }).join('');
    var a = lenses.filter(function (s) { return s.k === active; })[0];
    if (a) { var p = pos(a); scan.style.left = (p.x + 1) + 'px'; scan.style.top = (p.y + 1) + 'px'; }
  }
  function renderOptions(state) {
    opts.className = 'options' + (state ? ' ' + state : '');
    opts.innerHTML = L.OPTIONS[active].map(function (o, i) {
      return '<button type="button" class="opt" data-i="' + i + '" aria-pressed="' + (answers[active] === i) + '">' + o + '</button>';
    }).join('');
  }
  function activate(k) {
    active = k;
    document.getElementById('kindNo').textContent = '0' + (k + 1);
    document.getElementById('kindName').textContent = L.KINDS[k];
    renderLenses();
    clearTimeout(thinkTimer);
    if (seen[k]) { scan.classList.remove('on'); promptEl.textContent = L.PROMPTS[k]; renderOptions(''); return; }
    // first look at this sticker: "AI가 살펴보는 중" → then the expressions appear
    scan.classList.add('on');
    promptEl.textContent = 'AI가 ' + (k + 1) + '번 스티커 부분을 살펴보고 있어요…';
    renderOptions('thinking');
    thinkTimer = setTimeout(function () {
      seen[k] = true;
      scan.classList.remove('on');
      promptEl.textContent = L.PROMPTS[k];
      renderOptions('ready');
    }, 900);
  }

  layer.addEventListener('click', function (e) { var b = e.target.closest('.lens'); if (b) activate(+b.dataset.k); });
  opts.addEventListener('click', function (e) {
    var b = e.target.closest('.opt'); if (!b) return;
    var i = +b.dataset.i;
    if (answers[active] === i) delete answers[active]; else answers[active] = i;
    L.saveAnswers(answers);
    opts.querySelectorAll('.opt').forEach(function (o) { o.setAttribute('aria-pressed', answers[active] === +o.dataset.i); });
    renderLenses(); syncNext();
    if (answers[active] == null) return;
    // move on to the next sticker without an answer
    var next = byKind().filter(function (s) { return answers[s.k] == null; })[0];
    if (next) setTimeout(function () { activate(next.k); }, 350);
  });

  // grey CTA until at least one sticker question is answered
  function syncNext() { document.getElementById('next').setAttribute('aria-disabled', Object.keys(answers).length ? 'false' : 'true'); }
  syncNext();

  L.photoSize(function (iw, ih) {
    map = L.cover(W, H, iw, ih);
    if (!lenses.length) lenses = DEMO.map(function (d) { var q = map.toImg(d.x, d.y); return { k: d.k, u: q.u, v: q.v }; });
    var first = byKind().filter(function (s) { return answers[s.k] == null; })[0] || byKind()[0];
    activate(first.k);
  });
})();
</script>
</body></html>
