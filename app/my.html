<script>
(function () {
  var days = [['월', 4, true], ['화', 5], ['수', 6, true], ['목', 7], ['금', 8], ['토', 9], ['일', 10]];
  var sel = 4;
  var el = document.getElementById('days');
  function render() {
    el.innerHTML = days.map(function (d, i) {
      return '<button class="day' + (i === sel ? ' sel' : '') + '" data-i="' + i + '" aria-pressed="' + (i === sel) + '">' +
        '<span class="dl">' + d[0] + '</span><span class="num"><img class="bubble" src="assets/tabs/day-selected.png" alt="">' +
        (d[2] ? '<img class="dot" src="assets/tabs/day-dot.png" alt="">' : '') + '<span>' + d[1] + '</span></span></button>';
    }).join('');
  }
  render();
  // Figma 달력 (Property 1=4…10): the picked day gets the box + bubble and the log below names that day
  var dayTitle = document.getElementById('dayTitle');
  el.addEventListener('click', function (e) {
    var b = e.target.closest('.day'); if (!b) return;
    sel = +b.dataset.i; render();
    dayTitle.textContent = '10월 ' + days[sel][1] + '일 탐험';
  });

  var settings = ['알림 관리', '공지사항', '고객센터', '보호자 설정', '위치 정보 설정', '서비스 이용 약관', '개인정보 처리방침'];
  document.getElementById('settings').innerHTML = settings.map(function (s) {
    return '<li><button type="button"><span>' + s + '</span><img src="assets/tabs/chevron-right-32.png" alt=""></button></li>';
  }).join('');
})();
</script>
