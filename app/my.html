<script>
  // 개인 설정 3단계에서 고른 탐험의 아이콘이 내 프로필 (없으면 Figma 기본 '풀')
  try { var av = localStorage.getItem('pico.avatar'); if (/^(flower|grass|river|tree|cloud|moon)$/.test(av)) document.getElementById('myAvatar').src = 'assets/profile/' + av + '.svg'; } catch (e) {}
  // 이름: 개인 설정 1에서 정한 탐험가 이름의 마지막 단어 (탐험가 카드 setup-done.html과 같은 규칙).
  // 이름을 정하지 않았으면 같은 예시 이름 '초고속 탐험가 선우' → '선우'.
  (function () {
    var full = '초고속 탐험가 선우';
    try { full = (localStorage.getItem('pico.name') || '').trim() || full; } catch (e) {}
    document.getElementById('myName').textContent = full.split(/\s+/).pop();
  })();
</script>
