<style>
  .abs { position: absolute; }
  .top[data-fixed] { height: 118px; background: var(--paper); }
  .nav .gear img { width: 30px; height: 30px; display: block; }

  /* 나 (Figma 3436:7327): 종이 한 장 · 이름 · 탐험가 단계 · 이어 온 날 + 숫자 셋 */
  .st { left: 20.11px; top: 141px; width: 335px; height: 169px; border: 1px solid var(--ink); box-sizing: border-box;
    background: url('assets/onboarding/ob-paper-full.jpg') -20px -146px / 375px 812px, var(--paper); background-blend-mode: multiply; }
  /* 이름 줄 (Figma 3751:32695): 글자 사이 4px · 세로 가운데 · "김선우 "와 "• "는 뒤 공백까지 폭에 들어가요 */
  .pname { left: 38.96px; top: 165.7px; display: flex; align-items: center; gap: 4px; white-space: pre; margin: 0; }
  .pname b { font-size: 20px; line-height: normal; margin-right: .8px; }
  .pname span { font-size: 14px; line-height: normal; } .pname .dot { font-weight: 700; margin-right: 1.09px; }   /* 시안은 글자 상자를 정수로 올림해서 폭이 조금 넉넉해요 */
  .streak { left: 38.96px; top: 194.7px; font-size: 14px; line-height: normal; white-space: nowrap; margin: 0; }
  /* 내 정보 = 보조 버튼: 종이색(#fffce4)을 darken으로 얹어서 카드 종이 질감이 그대로 비쳐요 (라임은 '내 것 · 고른 것'에만) */
  .info-btn { left: 255.96px; top: 172.2px; width: 85px; height: 33px; color: inherit; text-decoration: none; mix-blend-mode: darken; }
  .info-btn::before { content: ''; position: absolute; inset: -1.2px -1.8px -1.5px -1.7px; background: #fffce4; border: 1px solid var(--ink); transform: rotate(-1.8deg); }
  .info-btn span { position: absolute; inset: 0 -1px; background: #fffce4; border: 1px solid var(--ink); display: flex; align-items: center; justify-content: center; font-weight: 700; font-size: 12px; line-height: normal; }
  /* 점선: 시안 SVG (2px 점 · 약 2px 사이, 양 끝은 반 칸) */
  .rule { left: 31.46px; top: 225px; width: 310px; height: 1px; background: url('assets/my/stat-rule.svg') 0 0 / 310px 1px no-repeat; }
  /* 숫자 셋 (Figma 3751:32807): 카드 안 13px · 98px 에서 311×57, 양옆 25px · 칸 사이 30px · 세로선은 폭 0인 칸 */
  .stats { left: 33.11px; top: 239px; width: 311px; height: 57px; box-sizing: border-box; padding: 0 25px; display: flex; justify-content: center; align-items: center; gap: 30px; }
  .stat { display: flex; flex-direction: column; align-items: center; white-space: nowrap; }
  .stat .n { display: flex; align-items: flex-end; gap: 1px; height: 34px; margin: 0 var(--nr, 0) 0 0; }
  .stat .l { height: 14px; min-width: 45px; margin: 9px var(--lr, 0) 0 0; font-size: 12px; line-height: normal; }   /* --nr · --lr: 시안에서 숫자·이름표가 가운데에서 살짝 비켜 있는 값 (3px · 2px · 3px) */
  .stat b { font-weight: 700; font-size: 34px; line-height: normal; height: 34px; min-width: var(--bw); }
  .stat .u { font-size: 14px; line-height: normal; height: 14px; min-width: 13px; }   /* 글자 상자 폭은 시안 값 (숫자 24 · 37, 단위 13, 이름표 45) */
  .stats i { position: relative; width: 0; height: 47.997px; }
  .stats i::before { content: ''; position: absolute; left: -.4545px; top: -.456px; width: .909091px; height: 48.9062px; background: url('assets/my/stat-divider.svg') 0 0 / 100% 100% no-repeat; }

  .flow { left: 0; top: 333px; width: 375px; }
  .sec-h { display: flex; justify-content: space-between; align-items: center; height: 19px; padding: 0 20px; font-size: 16px; color: inherit; text-decoration: none; }
  .sec-h small { margin-left: 10px; font-size: 12px; }
  .sec-h img { width: 18px; height: 18px; transform: rotate(-90deg); }

  /* 배지 선반: 갈래마다 가장 먼저 받은 배지 하나가 선반 위에 서 있어요 (아래 = 갈래 이름 · 받은 수) · 누르면 배지 상세 */
  .shelf { position: relative; height: 152.14px; margin-top: 15px; }
  .sb { position: absolute; top: 0; width: 90px; height: 90px; display: block; }
  .sb img { width: 90px; height: 90px; display: block; }
  .pl { position: absolute; left: 19.9px; top: 84px; width: 335.2px; height: 20.14px; }
  .pl::before, .pl::after { content: ''; position: absolute; box-sizing: border-box; left: .1px; top: 2.97px; width: 335px; height: 14.21px; border: 1px solid var(--ink); }
  .pl::before { background: var(--lime); transform: rotate(-1.01deg); }
  .pl::after { background: url('assets/common/plank-paper.png') 0 0 / 100% 100% no-repeat, #f1eed6; }
  .sl { position: absolute; top: 114.14px; display: flex; flex-direction: column; align-items: center; padding: 0 15px; font-size: 16px; line-height: 19px; white-space: nowrap; color: inherit; text-decoration: none; }
  .sl span { font-size: 12px; }

  .tipx { margin-top: 23px; height: 105px; box-sizing: border-box; padding: 15.6px 21.5px 0; border-top: 1px dashed var(--ink); border-bottom: 1px dashed var(--ink); background: url('assets/onboarding/ob-paper-bottom.jpg') 0 0 / 375px 390px, var(--paper); background-blend-mode: multiply; }
  .tipx .h { margin: 0 0 5px; display: flex; gap: 2px; align-items: center; font-weight: 700; font-size: 16px; line-height: 1.3; }
  .tipx .h img { width: 32px; height: 32px; } .tipx p { margin: 0; }
  .tipx .h { margin: 0 0 5px; }
  .tipx .t { margin: 0; font-size: 14px; line-height: 1.3; }
  /* 앱 설정 = 피코 노트 줄 (종이 그대로 · 하늘색 줄 · 분홍 여백줄) */
  .set { position: relative; box-sizing: border-box; width: 330.48px; margin: 23px 0 0 22.26px; border: 1px solid var(--ink); }
  .set::before { content: ''; position: absolute; top: 0; bottom: 0; left: 23.55px; border-left: 1px solid var(--rule-pink); }
  .set h2 { margin: 0; height: 37.4px; box-sizing: border-box; padding: 12px 0 0 31.8px; font-size: 16px; font-weight: 400; line-height: normal; }
  .set ul { list-style: none; margin: 0; padding: 0; }
  .set li a { display: flex; align-items: center; justify-content: space-between; box-sizing: border-box; height: 41px; padding: 0 13.7px 0 31.8px; border-top: 1px solid var(--rule-cyan); font-size: 14px; color: inherit; text-decoration: none; }
  .set li img { width: 16px; height: 16px; }
</style>
</head><body>

<script>
  // 이름: 개인 설정 1에서 정한 탐험가 이름의 마지막 단어 (탐험가 카드 setup-done.html과 같은 규칙).
  // 이름을 정하지 않았으면 시안의 예시 이름 '김선우'.
  (function () {
    var full = '김선우';
    try { full = (localStorage.getItem('pico.name') || '').trim() || full; } catch (e) {}
    document.getElementById('myName').textContent = full.split(/\s+/).pop();
  })();
</script>
