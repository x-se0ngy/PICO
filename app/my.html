<style>
  :root { --font-hand: 'SejongGeulggot', var(--font); }
  @media (min-width: 500px) { body { padding-bottom: 0; } }
  .abs { position: absolute; }

  /* profile card (Figma 6.1.1, 2847:4004) */
  .card-shadow { left: 29.5px; top: 139.34px; width: 325px; height: 280px; background: var(--ink); border: 1px solid var(--ink); }
  .card-face { left: 20.5px; top: 128.9px; width: 325px; height: 280px; background: var(--brand); border: 1px dashed var(--ink); }
  .deco { left: 221.23px; top: 86px; width: 110px; height: 110px; z-index: 1; }
  .card-col { left: 28.5px; top: 144.69px; width: 310px; display: flex; flex-direction: column; gap: 10px; }
  .me { padding: 0 10px; display: flex; flex-direction: column; gap: 5px; white-space: nowrap; }
  .me .t { font-weight: 700; font-size: 20px; } .me .t small { font-size: 14px; } .me .t span { font-weight: 400; font-size: 14px; }
  .me .s { font-size: 14px; }
  .card-inner { width: 310px; height: 190px; background: var(--brand-soft); padding: 10px 7.5px; }

  .week { width: 295px; display: flex; flex-direction: column; gap: 10px; }
  .week-h { padding: 0 10px; display: flex; justify-content: space-between; align-items: flex-start; }
  .week-h > p { font-size: 14px; line-height: 19px; }
  .week-nav { display: flex; gap: 4px; align-items: center; font-size: 12px; white-space: nowrap; }
  .week-nav button img { width: 18px; height: 18px; }
  .week-nav .prev img { transform: scaleX(-1); }
  /* 달력 (Figma J. design systeam › 달력], 2847:11967 · Property 1 = 4…10)
     새 스타일은 Property 1=6 기준: 요일 14px + 30px 점선 · 날짜 30px 칸 가운데 12px · 295px 점선 · 그날 기록 12/20 */
  .cal { display: flex; flex-direction: column; gap: 15px; }
  .days { display: flex; justify-content: space-between; width: 295px; }
  .day { width: 30px; font-weight: 400; display: flex; flex-direction: column; align-items: center; gap: 16px; font-size: 14px; text-align: center; }
  .day .dl { position: relative; width: 30px; height: 20.89px; font-weight: 400; }
  .day .dl::after { content: ''; position: absolute; left: 0; top: 20.39px; width: 30px; height: 1px; background: url('assets/tabs/cal-rule-30.svg') no-repeat; }
  .day .num { position: relative; width: 30px; height: 30px; display: flex; align-items: center; justify-content: center; font-size: 12px; line-height: normal; }
  .day .num span { position: relative; }
  /* 탐험한 날 점 (Group 2147203356): 30px 칸 안 20/4.22, 5px */
  .day .dot { position: absolute; left: 20px; top: 4.22px; width: 5px; height: 5px; }
  /* 고른 날: 30px 네모 + 파란 방울(그림자 없음, Group 2147203354) 1.75/1.22 · 숫자는 칸 가운데 */
  .day.sel .num::after { content: ''; position: absolute; inset: 0; border: 1px solid var(--ink); }
  .day .bubble { position: absolute; left: 1.75px; top: 1.22px; width: 27.14px; height: 27px; }
  .day.sel .num span { top: 0.22px; }
  .cal hr { margin: 0; width: 295px; height: 1px; border: 0; background: url('assets/tabs/cal-rule-295.svg') no-repeat; }
  .daylog { width: 250px; font-size: 12px; line-height: 20px; white-space: nowrap; }
  .daylog p:last-child { font-family: var(--font-hand); }

  /* sections below the card: Figma column gap 20 */
  .stack { left: 0; top: 439.34px; width: 375px; display: flex; flex-direction: column; gap: 20px; }
  .sec { display: flex; flex-direction: column; gap: 10px; }
  .sec-h { padding: 0 20px; width: 375px; display: flex; justify-content: space-between; align-items: flex-start; font-size: 16px; white-space: nowrap; }
  .sec-h img { width: 18px; height: 18px; }
  .saved { padding: 0 20px; display: flex; gap: 14.09px; }
  .saved a { position: relative; width: 110.61px; height: 120px; display: block; flex: none; }
  .saved img { position: absolute; left: -0.5px; top: -0.5px; width: 111.6px; height: 91px; }
  .saved .band { position: absolute; left: 0; top: 90px; width: 110.61px; height: 30px; background: var(--brand); border: 1px solid var(--ink); }
  .saved .nm { position: absolute; left: 6.12px; top: 96.5px; font-size: 14px; white-space: nowrap; }
  /* badge row scrolls sideways; the 4th badge peeks past the edge */
  .badges { display: flex; gap: 15px; padding: 0 20px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
  .badges::-webkit-scrollbar { display: none; }
  .badges a { flex: none; display: flex; flex-direction: column; align-items: center; gap: 15px; font-size: 14px; white-space: nowrap; }
  .badges a:last-child { margin-right: 20px; }
  .badges img { width: 90px; height: 90px; }
  .friends { padding: 0 20px; display: flex; gap: 15px; overflow-x: auto; scrollbar-width: none; overscroll-behavior-x: contain; }
  .friends::-webkit-scrollbar { display: none; }
  .friends a:last-child { margin-right: 20px; }
  .friends a { min-width: 60px; flex: none; display: flex; flex-direction: column; align-items: center; gap: 8px; font-size: 14px; line-height: 19px; white-space: nowrap; }
  .friends img { width: 60px; height: 60px; }
  .friends .add img { width: 55px; align-self: flex-start; }

  .tip { width: 375px; height: 110px; background: #00b7ff; border-top: 1px dashed var(--ink); border-bottom: 1px dashed var(--ink); padding: 16px; display: flex; flex-direction: column; justify-content: center; gap: 5px; }
  .tip .h { display: flex; gap: 2px; align-items: center; font-weight: 700; font-size: 20px; line-height: 1.3; }
  .tip .h img { width: 32px; height: 32px; }
  .tip .d { font-size: 14px; line-height: 1.3; white-space: nowrap; }

  .settings { padding: 0 20px; width: 375px; display: flex; flex-direction: column; gap: 10px; }
  .settings > p { font-size: 20px; }
  .settings ul { margin: 0; padding: 0; list-style: none; display: flex; flex-direction: column; gap: 4px; }
  .settings button { width: 100%; display: flex; justify-content: space-between; align-items: center; font-size: 14px; text-align: left; }
  .settings button img { width: 32px; height: 32px; }
</style>

<script>
(function () {
  // Figma 달력 (2847:11967, Property 1 = 4…10): 고른 날은 네모 + 파란 방울, 점 찍힌 날(4·6일)은 파란 점,
  // 아래 기록이 그날 문구로 바뀌어요. 문구는 Figma 변형마다 들어 있는 그대로예요.
  var NAMES = ['월', '화', '수', '목', '금', '토', '일'];
  var LOG = { '10-4': '새로운 곤충 3종을 발견했어요 · 첫 관찰을 기록했어요',
              '10-5': '나비 2마리를 만났어요 · 꽃밭 탐험을 완료했어요',
              '10-6': '곤충 4마리를 관찰했어요 · 호기심 배지를 받았어요',
              '10-7': '무당벌레를 발견했어요 · 관찰 스티커 3개를 모았어요',
              '10-8': '친구와 곤충 3종을 발견해 함께 탐험을 완료했어요',
              '10-9': '친구와 곤충 3종을 발견했어요 · 함께 탐험을 완료했어요',
              '10-10': '새로운 곤충 6마리를 만났어요 · 일주일 탐험 배지를 받았어요' };
  var DOT = { '10-4': 1, '10-6': 1 };                         // Figma에서 파란 점이 찍힌 날
  // 프로토타입 달력: 기준 주는 Figma처럼 10월 4(월)~10(일)일 · "10월 셋째 주". 화살표로 앞뒤 주를 넘겨요.
  // 2027년 10월 4일이 월요일이라 배지 날짜(2027.10.xx)와 요일이 맞아요.
  var WEEKS = ['첫째', '둘째', '셋째', '넷째', '다섯째'];
  var BASE = new Date(2027, 9, 4), offset = 0, sel = 4;       // 기본: 금 8일 선택 (Figma 6.1.1)
  var el = document.getElementById('days'), dayTitle = document.getElementById('dayTitle'),
      dayText = document.getElementById('dayText'), wkLabel = document.getElementById('wkLabel');
  var st = +document.documentElement.dataset.state;          // ?state=4…10 → 그날을 골라 열어요 (Figma Property 1)
  if (st >= 4 && st <= 10) sel = st - 4;
  function day(i) { var d = new Date(BASE); d.setDate(d.getDate() + offset * 7 + i); return d; }
  function key(d) { return (d.getMonth() + 1) + '-' + d.getDate(); }
  function render() {
    el.innerHTML = NAMES.map(function (n, i) {
      var d = day(i), k = key(d), on = i === sel, dot = !!DOT[k], num = d.getDate();
      // 고른 날: 점 있는 날은 점이 그려진 방울(Figma 4·6 변형), 아니면 기본 방울
      var mark = on ? '<img class="bubble" src="assets/tabs/' + (dot ? 'cal-selected-dot' : 'cal-selected') + '.svg" alt="">'
                    : (dot ? '<img class="dot" src="assets/tabs/cal-dot.svg" alt="">' : '');
      return '<button class="day' + (on ? ' sel' : '') + '" data-i="' + i + '" aria-pressed="' + on + '" aria-label="' + (d.getMonth() + 1) + '월 ' + num + '일 ' + n + '요일' + (LOG[k] ? ' · 탐험 기록 있음' : '') + '">' +
        '<span class="dl">' + n + '</span><span class="num">' + mark +
        '<span>' + num + '</span></span></button>';
    }).join('');
    var s = day(sel);
    dayTitle.textContent = (s.getMonth() + 1) + '월 ' + s.getDate() + '일 탐험';
    dayText.textContent = LOG[key(s)] || '이날은 탐험 기록이 없어요.';
    var w = 2 + offset;                                       // 기준 주 = 10월 셋째 주
    wkLabel.textContent = (w < 0 ? '9월 ' + WEEKS[Math.max(0, 5 + w)] : w < 5 ? '10월 ' + WEEKS[w] : '11월 ' + WEEKS[Math.min(4, w - 5)]) + ' 주';
  }
  el.addEventListener('click', function (e) {
    var b = e.target.closest('.day'); if (!b) return;
    sel = +b.dataset.i; render();
  });
  document.getElementById('wkPrev').addEventListener('click', function () { offset--; render(); });
  document.getElementById('wkNext').addEventListener('click', function () { offset++; render(); });
  render();

  var settings = ['알림 관리', '공지사항', '고객센터', '보호자 설정', '위치 정보 설정', '서비스 이용 약관', '개인정보 처리방침'];
  document.getElementById('settings').innerHTML = settings.map(function (s) {
    return '<li><button type="button"><span>' + s + '</span><img src="assets/tabs/chevron-right-32.png" alt=""></button></li>';
  }).join('');
})();
</script>
