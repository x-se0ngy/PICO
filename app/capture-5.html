<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">

<title>PICO · 촬영 5 그림 그리기</title>
<link rel="preload" href="fonts/HakgyoansimAllimjangTTF-R.woff2" as="font" type="font/woff2" crossorigin>
<link rel="preload" href="fonts/HakgyoansimAllimjangTTF-B.woff2" as="font" type="font/woff2" crossorigin>
<link rel="expect" href="#pico-ready" blocking="render">
<link rel="stylesheet" href="base.css">
<style>
  /* 그림판: 아이들 손가락이 작은 칸에 갇히지 않게 화면 가로 끝까지(375) 크게 — 위·아래 선만 있어요 */
  .board { position: absolute; left: 0; top: 244px; width: 375px; height: 340px; background: transparent; border: 1px solid var(--ink); border-width: 1px 0; z-index: 2; }
  /* 사진이 처음부터 연하게 비쳐 보여요(따라 그리기). 사진 버튼을 누르면 숨기고 빈 종이로 그려요.
     저장되는 건 그린 선뿐이라 사진은 그림에 섞이지 않아요. */
  .board .ref { position: absolute; inset: 0; background-size: cover; background-position: center; opacity: .4; transition: opacity var(--dur) var(--ease); pointer-events: none; }
  .board.hide-ref .ref { opacity: 0; }
  .board canvas { position: relative; display: block; width: 375px; height: 338px; touch-action: none; cursor: crosshair; }
  /* Figma Warm-Up 촬영 5: 색연필 8자루(32.685 폭, 간격 4)가 (22, 601)부터 끝까지 다 보이고, 그 오른쪽 10px에
     아이콘 두 개(사진 보기 · 모두 지우기)가 아래쪽 맞춤으로 세로로 놓여요. */
  .crayons { position: absolute; left: 22px; top: 601px; height: 92.18px; display: flex; gap: 4px; }
  .crayon { width: 32.685px; height: 92.18px; position: relative; flex: none; transition: transform var(--dur) var(--ease); }
  .crayon img { position: absolute; left: -.2px; top: 0; width: 33.6px; height: auto; max-width: none; }
  .crayon[aria-pressed="true"] { transform: translateY(-12px); }
  .tools { position: absolute; left: 321.5px; top: 619.18px; display: flex; flex-direction: column; gap: 10px; }
  .tools button, .tools img { display: block; width: 32px; height: 32px; }
  .ref-toggle img { transition: opacity var(--dur) var(--ease); }
  .ref-toggle[aria-pressed="true"] { background: var(--brand-soft); outline: 1px solid var(--ink); }
  .refresh img { transition: transform var(--dur) var(--ease); }
  .refresh:active img { transform: rotate(-90deg); }
</style>
</head><body>
<div class="phone cap" style="--h:812px">

  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav">
      <a href="capture-4.html" aria-label="뒤로"><img class="icon" src="assets/icons/outline/arrow-left.svg" alt=""></a>
      <a href="home.html" aria-label="닫기" data-confirm="관찰을 중단할까요?"><img class="icon" src="assets/icons/outline/close.svg" alt=""></a>
    </div>
  </div>

  <span class="kind step-kind">04 · 그림 그리기</span>
  <div class="progress low" aria-label="4단계 중 4단계"><span class="on"></span><span class="on"></span><span class="on"></span><span class="on"></span></div>

  <div class="step-title cap">
    <p class="q">기억나는 모습을 그려보세요.</p>
    <p class="sub">자유롭게 그려 보세요. 똑같지 않아도 괜찮아요.</p>
  </div>

  <div class="board" id="board"><div class="ref" data-photo></div><canvas id="pad" width="375" height="338" aria-label="그림판"></canvas></div>

  <div class="crayons" id="crayons" role="radiogroup" aria-label="색연필"></div>
  <div class="tools">
    <button class="ref-toggle" id="refToggle" type="button" aria-pressed="true" aria-label="사진 겹쳐 보기"><img src="assets/icons/outline/photo.svg" alt=""></button>
    <button class="refresh" id="clear" type="button" aria-label="모두 지우기"><img src="assets/icons/outline/refresh.svg" alt=""></button>
  </div>

  <a class="cta step" href="capture-card.html"><span class="cta-face">다음 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></a>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script src="photo.js"></script>

<script>
  document.getElementById('refToggle').addEventListener('click', function () {
    var on = this.getAttribute('aria-pressed') !== 'true';
    this.setAttribute('aria-pressed', String(on));
    document.getElementById('board').classList.toggle('hide-ref', !on);
  });
</script>
<script>
  // 색연필 목록. base = 관찰 색 8개(PicoLens.COLORS) 중 같은/가까운 번호 (없으면 -1), s = 일기 단어로 쓰는 말.
  // 색연필을 늘리거나 바꿀 땐 여기에 한 줄만 더하면 돼요 (그림 이미지는 assets/capture/s4-crayon-<name>.png).
  var PALETTE = [
    { name: 'red', label: '빨강', c: '#e32d3d', base: 0, s: '빨간색이에요.' }, { name: 'orange', label: '주황', c: '#fca436', base: 1, s: '주황색이에요.' },
    { name: 'yellow', label: '노랑', c: '#f4d159', base: 2, s: '노란색이에요.' }, { name: 'leaf', label: '연두', c: '#a7c049', base: 3, s: '연두색이에요.' },
    { name: 'teal', label: '청록', c: '#48b2bb', base: -1, s: '청록색이에요.' }, { name: 'blue', label: '파랑', c: '#2c70d1', base: 4, s: '파란색이에요.' },
    { name: 'purple', label: '보라', c: '#6b4eac', base: -1, s: '보라색이에요.' }, { name: 'gray', label: '회색', c: '#4e4e4e', base: -1, s: '회색이에요.' }
  ];
  var color = PALETTE[0].c, box = document.getElementById('crayons');
  // 색연필은 한 번만 만들고 눌림 상태(aria-pressed)만 바꿔요.
  // 누를 때마다 새로 그리면 transition이 끊겨서 집어 올리는 모션이 안 보여요.
  box.innerHTML = PALETTE.map(function (p) {
    return '<button class="crayon" type="button" role="radio" data-c="' + p.c + '" aria-pressed="' + (p.c === color) + '" aria-checked="' + (p.c === color) + '" aria-label="' + p.label + '">' +
      '<img src="assets/capture/s4-crayon-' + p.name + '.png" alt=""></button>';
  }).join('');
  function pick(c) {
    color = c;
    Array.prototype.forEach.call(box.children, function (b) {
      var on = b.dataset.c === c;
      b.setAttribute('aria-pressed', on); b.setAttribute('aria-checked', on);
    });
  }
  box.addEventListener('click', function (e) { var b = e.target.closest('.crayon'); if (b) pick(b.dataset.c); });

  // Drawing pad (pointer events, HiDPI)
  var cv = document.getElementById('pad'), ctx = cv.getContext('2d'), dpr = window.devicePixelRatio || 1;
  var W = 375, H = 338;   // 그림판 크기 (CSS px)
  cv.width = W * dpr; cv.height = H * dpr; ctx.scale(dpr, dpr);
  ctx.lineCap = 'round'; ctx.lineJoin = 'round'; ctx.lineWidth = 5;
  var drawing = false, last = null, used = {}, pts = [];
  function pt(e) {
    var r = cv.getBoundingClientRect();
    return { x: (e.clientX - r.left) * W / r.width, y: (e.clientY - r.top) * H / r.height };
  }

  // ---- 선을 닫으면 색이 채워져요 ----
  //  1) 선이 스스로 가로지르면 그 고리 안쪽을 채워요 (닫으면서 조금 넘어가도 돼요)
  //  2) 가로지르지 않았어도 끝점이 시작점 근처(CLOSE)에 오면 시작점으로 이어서 채워요
  var CLOSE = 30;        // 끝점이 시작점에서 이만큼(px) 안이면 닫은 것으로 봐요
  var MIN_AREA = 140;    // 이보다 작은 점·짧은 선은 채우지 않아요
  function area(poly) {
    var a = 0;
    for (var i = 0, n = poly.length; i < n; i++) { var p = poly[i], q = poly[(i + 1) % n]; a += p.x * q.y - q.x * p.y; }
    return Math.abs(a) / 2;
  }
  function cross(a, b, c, d) {
    var rx = b.x - a.x, ry = b.y - a.y, sx = d.x - c.x, sy = d.y - c.y, den = rx * sy - ry * sx;
    if (Math.abs(den) < 1e-9) return null;
    var t = ((c.x - a.x) * sy - (c.y - a.y) * sx) / den, u = ((c.x - a.x) * ry - (c.y - a.y) * rx) / den;
    if (t < 0 || t > 1 || u < 0 || u > 1) return null;
    return { x: a.x + t * rx, y: a.y + t * ry };
  }
  function closedShapes(p) {
    var out = [], n = p.length, from = 0;
    if (n < 4) return out;
    for (var i = 2; i < n - 1; i++) {
      for (var j = from; j < i - 1; j++) {
        var x = cross(p[j], p[j + 1], p[i], p[i + 1]);
        if (!x) continue;
        var poly = [x].concat(p.slice(j + 1, i + 1));
        if (area(poly) >= MIN_AREA) out.push(poly);
        from = i;                 // 이 고리는 썼으니, 다음 고리는 여기서부터 찾아요
        break;
      }
    }
    if (!out.length && Math.hypot(p[n - 1].x - p[0].x, p[n - 1].y - p[0].y) < CLOSE && area(p) >= MIN_AREA) out.push(p.slice());
    return out;
  }

  // 채워지는 모습도 다른 움직임처럼 --dur ease in-out으로 스르륵
  var fill = null;
  function paint(f, t) {
    ctx.putImageData(f.snap, 0, 0);
    ctx.save(); ctx.globalAlpha = t; ctx.fillStyle = f.color;
    f.shapes.forEach(function (poly) {
      ctx.beginPath(); ctx.moveTo(poly[0].x, poly[0].y);
      for (var i = 1; i < poly.length; i++) ctx.lineTo(poly[i].x, poly[i].y);
      ctx.closePath(); ctx.fill();
    });
    ctx.restore();
  }
  function finishFill() { if (fill) { cancelAnimationFrame(fill.raf); paint(fill, 1); fill = null; } }
  function startFill(shapes) {
    var f = { shapes: shapes, color: color, snap: ctx.getImageData(0, 0, cv.width, cv.height), t0: 0, raf: 0 };
    var still = window.matchMedia && matchMedia('(prefers-reduced-motion: reduce)').matches;
    var dur = still ? 0 : (window.picoDur ? picoDur() : 500);
    used[color] = (used[color] || 0) + 1;
    if (!dur) { paint(f, 1); return; }
    fill = f;
    f.raf = requestAnimationFrame(function step(now) {
      if (fill !== f) return;
      if (!f.t0) f.t0 = now;
      var x = Math.min(1, (now - f.t0) / dur), e = x < .5 ? 2 * x * x : 1 - Math.pow(-2 * x + 2, 2) / 2;   // ease in-out
      paint(f, e);
      if (x < 1) f.raf = requestAnimationFrame(step); else fill = null;
    });
  }

  cv.addEventListener('pointerdown', function (e) {
    finishFill();
    drawing = true; last = pt(e); pts = [last]; cv.setPointerCapture(e.pointerId);
    used[color] = (used[color] || 0) + 1;
    ctx.fillStyle = color; ctx.beginPath(); ctx.arc(last.x, last.y, ctx.lineWidth / 2, 0, Math.PI * 2); ctx.fill();
  });
  cv.addEventListener('pointermove', function (e) {
    if (!drawing) return;
    var p = pt(e); ctx.strokeStyle = color;
    ctx.beginPath(); ctx.moveTo(last.x, last.y); ctx.lineTo(p.x, p.y); ctx.stroke(); last = p;
    var q = pts[pts.length - 1]; if (Math.hypot(p.x - q.x, p.y - q.y) >= 2) pts.push(p);
  });
  function end(close) {
    if (!drawing) return;
    drawing = false;
    var shapes = close ? closedShapes(pts) : [];
    if (shapes.length) startFill(shapes);
    pts = [];
  }
  cv.addEventListener('pointerup', function () { end(true); });
  cv.addEventListener('pointercancel', function () { end(false); });
  document.getElementById('clear').addEventListener('click', function () {
    if (fill) { cancelAnimationFrame(fill.raf); fill = null; }
    ctx.clearRect(0, 0, W, H); used = {};
  });

  // 다음: 그린 그림을 PICO 스티커로 저장 (가장 많이 쓴 색 이름은 PICO 이름에 써요)
  document.querySelector('.cta').addEventListener('click', function () {
    finishFill();
    var top = null, n = 0, topPal = null;
    PALETTE.forEach(function (p) { if ((used[p.c] || 0) > n) { n = used[p.c]; top = p.label; topPal = p; } });
    window.PicoField && PicoField.saveDraft(cv, top);
    saveColor(topPal);
  });
  // 02에서는 색을 묻지 않아요: 가장 많이 쓴 색연필이 이 곤충의 색 답이 돼요 (아무것도 안 그렸으면 색 답 없음)
  function saveColor(pal) {
    if (!window.PicoLens) return;
    var a = PicoLens.answers(), c = PicoLens.custom(), COLOR = 0;
    if (!pal) { delete a[COLOR]; delete c[COLOR]; }
    else {
      a[COLOR] = pal.base;                                   // 8색 중 가까운 번호 (없으면 -1 → 꼼꼼 관찰 계산에서는 빠져요)
      if (pal.base > -1 && PicoLens.COLORS[pal.base].n === pal.label) delete c[COLOR];   // 8색과 똑같으면 기본 말을 써요
      else c[COLOR] = { t: pal.s, hex: pal.c, name: pal.label, exact: false };
    }
    PicoLens.saveAnswers(a); PicoLens.saveCustom(c);
  }
</script>
<span id="pico-ready"></span>
</body></html>
