<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="manifest" href="/app/manifest.json">
<meta name="theme-color" content="#fffad3">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="PICO">
<link rel="icon" href="/favicon.svg" type="image/svg+xml">
<link rel="icon" href="/favicon.ico" sizes="any">
<link rel="apple-touch-icon" href="/apple-touch-icon.png">
<title>PICO · 학년 설정</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* Figma 1.2.2 / 1.2.3 선택 카드: 162.5×74, 테두리만 있는 종이.
     고르면 라임 종이가 되고, 뒤에 -1.8° 기울어진 종이 한 장이 비쳐요 (큰 버튼과 같은 두 장 종이). */
  .pick-grid { position: absolute; left: 20px; top: 228.02px; width: 335px; display: grid; grid-template-columns: 162.5px 162.5px; column-gap: 9.92px; row-gap: 10px; }
  .pick { position: relative; width: 162.5px; height: 74px; text-align: left; border: 1px solid var(--ink); background: transparent;
    display: flex; flex-direction: column; align-items: flex-start; padding: 0 0 0 11.8px; }
  .pick::before { content: ''; position: absolute; left: -1.62px; top: -1px; width: 160.541px; height: 74px; background: var(--lime); border: 1px solid var(--ink); box-sizing: border-box;
    transform: rotate(-1.8deg); z-index: -1; opacity: 0; transition: opacity var(--dur) var(--ease); }
  .pick[aria-checked="true"] { background: var(--lime); transform: translate(1.93px, -.3px); }
  .pick[aria-checked="true"]::before { opacity: 1; }
  .pick-grid { isolation: isolate; }
  .pick { padding-top: 16.34px; gap: 4px; }
  .pick .k { font-size: 14px; line-height: 12.19px; height: 12.19px; }
  .pick .v { font-size: 20px; line-height: 28.15px; white-space: nowrap; }
  .info-bar { position: absolute; left: 20px; top: 564px; width: 335px; height: 55px; border: 1px dashed var(--ink);
    display: flex; align-items: center; gap: 8px; padding-left: 11px; font-size: 14px; line-height: 16px; white-space: nowrap; }
  .info-bar img { width: 18px; height: 18px; }
  .step-title { top: 174px; }
</style>
</head><body>
<div class="phone flat setup" style="--h:812px">
  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav nav--center"><img class="logo" src="assets/common/logo-mark.png" alt="PICO"></div>
  </div>

  <div class="progress" aria-label="3단계 중 2단계"><span class="on"></span><span class="on"></span><span></span></div>

  <div class="step-title">
    <p class="q"><span>02.</span><span>몇 학년 탐험가인가요?</span></p>
    <p class="sub">학년에 맞춰 탐험 질문과 설명을 조금씩 다르게 보여 줄게요.</p>
  </div>

  <div class="pick-grid" id="grades" role="radiogroup" aria-label="학년"></div>

  <div class="info-bar"><img src="assets/icons/outline/calendar-check.svg" alt=""><span>학년은 나만 볼 수 있어요. 친구에게는 보이지 않아요.</span></div>

  <a class="cta" id="next" aria-disabled="true" href="setup-explore.html" style="top:708.07px"><span class="cta-face">다음 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></a>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script>
(function () {
  var GRADES = ['1학년 이하', '1학년', '2학년', '3학년', '4학년', '5학년', '6학년', '6학년 이상'];
  var selected = document.documentElement.dataset.state === 'picked' ? 3 : null; // grey CTA until a grade is picked
  var grid = document.getElementById('grades');
  grid.innerHTML = GRADES.map(function (g, i) {
    return '<button type="button" class="pick" role="radio" data-i="' + i + '"><span class="k">초등학교</span><span class="v">' + g + '</span></button>';
  }).join('');
  var next = document.getElementById('next');
  function render() {
    grid.querySelectorAll('.pick').forEach(function (b) { b.setAttribute('aria-checked', String(+b.dataset.i === selected)); });
    next.setAttribute('aria-disabled', selected == null ? 'true' : 'false');
  }
  grid.addEventListener('click', function (e) {
    var b = e.target.closest('.pick'); if (!b) return;
    selected = +b.dataset.i; render();
  });
  next.addEventListener('click', function (e) {
    if (selected == null) { e.preventDefault(); return; }
    try { localStorage.setItem('pico.grade', GRADES[selected]); } catch (e) {}
  });
  render();
})();
</script>
</body></html>
