<html lang="ko"><head>

<style>

  .splash-copy--tag { top: 750.88px; }
</style>
</head><body>
<div class="phone splash" style="--h:812px" data-go="onboard-1.html" role="link" aria-label="시작하기">

    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
  </div>

  <img class="splash-union" src="assets/onboarding/splash-union.png" alt="">
  <img class="splash-logo" src="assets/onboarding/splash-logo.png" alt="PICO">

  <p class="splash-copy splash-copy--quote">“Now, pick your PICO”<br>there’s more waiting outside</p>
