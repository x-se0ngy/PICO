<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICO · 촬영 2 렌즈 스티커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* Figma 3.1.2 (2855:14593): photo 335x200 at (20, 232) — same box as 3.1.3, so stickers keep their spot */
  .step-title .sub { white-space: nowrap; }
  .photo { position: absolute; left: 20px; top: 232px; width: 335px; height: 200px; background: var(--surface); border: 1px solid var(--ink); cursor: crosshair; touch-action: none; overflow: hidden; }
  .photo.has-photo { background-position: center; background-size: cover; background-repeat: no-repeat; }
  .photo .lens { cursor: grab; animation: pop .22s ease-out; }
  .photo .lens.dragging { cursor: grabbing; animation: none; transform: scale(1.12); z-index: 3; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .ghost { position: absolute; z-index: 30; pointer-events: none; transform: scale(1.12); }

  /* armed sticker kind (3.1.3 heading typography) */
  .kind { position: absolute; left: 20px; top: 446px; display: flex; gap: 5px; font-weight: 700; font-size: 16px; line-height: normal; white-space: nowrap; }
  .prompt { position: absolute; left: 20px; top: 470px; font-size: 16px; line-height: normal; white-space: nowrap; }

  /* tray: Figma 스티커2 41px at top 503, every 61px — dashed = still on the sheet, green = picked (armed) */
  .tray { position: absolute; left: 20.56px; top: 503px; display: flex; gap: 20px; }
  .tray-item { position: relative; width: 41px; height: 41px; touch-action: none; transition: transform .2s cubic-bezier(.25, .6, .07, 1), opacity .2s; }
  .tray-item img { position: absolute; pointer-events: none; -webkit-user-drag: none; }
  .tray-item .off { left: -4.5px; top: -4.5px; width: 47px; height: 47px; }
  .tray-item .on { left: 0; top: 0; width: 38px; height: 38px; display: none; }
  .tray-item.armed .on { display: block; }
  .tray-item.armed .off { display: none; }
  .tray-item.armed { transform: translateY(-4px); }
  .tray-item.placed { opacity: .35; }
  .tray-item .no { position: absolute; left: 31px; top: 28px; width: 10px; font-size: 12px; line-height: normal; text-align: center; }
  .photo img { -webkit-user-drag: none; }

  /* Figma 텍스트 알림 (2847:3347): blue 290x45 face + black offset shadow */
  .notice { position: absolute; left: 39.83px; top: 631px; width: 295.334px; height: 50.989px; transition: opacity .3s; }
  .notice::before { content: ''; position: absolute; left: 5.35px; top: 5.99px; right: 0; bottom: 0; background: var(--ink); border: 1px solid var(--ink); }
  .notice-face { position: absolute; left: 0; top: 0; width: 290px; height: 45px; background: #00b7ff; border: 1px solid var(--ink); display: flex; align-items: center; gap: 10px; padding: 1px 0 0 14px; font-size: 14px; line-height: normal; white-space: nowrap; }
  .notice-face img { width: 24px; height: 24px; flex: none; }
  .notice.off { opacity: 0; pointer-events: none; }
</style>
</head><body>
<div class="phone" style="--h:812px">

  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav">
      <a href="capture-1.html" aria-label="뒤로"><img class="icon" src="assets/capture/s2-icon-back.png" alt=""></a>
      <a href="home.html" aria-label="닫기" data-confirm="관찰을 중단할까요?"><img class="icon" src="assets/capture/s2-icon-close.png" alt=""></a>
    </div>
  </div>

  <div class="progress" aria-label="5단계 중 2단계"><span class="on"></span><span class="on"></span><span></span><span></span><span></span></div>

  <div class="step-title">
    <p class="q"><span>02.</span><span>어디가 궁금했나요?</span></p>
    <p class="sub">궁금한 곳에 2~3개 정도 렌즈 스티커를 붙여보세요.</p>
  </div>

  <div class="photo" id="photo" data-photo aria-label="촬영한 사진 · 누른 곳에 스티커가 붙어요"><div class="lens-layer" id="layer"></div></div>

  <p class="kind" id="kind"><span id="kindNo">01</span><span id="kindName">생김새</span></p>
  <p class="prompt" id="prompt" aria-live="polite">모양이나 색이 궁금한 곳에 붙여요.</p>

  <div class="tray" id="tray" role="group" aria-label="렌즈 스티커"></div>

  <div class="notice" id="notice" role="status"><div class="notice-face"><img src="assets/capture/card-toast-icon.png" alt=""><span id="hint">궁금한 곳에 스티커를 붙여보세요.</span></div></div>

  <a class="cta step" id="next" href="capture-3.html" aria-disabled="true"><span class="cta-face">다음 <img src="assets/common/arrow-right.png" alt=""></span></a>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script src="photo.js"></script>
<script src="stickers.js"></script>
<script>
(function () {
  // 스티커를 고르고(트레이) → 사진에서 궁금한 곳을 누르거나 끌어다 놓아요. 붙인 스티커는 끌어서 옮길 수 있어요.
  var L = PicoLens, KINDS = L.KINDS, R = L.R;
  var photo = document.getElementById('photo'), layer = document.getElementById('layer');
  var tray = document.getElementById('tray'), hint = document.getElementById('hint'), notice = document.getElementById('notice');
  var next = document.getElementById('next');
  var lenses = L.load();          // [{k, u, v}]
  var armed = null, map = null, sayTimer;
  var W = 333, H = 198;           // photo padding box (same as 3·5단계)
  // heading under the photo: the sticker you're holding
  var LINES = ['모양이나 색이 궁금한 곳에 붙여요.', '어떻게 움직이는지 궁금한 곳에 붙여요.', '어디에 사는지 궁금한 곳에 붙여요.', '주변과 어울리는 모습에 붙여요.'];
  var BASE = '궁금한 곳에 스티커를 붙여보세요.';

  function placed(k) { for (var i = 0; i < lenses.length; i++) if (lenses[i].k === k) return lenses[i]; return null; }
  function firstFree() { for (var k = 0; k < 4; k++) if (!placed(k)) return k; return null; }
  // 파란 알림: 처음엔 안내, 스티커를 2개 붙이면 사라져요. 잠깐 보여 줄 메시지도 여기에 써요.
  function say(t) {
    clearTimeout(sayTimer);
    if (t) { hint.textContent = t; notice.classList.remove('off'); sayTimer = setTimeout(function () { say(''); }, 2600); return; }
    hint.textContent = BASE; notice.classList.toggle('off', lenses.length >= 2);
  }
  function renderHead() {
    var k = armed;
    document.getElementById('kindNo').textContent = k === null ? '' : '0' + (k + 1);
    document.getElementById('kindName').textContent = k === null ? '스티커를 다 붙였어요' : KINDS[k];
    document.getElementById('prompt').textContent = k === null ? '붙인 스티커는 끌어서 옮길 수 있어요.' : LINES[k];
  }

  function renderTray() {
    tray.innerHTML = KINDS.map(function (name, k) {
      // Figma 스티커2: 화이트 선 (dashed) = on the sheet, 그린 = picked; already on the photo = faded slot
      var cls = 'tray-item' + (armed === k ? ' armed' : '') + (placed(k) && armed !== k ? ' placed' : '');
      return '<button type="button" class="' + cls + '" data-k="' + k + '" aria-pressed="' + (armed === k) + '" aria-label="' + (k + 1) + '. ' + name + (placed(k) ? ' · 붙였어요' : '') + '">' +
        '<img class="off" src="assets/capture/s2-tray-sticker-off.png" alt=""><img class="on" src="assets/capture/s2-tray-sticker-on.png" alt="">' +
        '<span class="no">' + (k + 1) + '</span></button>';
    }).join('');
    renderHead();
    next.setAttribute('aria-disabled', lenses.length ? 'false' : 'true');
  }
  function renderLenses() {
    if (!map) return;
    layer.innerHTML = lenses.map(function (s) {
      var p = map.toBox(s.u, s.v);
      return L.html(s.k, p.x, p.y, { attrs: ' aria-label="' + (s.k + 1) + '. ' + KINDS[s.k] + ' 스티커 · 끌어서 옮기기"' });
    }).join('');
  }
  function render() { renderTray(); renderLenses(); }
  function commit() { L.save(lenses); render(); }

  // 칸 안 좌표 → 사진 좌표 (스티커가 칸 밖으로 나가지 않게)
  function at(clientX, clientY) {
    var r = photo.getBoundingClientRect(), sc = r.width / (W + 2);
    var x = L.clamp((clientX - r.left) / sc - 1, R, W - R), y = L.clamp((clientY - r.top) / sc - 1, R, H - R);
    return map.toImg(x, y);
  }
  function inside(clientX, clientY) {
    var r = photo.getBoundingClientRect();
    return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
  }
  function put(k, pos) {
    var s = placed(k);
    if (s) { s.u = pos.u; s.v = pos.v; } else lenses.push({ k: k, u: pos.u, v: pos.v });
    armed = firstFree();
    commit();
    say(lenses.length === 1 && armed !== null ? (armed + 1) + '번 ' + KINDS[armed] + ' 스티커도 붙여 볼까요?' : '');
  }

  // ---- pointer: tap / drag from the tray, drag a placed sticker, tap the photo ----
  var drag = null, justDragged = false;
  function ghostAt(x, y) {
    var r = document.querySelector('.phone').getBoundingClientRect(), sc = r.width / 375;
    drag.ghost.style.left = ((x - r.left) / sc - R) + 'px'; drag.ghost.style.top = ((y - r.top) / sc - R) + 'px';
  }
  tray.addEventListener('pointerdown', function (e) {
    var b = e.target.closest('.tray-item'); if (!b) return;
    e.preventDefault();
    drag = { from: 'tray', k: +b.dataset.k, x: e.clientX, y: e.clientY, moved: false, ghost: null };
    b.setPointerCapture(e.pointerId);
  });
  layer.addEventListener('pointerdown', function (e) {
    var b = e.target.closest('.lens'); if (!b) return;
    e.stopPropagation();
    drag = { from: 'photo', k: +b.dataset.k, x: e.clientX, y: e.clientY, moved: false, el: b };
    b.setPointerCapture(e.pointerId);
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    drag.moved = true;
    if (drag.from === 'tray') {
      if (!drag.ghost) {
        drag.ghost = document.createElement('div'); drag.ghost.className = 'lens ghost';
        drag.ghost.innerHTML = '<span class="ring"></span><span class="n">' + (drag.k + 1) + '</span>';
        document.querySelector('.phone').appendChild(drag.ghost);
      }
      ghostAt(e.clientX, e.clientY);
    } else {
      var p = map.toBox.apply(null, (function () { var q = at(e.clientX, e.clientY); return [q.u, q.v]; })());
      drag.el.classList.add('dragging');
      drag.el.style.left = (p.x - R) + 'px'; drag.el.style.top = (p.y - R) + 'px';
    }
  });
  document.addEventListener('pointerup', function (e) {
    if (!drag) return;
    var d = drag; drag = null;
    if (d.ghost) d.ghost.remove();
    if (d.from === 'tray') {
      if (d.moved) { if (inside(e.clientX, e.clientY)) put(d.k, at(e.clientX, e.clientY)); return; }
      // tap: placed → take it off (and hold it again), not placed → hold it
      var s = placed(d.k);
      if (s) { lenses = lenses.filter(function (x) { return x !== s; }); armed = d.k; commit(); say('사진을 눌러 다시 붙여요.'); }
      else { armed = d.k; render(); say(''); }
      return;
    }
    if (d.moved) { put(d.k, at(e.clientX, e.clientY)); justDragged = true; setTimeout(function () { justDragged = false; }, 0); }
  });
  // no native image drag (it would cancel the pointer and the sticker drag)
  document.addEventListener('dragstart', function (e) { if (e.target.closest('.tray, .photo')) e.preventDefault(); });
  document.addEventListener('pointercancel', function () { if (drag && drag.ghost) drag.ghost.remove(); drag = null; render(); });
  photo.addEventListener('click', function (e) {
    if (justDragged || e.target.closest('.lens')) return;
    if (armed === null) { armed = firstFree(); if (armed === null) { say('스티커를 끌어서 옮길 수 있어요.'); return; } }
    put(armed, at(e.clientX, e.clientY));
  });

  // 다음 stays grey (aria-disabled) until at least one sticker is on the photo

  armed = firstFree();
  renderTray(); say('');
  L.photoSize(function (iw, ih) { map = L.cover(W, H, iw, ih); renderLenses(); });
})();
</script>
</body></html>
