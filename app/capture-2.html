<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICO · 촬영 2 렌즈 스티커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  /* Figma 3.1.2 (2855:14593): photo 335x200 at (20, 232) — same box as 3.1.3, so stickers keep their spot */
  .step-title .sub { white-space: nowrap; }
  .photo { position: absolute; left: 20px; top: 232px; width: 335px; height: 200px; background: var(--surface); border: 1px solid var(--ink); cursor: crosshair; touch-action: none; overflow: hidden; }
  .photo.has-photo { background-position: center; background-size: cover; background-repeat: no-repeat; }
  .photo .lens { cursor: grab; animation: pop .22s ease-out; }
  .photo .lens.dragging { cursor: grabbing; animation: none; transform: scale(1.12); z-index: 3; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }
  .ghost { position: absolute; z-index: 30; pointer-events: none; transform: scale(1.12); }

  /* Figma 버튼 (2884:4619): 70px 칸 4개, 20px 여백으로 양끝 정렬 (top 449)
     미선택 = 기본 바탕 · 클릭만(고른 스티커) = 밝은 바탕 · 완료(사진에 붙임) = 올리브 + 검은 그림자 5/5 */
  .kinds { position: absolute; left: 0; top: 449px; width: 375px; padding: 0 20px; display: flex; justify-content: space-between; align-items: flex-start; }
  .kbtn { width: 70px; display: flex; flex-direction: column; align-items: center; gap: 5px; touch-action: none; }
  .kbtn .sq { position: relative; width: 70px; height: 70px; background: var(--bg); border: 1px solid var(--ink); transition: background-color .3s cubic-bezier(.25, .6, .07, 1); }
  .kbtn .sq::before { content: ''; position: absolute; left: 4px; top: 4px; width: 70px; height: 70px; background: var(--ink); border: 1px solid var(--ink); z-index: -1; opacity: 0; }
  .kbtn .idle { position: absolute; left: 8.5px; top: 8.5px; width: 47px; height: 47px; pointer-events: none; -webkit-user-drag: none; }
  .kbtn .idle-n { position: absolute; left: 44px; top: 41px; width: 10px; font-size: 12px; line-height: normal; text-align: center; }
  .kbtn .lens { left: 13px; top: 13px; pointer-events: none; }
  .kbtn .lbl { font-size: 16px; line-height: normal; white-space: nowrap; }
  .kbtn[aria-pressed="true"] .sq { background: var(--surface); }
  .kbtn.done .sq { background: var(--brand-soft); }
  .kbtn.done .sq::before { opacity: 1; }
  .kbtn.done .lbl { margin-top: 4px; }
  .kbtn:focus-visible { outline: none; }
  .kbtn:focus-visible .sq { outline: 2px solid var(--ink); outline-offset: 3px; }

  /* Figma 촬영 02 맨트 (2884:5571): 종류 · 안내, 가운데 정렬 (top 558) */
  .say { position: absolute; left: 0; top: 558px; width: 375px; display: flex; gap: 8px; align-items: center; justify-content: center; font-size: 14px; line-height: normal; white-space: nowrap; }
  .say .dot { width: 12px; font-size: 16px; text-align: center; }

  .reset { position: absolute; left: 323px; top: 656px; width: 32px; height: 32px; }
  .reset img { width: 32px; height: 32px; transition: transform .3s; }
  .reset:active img { transform: rotate(-90deg); }
  .photo img { -webkit-user-drag: none; }
</style>
</head><body>
<div class="phone" style="--h:812px">

  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav">
      <a href="capture-1.html" aria-label="뒤로"><img class="icon" src="assets/icons/outline/arrow-left.svg" alt=""></a>
      <a href="home.html" aria-label="닫기" data-confirm="관찰을 중단할까요?"><img class="icon" src="assets/icons/outline/close.svg" alt=""></a>
    </div>
  </div>

  <div class="progress" aria-label="5단계 중 2단계"><span class="on"></span><span class="on"></span><span></span><span></span><span></span></div>

  <div class="step-title">
    <p class="q"><span>02.</span><span>어디가 궁금했나요?</span></p>
    <p class="sub">사진에서 궁금한 곳을 눌러 렌즈 스티커를 붙여요.</p>
  </div>

  <div class="photo" id="photo" data-photo aria-label="촬영한 사진 · 누른 곳에 스티커가 붙어요"><div class="lens-layer" id="layer"></div></div>

  <div class="kinds" id="kinds" role="group" aria-label="렌즈 스티커"></div>
  <p class="say" id="say" aria-live="polite"><span id="sayKind">모양</span><span class="dot">·</span><span id="sayLine">어떤 생김새인지 궁금한 곳에 붙여요.</span></p>

  <button class="reset" id="reset" type="button" aria-label="스티커 모두 떼기"><img src="assets/icons/outline/refresh.svg" alt=""></button>

  <a class="cta step" id="next" href="capture-3.html" aria-disabled="true"><span class="cta-face">다음 <img src="assets/icons/outline/arrow-right.svg" alt=""></span></a>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script src="photo.js"></script>
<script src="stickers.js"></script>
<script>
(function () {
  // 버튼에서 스티커를 고르고 → 사진에서 궁금한 곳을 누르거나 끌어다 놓아요. 붙인 스티커는 끌어서 옮길 수 있어요.
  // 붙인 스티커를 다른 곳으로 옮기려면 그 버튼을 다시 누르고 사진을 눌러요. 새로고침 버튼은 모두 떼어요.
  var L = PicoLens, KINDS = L.KINDS, LABELS = L.LABELS, LINES = L.LINES, R = L.R;
  var photo = document.getElementById('photo'), layer = document.getElementById('layer');
  var kinds = document.getElementById('kinds'), next = document.getElementById('next');
  var lenses = L.load();          // [{k, u, v}]
  var armed = null, focus = 0, map = null;
  var W = 333, H = 198;           // photo padding box (same as 3·5단계)

  function placed(k) { for (var i = 0; i < lenses.length; i++) if (lenses[i].k === k) return lenses[i]; return null; }
  function firstFree() { for (var k = 0; k < 4; k++) if (!placed(k)) return k; return null; }

  // 버튼 아래 한 줄: 지금 고른 스티커(없으면 마지막으로 붙인 스티커) 안내
  function renderSay() {
    document.getElementById('sayKind').textContent = LABELS[focus];
    document.getElementById('sayLine').textContent = LINES[focus];
  }
  function renderKinds() {
    kinds.innerHTML = LABELS.map(function (name, k) {
      var done = !!placed(k), on = armed === k;
      var face = done
        ? '<span class="lens">' + L.inner(k, true) + '</span>'
        : '<img class="idle" src="assets/capture/s2-tray-sticker-off.png" alt=""><span class="idle-n">' + (k + 1) + '</span>';
      return '<button type="button" class="kbtn' + (done ? ' done' : '') + '" data-k="' + k + '" aria-pressed="' + on + '"' +
        ' aria-label="' + (k + 1) + '. ' + name + ' 스티커' + (done ? ' · 붙였어요' : '') + '">' +
        '<span class="sq">' + face + '</span><span class="lbl">' + name + '</span></button>';
    }).join('');
    renderSay();
    next.setAttribute('aria-disabled', lenses.length ? 'false' : 'true');
  }
  function renderLenses() {
    if (!map) return;
    layer.innerHTML = lenses.map(function (s) {
      var p = map.toBox(s.u, s.v);
      return L.html(s.k, p.x, p.y, { on: true, attrs: ' aria-label="' + (s.k + 1) + '. ' + LABELS[s.k] + ' 스티커 · 끌어서 옮기기"' });
    }).join('');
  }
  function render() { renderKinds(); renderLenses(); }
  function commit() { L.save(lenses); render(); }

  // 칸 안 좌표 → 사진 좌표 (스티커가 칸 밖으로 나가지 않게)
  function at(clientX, clientY) {
    var r = photo.getBoundingClientRect(), sc = r.width / (W + 2);
    var x = L.clamp((clientX - r.left) / sc - 1, R, W - R + 1), y = L.clamp((clientY - r.top) / sc - 1, R, H - R + 1);
    return map.toImg(x, y);
  }
  function inside(clientX, clientY) {
    var r = photo.getBoundingClientRect();
    return clientX >= r.left && clientX <= r.right && clientY >= r.top && clientY <= r.bottom;
  }
  function put(k, pos) {
    var s = placed(k);
    if (s) { s.u = pos.u; s.v = pos.v; } else lenses.push({ k: k, u: pos.u, v: pos.v });
    focus = k;
    armed = firstFree();
    if (armed !== null) focus = armed;
    commit();
  }
  function arm(k) { armed = k; focus = k; render(); }

  // ---- pointer: tap / drag from a button, drag a placed sticker, tap the photo ----
  var drag = null, justDragged = false;
  function ghostAt(x, y) {
    var r = document.querySelector('.phone').getBoundingClientRect(), sc = r.width / 375;
    drag.ghost.style.left = ((x - r.left) / sc - R) + 'px'; drag.ghost.style.top = ((y - r.top) / sc - R) + 'px';
  }
  kinds.addEventListener('pointerdown', function (e) {
    var b = e.target.closest('.kbtn'); if (!b) return;
    e.preventDefault();
    drag = { from: 'kinds', k: +b.dataset.k, x: e.clientX, y: e.clientY, moved: false, ghost: null };
    b.setPointerCapture(e.pointerId);
  });
  // keyboard: Enter / Space on a button picks that sticker
  kinds.addEventListener('click', function (e) { var b = e.target.closest('.kbtn'); if (b && e.detail === 0) arm(+b.dataset.k); });
  layer.addEventListener('pointerdown', function (e) {
    var b = e.target.closest('.lens'); if (!b) return;
    e.stopPropagation();
    drag = { from: 'photo', k: +b.dataset.k, x: e.clientX, y: e.clientY, moved: false, el: b };
    b.setPointerCapture(e.pointerId);
  });
  document.addEventListener('pointermove', function (e) {
    if (!drag) return;
    if (!drag.moved && Math.hypot(e.clientX - drag.x, e.clientY - drag.y) < 6) return;
    drag.moved = true;
    if (drag.from === 'kinds') {
      if (!drag.ghost) {
        drag.ghost = document.createElement('div'); drag.ghost.className = 'lens ghost';
        drag.ghost.innerHTML = L.inner(drag.k, true);
        document.querySelector('.phone').appendChild(drag.ghost);
      }
      ghostAt(e.clientX, e.clientY);
    } else {
      var q = at(e.clientX, e.clientY), p = map.toBox(q.u, q.v);
      drag.el.classList.add('dragging');
      drag.el.style.left = (p.x - R) + 'px'; drag.el.style.top = (p.y - R) + 'px';
    }
  });
  document.addEventListener('pointerup', function (e) {
    if (!drag) return;
    var d = drag; drag = null;
    if (d.ghost) d.ghost.remove();
    if (d.from === 'kinds') {
      if (d.moved) { if (inside(e.clientX, e.clientY)) put(d.k, at(e.clientX, e.clientY)); return; }
      arm(d.k);
      return;
    }
    if (d.moved) { put(d.k, at(e.clientX, e.clientY)); justDragged = true; setTimeout(function () { justDragged = false; }, 0); }
  });
  // no native image drag (it would cancel the pointer and the sticker drag)
  document.addEventListener('dragstart', function (e) { if (e.target.closest('.kinds, .photo')) e.preventDefault(); });
  document.addEventListener('pointercancel', function () { if (drag && drag.ghost) drag.ghost.remove(); drag = null; render(); });
  photo.addEventListener('click', function (e) {
    if (justDragged || e.target.closest('.lens')) return;
    if (armed === null) { armed = firstFree(); if (armed === null) return; }
    put(armed, at(e.clientX, e.clientY));
  });
  document.getElementById('reset').addEventListener('click', function () {
    window.picoSwap(function () { lenses = []; armed = 0; focus = 0; commit(); });
  });

  // 다음 stays grey (aria-disabled) until at least one sticker is on the photo
  armed = firstFree();
  focus = armed === null ? (lenses.length ? lenses[lenses.length - 1].k : 0) : armed;
  renderKinds();
  L.photoSize(function (iw, ih) { map = L.cover(W, H, iw, ih); renderLenses(); });
})();
</script>
</body></html>
