<!doctype html>
<html lang="ko"><head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>PICO · 촬영 2 렌즈 스티커</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500&display=swap" rel="stylesheet">
<link rel="stylesheet" href="base.css">
<style>
  .photo { position: absolute; left: 20px; top: 231.85px; width: 335px; height: 335px; background: var(--surface); border: 1px solid var(--ink); }
  .placed { position: absolute; width: 45px; height: 45px; z-index: 2; animation: pop .22s ease-out; }
  .placed img { width: 45px; height: 45px; }
  @keyframes pop { from { transform: scale(.4); opacity: 0; } to { transform: scale(1); opacity: 1; } }

  .tray { position: absolute; left: 20.56px; top: 576.85px; display: flex; gap: 18px; align-items: flex-start; }
  .tray-item { width: 69.861px; display: flex; flex-direction: column; align-items: center; gap: 10px; }
  .tray-item img { width: 69.861px; height: 69.861px; }
  .tray-item span { font-size: 12px; line-height: 19px; text-align: center; white-space: nowrap; }
  .tray-item.shake img { animation: shake .3s; }
  @keyframes shake { 25% { transform: translateX(-4px); } 75% { transform: translateX(4px); } }
</style>
</head><body>
<div class="phone" style="--h:812px">

  <div class="top">
    <div class="status"><span class="status-time">9:41</span>
      <span class="status-icons"><img class="sig" src="assets/common/signal.png" alt=""><img class="wifi" src="assets/common/wifi.png" alt=""><img class="bat" src="assets/common/battery.png" alt=""></span></div>
    <div class="nav">
      <a href="capture-1.html" aria-label="뒤로"><img class="icon" src="assets/capture/s2-icon-back.png" alt=""></a>
      <a href="home.html" aria-label="닫기"><img class="icon" src="assets/capture/s2-icon-close.png" alt=""></a>
    </div>
  </div>

  <div class="progress" aria-label="5단계 중 2단계"><span class="on"></span><span class="on"></span><span></span><span></span><span></span></div>

  <div class="step-title">
    <p class="q"><span>02.</span><span>어디가 궁금했나요?</span></p>
    <p class="sub">궁금한 곳에 2~3개 정도 렌즈 스티커를 붙여보세요.</p>
  </div>

  <div class="photo" aria-label="촬영한 사진"></div>
  <div id="placedLayer"></div>

  <div class="tray" id="tray" role="group" aria-label="렌즈 스티커"></div>

  <a class="cta" href="capture-3.html" style="top:699.5px"><span class="cta-face">다음 <img src="assets/common/arrow-right.png" alt=""></span></a>

  <img class="home-ind" src="assets/common/home-indicator.png" alt="">
</div>
<script src="shared.js"></script>
<script>
  // Sticker slots on the photo (positions from frame 3.1.3, max 3)
  var SLOTS = [{ x: 63, y: 273.9 }, { x: 210, y: 361 }, { x: 280.53, y: 261.26 }];
  var KINDS = ['생김새', '움직임', '사는 곳', '관계'];
  var KEY = 'pico.capture.stickers';
  var slots = [null, null, null];   // slot index -> kind index
  try { var saved = JSON.parse(sessionStorage.getItem(KEY) || 'null'); if (Array.isArray(saved) && saved.length === 3) slots = saved; } catch (e) {}

  var tray = document.getElementById('tray'), layer = document.getElementById('placedLayer');
  function save() { try { sessionStorage.setItem(KEY, JSON.stringify(slots)); } catch (e) {} }
  function render() {
    tray.innerHTML = KINDS.map(function (k, i) {
      var on = slots.indexOf(i) > -1;
      return '<button class="tray-item" data-kind="' + i + '" aria-pressed="' + on + '">' +
        '<img src="assets/capture/' + (on ? 's2-sticker-tray-placed.png' : 's2-sticker-tray.png') + '" alt="">' +
        '<span>' + (i + 1) + '. ' + k + '</span></button>';
    }).join('');
    layer.innerHTML = slots.map(function (k, s) {
      if (k === null) return '';
      return '<button class="placed" data-slot="' + s + '" style="left:' + SLOTS[s].x + 'px;top:' + SLOTS[s].y + 'px" aria-label="' + KINDS[k] + ' 스티커 떼기"><img src="assets/capture/s3-sticker.png" alt=""></button>';
    }).join('');
  }
  tray.addEventListener('click', function (e) {
    var b = e.target.closest('.tray-item'); if (!b) return;
    var k = +b.dataset.kind, at = slots.indexOf(k);
    if (at > -1) slots[at] = null;
    else {
      var free = slots.indexOf(null);
      if (free < 0) { b.classList.remove('shake'); void b.offsetWidth; b.classList.add('shake'); return; }
      slots[free] = k;
    }
    save(); render();
  });
  layer.addEventListener('click', function (e) {
    var p = e.target.closest('.placed'); if (!p) return;
    slots[+p.dataset.slot] = null; save(); render();
  });
  render();
</script>
</body></html>
