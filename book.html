<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>PICO · 도감</title>
<meta name="theme-color" content="#221B17" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&family=Asta+Sans:wght@400;600;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="home-map.css" />
<link rel="stylesheet" href="pico-icons.css" />
<link rel="stylesheet" href="pico-pages.css" />
<link rel="stylesheet" href="pico-book.css" />
</head>
<body>
<!-- Figma: 도감 2302:10565 · 오늘의 PICO 백과 시트 2332:10140
     이미지 파일은 assets/book/ (없으면 임시 텍스처로 보여요) -->
<div class="mh-phone pg-phone bk2" id="book">
  <img class="pg-bg" src="assets/book/paper-bg.png" onerror="this.onerror=null;this.src='assets/discover/paper-bg.png'" alt="" />

  <div class="pg-status bk2-status" aria-hidden="true">
    <span class="pg-status-time">9:41</span>
    <span class="pg-status-icons">
      <img src="assets/home-map/signal.svg" width="18" height="10" alt="" />
      <img src="assets/home-map/wifi.svg" width="16" height="11" alt="" />
      <img src="assets/home-map/battery.svg" width="27" height="13" alt="" />
    </span>
  </div>
  <header class="bk2-gnb">
    <h1 class="bk2-title">도감</h1>
    <a class="bk2-gnb-icon" href="search.html" aria-label="곤충 찾기"><span class="pi pi-search" aria-hidden="true"></span></a>
  </header>

  <main class="bk2-scroll">
    <!-- 백과 카드 배너 -->
    <section class="bk2-banner" aria-labelledby="bk2-q">
      <img class="bk2-banner-bg" src="assets/book/banner-green.png" onerror="this.onerror=null;this.src='assets/discover/paper-green.png'" alt="" />
      <div class="bk2-banner-body">
        <span class="bk2-tag-paper">백과 카드</span>
        <p class="bk2-banner-q" id="bk2-q"></p>
        <div class="bk2-chips" id="bk2-chips"></div>
      </div>
      <button class="bk2-more" id="bk2-more">
        <img class="bk2-more-bg" src="assets/book/banner-more.png" onerror="this.remove()" alt="" />
        <span>더 알아보기</span><span class="pi pi-arrow-right" style="--pi-size:20px" aria-hidden="true"></span>
      </button>
    </section>

    <!-- 총 n개 · 추천순 · 필터 -->
    <div class="bk2-bar">
      <p class="bk2-total torn-dark" id="bk2-total"></p>
      <div class="bk2-sort torn-dark">
        <button id="bk2-sort">추천순<span class="pi pi-arrow-down" aria-hidden="true"></span></button>
        <button id="bk2-filter">필터<span class="pi pi-sliders" aria-hidden="true"></span></button>
      </div>
    </div>

    <!-- 카드 그리드 -->
    <div class="bk2-grid" id="bk2-grid"></div>
  </main>

  <nav class="pg-tabbar">
    <img class="pg-tabbar-bg" src="assets/discover/paper-bottom-dark.png" alt="" />
    <div class="mh-tabs">
      <a class="mh-tab is-current" href="book.html" aria-label="도감" aria-current="page"><span class="pi pi-tag" aria-hidden="true"></span></a>
      <a class="mh-tab mh-tab--camera" href="discover.html" aria-label="카메라로 발견하기"><span class="pi pi-home-favorite" aria-hidden="true"></span></a>
      <a class="mh-tab" href="ranking.html" aria-label="랭킹"><span class="pi pi-heart" aria-hidden="true"></span></a>
    </div>
  </nav>

  <!-- 오늘의 PICO 백과 (더 알아보기) -->
  <div class="bk2-dim" id="today-dim"></div>
  <section class="bk2-today" id="today" role="dialog" aria-modal="true" aria-labelledby="today-title">
    <img class="bk2-today-bg" src="assets/book/sheet-green.png" onerror="this.onerror=null;this.src='assets/discover/paper-green.png'" alt="" />
    <span class="bk2-handle" aria-hidden="true"></span>
    <div class="bk2-today-body">
      <h2 class="bk2-today-title" id="today-title">오늘의 PICO 백과</h2>
      <div class="bk2-today-text">
        <p class="bk2-today-q" id="today-q"></p>
        <p class="bk2-today-a" id="today-a"></p>
      </div>
      <div class="bk2-today-tip">
        <p><b>PICO TIP</b></p>
        <ul><li id="today-tip"></li></ul>
      </div>
    </div>
  </section>
  <div class="bk2-today-foot" id="today-foot">
    <img class="pg-tabbar-bg" src="assets/discover/paper-bottom-dark.png" alt="" />
    <a class="bk2-today-go" href="discover.html">찾으러 가보기<span class="pi pi-arrow-right" style="--pi-size:20px" aria-hidden="true"></span></a>
  </div>

  <!-- 카드 상세 (렌즈 · 찜하기) -->
  <div class="bk-dim" id="bk-dim"></div>
  <section class="bk-sheet" id="bk-sheet" role="dialog" aria-modal="true" aria-labelledby="bk-sheet-name">
    <div class="bk-grab"></div>
    <button class="bk-save" id="bk-save" aria-pressed="false" aria-label="찜하기">
      <span class="pi pi-bookmark bk-save-off" aria-hidden="true"></span>
      <img class="bk-save-on" src="assets/icons/bookmark-saved.svg" width="32" height="32" alt="" />
    </button>
    <div class="bk-sheet-top">
      <div class="bk-sheet-pic bk2-sheet-pic" id="bk-sheet-pic"></div>
      <div>
        <p class="bk-sheet-cat" id="bk-sheet-cat"></p>
        <h2 class="bk-sheet-name" id="bk-sheet-name"></h2>
        <p class="bk-sheet-meta" id="bk-sheet-meta"></p>
      </div>
    </div>
    <ul class="bk-lenses" id="bk-lenses"></ul>
    <p class="bk-sheet-hint" id="bk-sheet-hint"></p>
    <a class="bk-sheet-go" href="discover.html">다시 관찰하러 가기</a>
  </section>
</div>

<script src="pico-book-data.js"></script>
<script>
(() => {
  const { BOOK, TODAY, TOTAL } = window.PicoBook;
  const $ = (id) => document.getElementById(id);

  // 배너 · 오늘의 백과
  $('bk2-q').textContent = TODAY.question;
  $('bk2-chips').innerHTML = TODAY.tags.map((t) => `<span class="bk2-tag-dark">${t}</span>`).join('');
  $('today-q').textContent = TODAY.question;
  $('today-a').innerHTML = TODAY.body.join('<br />');
  $('today-tip').textContent = TODAY.tip;
  $('bk2-total').innerHTML = `총 <b>${TOTAL}</b>개`;

  // 카드
  const grid = $('bk2-grid');
  let order = BOOK.slice();
  function render() {
    grid.innerHTML = order.map((b, i) => `
      <button class="bk2-card" data-id="${b.id}" style="animation-delay:${i * 0.03}s" aria-label="${b.cat} ${b.name}">
        <img class="bk2-card-photo" src="${b.photo}" alt="" onerror="this.closest('.bk2-card').classList.add('no-photo');this.remove()" />
        <span class="bk2-lv"><small>lv</small>${b.lv}</span>
        <span class="bk2-card-text"><b>[${b.cat}]</b><span>${b.name}</span></span>
      </button>`).join('');
  }
  render();
  grid.addEventListener('click', (e) => {
    const card = e.target.closest('.bk2-card');
    if (card) openCard(BOOK.find((b) => b.id === card.dataset.id));
  });

  // 추천순 ↔ 이름순
  const sortBtn = $('bk2-sort');
  sortBtn.addEventListener('click', () => {
    const byName = sortBtn.firstChild.textContent === '추천순';
    sortBtn.firstChild.textContent = byName ? '이름순' : '추천순';
    order = byName ? BOOK.slice().sort((a, b) => a.name.localeCompare(b.name, 'ko')) : BOOK.slice();
    render();
  });

  // 오늘의 PICO 백과 시트
  const book = $('book');
  const setToday = (on) => book.classList.toggle('is-today', on);
  $('bk2-more').addEventListener('click', () => setToday(true));
  $('today-dim').addEventListener('click', () => setToday(false));

  // 카드 상세
  const LENSES = [['LOOK', '생김새'], ['MOVE', '움직임'], ['PLACE', '사는 곳'], ['BEHAVIOR', '느낌']];
  const dim = $('bk-dim');
  const sheet = $('bk-sheet');
  let current = null;
  let saved = [];
  try { saved = JSON.parse(localStorage.getItem('pico.book.saved') || '[]'); } catch (e) { saved = []; }
  function openCard(b) {
    current = b;
    $('bk-sheet-pic').innerHTML = `<img src="${b.photo}" alt="" onerror="this.remove()" />`;
    $('bk-sheet-cat').textContent = `[ ${b.cat} ]`;
    $('bk-sheet-name').textContent = b.name;
    $('bk-sheet-meta').innerHTML = `LV <b>${b.lv}</b> · 관찰 렌즈 <b>${b.lens}/4</b>`;
    $('bk-lenses').innerHTML = LENSES.map(([k, l], i) => `<li class="${i < b.lens ? 'on' : ''}"><strong>${k}</strong><small>${l}</small></li>`).join('');
    $('bk-sheet-hint').textContent = b.lens < 4 ? `힌트 · ${b.hint}` : '모든 렌즈를 채웠어요. 멋진 관찰가!';
    syncSave();
    dim.classList.add('is-open');
    sheet.classList.add('is-open');
  }
  const closeCard = () => { dim.classList.remove('is-open'); sheet.classList.remove('is-open'); };
  dim.addEventListener('click', closeCard);
  document.addEventListener('keydown', (e) => { if (e.key === 'Escape') { closeCard(); setToday(false); } });

  const saveBtn = $('bk-save');
  function syncSave() {
    const on = !!current && saved.includes(current.id);
    saveBtn.setAttribute('aria-pressed', on);
    saveBtn.setAttribute('aria-label', on ? '찜 해제하기' : '찜하기');
  }
  saveBtn.addEventListener('click', () => {
    if (!current) return;
    saved = saved.includes(current.id) ? saved.filter((x) => x !== current.id) : [...saved, current.id];
    try { localStorage.setItem('pico.book.saved', JSON.stringify(saved)); } catch (e) { /* 무시 */ }
    syncSave();
  });

  // 검색에서 넘어온 경우: book.html?open=c01
  const openId = new URLSearchParams(location.search).get('open');
  if (openId) { const b = BOOK.find((x) => x.id === openId); if (b) setTimeout(() => openCard(b), 300); }
})();
</script>
</body>
</html>
