
<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>PICO</title>

<!-- PWA -->
<link rel="manifest" href="manifest.json" />
<meta name="theme-color" content="#2A0E0B" />
<meta name="apple-mobile-web-app-capable" content="yes" />
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent" />
<meta name="apple-mobile-web-app-title" content="PICO" />
<link rel="apple-touch-icon" href="icons/icon-192.png" />

<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Space+Grotesk:wght@400;500;700&display=swap" rel="stylesheet">

<link rel="stylesheet" href="style.css" />
</head>
<body>

  <!-- 393x852 device frame. 배포 후에는 이 영역이 폰 화면 전체를 채웁니다. -->
  <div class="device-frame" id="app-root">

    <div class="status-bar">
      <span class="time">9:41</span>
      <span class="status-icons">•••</span>
    </div>

    <!-- ===================================================== -->
    <!-- 여기부터가 실제 화면 영역입니다.                          -->
    <!-- Figma에서 화면을 넘겨주시면 이 안에 하나씩 붙여넣을게요.     -->
    <!-- ===================================================== -->
    <main class="screen" id="screen-home">
      <div class="home-bg"></div>

      <div class="home-topnav">
        <img class="home-logo" src="https://www.figma.com/api/mcp/asset/25902ce1-6a8c-4bdf-8b57-023a9bf2045f.png" alt="PICO" />
        <div class="home-topnav-icons">
          <img src="https://www.figma.com/api/mcp/asset/af59a639-3b93-48c1-a468-180ecef08384.svg" alt="알림" />
          <img src="https://www.figma.com/api/mcp/asset/0d8e618a-0359-4bdd-a3fc-cd8e929014c9.svg" alt="공유" />
        </div>
      </div>

      <section class="mission-card">
        <div class="mission-card-bg" style="background-image:url('https://www.figma.com/api/mcp/asset/a0d20a19-a59b-4e72-b0f8-c4f84048ed43.png')"></div>
        <div class="mission-card-body">
          <div class="mission-tag">
            <img src="https://www.figma.com/api/mcp/asset/9f2ceb24-31cd-4454-b11c-074b2a193ada.svg" alt="" />
            <span>오늘의 미션</span>
          </div>
          <p class="mission-title">학교 주변의 배추흰나비를 관찰해보세요!</p>
          <div class="mission-location">
            <img src="https://www.figma.com/api/mcp/asset/05bae509-dc32-407f-bcf2-a2ff71710edd.svg" alt="" />
            <span>어울 초등학교 · 반경 300m</span>
          </div>
        </div>
        <button class="mission-cta" style="background-image:url('https://www.figma.com/api/mcp/asset/17ec6fca-fbd2-48d3-b2d1-9061725759bc.png')">
          탐험 시작하기
          <img src="https://www.figma.com/api/mcp/asset/c975a991-bbf1-465d-8234-34c63d8d7132.svg" alt="" />
        </button>
      </section>

      <section class="field-header">
        <h2>나만의 들판</h2>
        <div class="field-hint">
          <img src="https://www.figma.com/api/mcp/asset/e45ed185-327c-4b99-a847-8a5182bba98d.svg" alt="" />
          <span>발견할수록, 들판이 더 살아나요.</span>
          <img class="field-arrow" src="https://www.figma.com/api/mcp/asset/c975a991-bbf1-465d-8234-34c63d8d7132.svg" alt="" />
        </div>
      </section>

      <section class="field-area">
        <!-- 컬렉션/발견 콘텐츠가 이 안에 채워질 예정 -->
      </section>
    </main>

    <nav class="tab-bar">
      <button class="tab active" data-tab="home">홈</button>
      <button class="tab" data-tab="map">맵</button>
      <button class="tab camera-btn" data-tab="camera" aria-label="카메라"></button>
      <button class="tab" data-tab="collection">도감</button>
      <button class="tab" data-tab="badges">뱃지</button>
    </nav>

  </div>

  <script src="app.js"></script>
</body>
</html>
