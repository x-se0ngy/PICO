<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover, user-scalable=no" />
<title>PICO · 탐험가 랭킹</title>
<meta name="theme-color" content="#221B17" />
<link rel="manifest" href="manifest.json" />
<link rel="preconnect" href="https://cdn.jsdelivr.net" />
<link rel="stylesheet" as="style" crossorigin href="https://cdn.jsdelivr.net/gh/orioncactus/pretendard/dist/web/static/pretendard.css" />
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@500;700&display=swap" rel="stylesheet" />
<link rel="stylesheet" href="home-map.css" />
<link rel="stylesheet" href="pico-pages.css" />
</head>
<body>
<div class="mh-phone pg-phone" id="ranking">
  <img class="pg-bg" src="assets/discover/paper-bg.png" alt="" />

  <div class="pg-status" aria-hidden="true">
    <span class="pg-status-time">9:41</span>
    <span class="pg-status-icons">
      <img src="assets/home-map/signal.svg" width="18" height="10" alt="" />
      <img src="assets/home-map/wifi.svg" width="16" height="11" alt="" />
      <img src="assets/home-map/battery.svg" width="27" height="13" alt="" />
    </span>
  </div>
  <div class="pg-gnb">
    <a href="index.html" aria-label="들판으로 돌아가기"><img src="assets/discover/icon-back.svg" width="22" height="22" alt="" /></a>
  </div>

  <header class="pg-head">
    <div class="pg-head-row"><span class="pg-badge">RANKING</span></div>
    <h1 class="pg-title">이번 주 탐험가</h1>
    <p class="pg-sub" id="rk-sub">이번 주에 피코를 가장 많이 만난 친구들이에요</p>
  </header>

  <div class="rk-seg" role="group" aria-label="랭킹 범위">
    <button aria-pressed="true" data-scope="friends">친구</button>
    <button aria-pressed="false" data-scope="class">우리 반</button>
  </div>

  <main class="pg-scroll rk-scroll">
    <div class="rk-podium" id="rk-podium"></div>
    <div class="rk-list" id="rk-list"></div>
  </main>

  <div class="rk-me" id="rk-me"></div>

  <nav class="pg-tabbar">
    <img class="pg-tabbar-bg" src="assets/discover/paper-bottom-dark.png" alt="" />
    <div class="mh-tabs">
      <a class="mh-tab" href="book.html" aria-label="도감"><img src="assets/home-map/tab-folder.svg" width="23" height="20" alt="" /></a>
      <a class="mh-tab mh-tab--camera" href="discover.html" aria-label="카메라로 발견하기"><img src="assets/home-map/tab-camera.svg" width="31" height="24" alt="" /></a>
      <a class="mh-tab is-current" href="ranking.html" aria-label="랭킹" aria-current="page"><img src="assets/home-map/tab-trophy.svg" width="21" height="22" alt="" /></a>
    </div>
  </nav>
</div>

<script src="pico-species.js"></script>
<script>
(() => {
  // 크레파스 색 (발견하기 화면과 같은 팔레트)
  const COLORS = ['#F6D34C', '#9BC641', '#3DB8C1', '#F28A3B', '#E43B45', '#6B45B9', '#2F6ED8'];
  const TAGS = ['숲속 탐험가', '꽃밭 관찰가', '물가 탐험가', '새싹 탐험가', '풀숲 수사대'];

  // 시연용 친구 데이터 (이번 주 만난 피코 수)
  const PEOPLE = {
    friends: [
      ['하윤', 14], ['도윤', 11], ['서아', 9], ['지호', 7], ['이안', 6], ['수아', 5], ['민준', 3], ['예린', 2],
    ],
    class: [
      ['채원', 18], ['하윤', 14], ['건우', 13], ['도윤', 11], ['서아', 9], ['유나', 8], ['지호', 7],
      ['이안', 6], ['수아', 5], ['태오', 4], ['민준', 3], ['예린', 2],
    ],
  };

  // 나 = 도감에서 만난 친구 수
  const myCount = window.PicoSpecies.collection().filter((s) => s.found).length;

  const ava = (name, i, cls = '') =>
    `<span class="rk-ava ${cls}" style="background:${COLORS[i % COLORS.length]}">${name[0]}</span>`;

  function render(scope) {
    const rows = PEOPLE[scope].map(([name, count], i) => ({ name, count, color: i, tag: TAGS[i % TAGS.length] }));
    rows.push({ name: '나', count: myCount, me: true, tag: '새싹 탐험가' });
    rows.sort((a, b) => b.count - a.count || (a.me ? 1 : -1));
    rows.forEach((r, i) => { r.rank = i + 1; });

    // 시상대 (2 · 1 · 3 순서)
    const top = [rows[1], rows[0], rows[2]];
    document.getElementById('rk-podium').innerHTML = top.map((r) => `
      <div class="rk-pod is-${r.rank}">
        <span class="rk-crown">${r.rank === 1 ? '👑' : ''}</span>
        ${ava(r.name, r.me ? 3 : r.color)}
        <span class="rk-pod-name">${r.name}</span>
        <span class="rk-pod-count">${r.count}마리</span>
        <span class="rk-block">${r.rank}</span>
      </div>`).join('');

    const row = (r) => `
      <div class="rk-row">
        <span class="rk-rank">${r.rank}</span>
        ${ava(r.name, r.me ? 3 : r.color)}
        <span class="rk-who"><p class="rk-name">${r.name}</p><p class="rk-tag">${r.tag}</p></span>
        <span class="rk-count">${r.count}<small>마리</small></span>
      </div>`;
    document.getElementById('rk-list').innerHTML = rows.slice(3).map(row).join('');

    // 내 순위 + 바로 위 친구까지 몇 마리 남았는지
    const me = rows.find((r) => r.me);
    const above = rows[me.rank - 2];
    const gap = above ? above.count - me.count + 1 : 0;
    document.getElementById('rk-me').innerHTML = `
      <span class="rk-rank">${me.rank}</span>
      ${ava('나', 3)}
      <span class="rk-who"><p class="rk-name">나</p>
        <p class="rk-tag">${above ? `${gap}마리만 더 찾으면 ${above.rank}등!` : '내가 1등이에요!'}</p></span>
      <span class="rk-count">${me.count}<small>마리</small></span>`;
  }

  document.querySelectorAll('.rk-seg button').forEach((b) => {
    b.addEventListener('click', () => {
      document.querySelectorAll('.rk-seg button').forEach((x) => x.setAttribute('aria-pressed', x === b));
      render(b.dataset.scope);
    });
  });
  render('friends');
})();
</script>
</body>
</html>
